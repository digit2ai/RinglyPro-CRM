<!-- ORBUP | Forgot password — request a reset link -->
<style>
.owl *{box-sizing:border-box}
.owl{--bg:#0a0a0e;--card:#16171f;--line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.18);
  --ink:#f2f4f8;--mut:#9aa3b2;--cyan:#22d3ee;--violet:#7c5cff;--magenta:#ec4899;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  position:fixed;inset:0;z-index:2147483000;overflow:auto;background:
    radial-gradient(900px 600px at 50% -10%,rgba(124,92,255,.20),transparent 60%),
    radial-gradient(700px 500px at 90% 110%,rgba(236,72,153,.15),transparent 60%),var(--bg);
  color:var(--ink);font-family:var(--font);display:flex;flex-direction:column}
.owl a{color:inherit;text-decoration:none}
.owl-top{display:flex;align-items:center;justify-content:space-between;padding:22px 30px}
.owl-top img{height:74px;width:auto;display:block}
.owl-top .x{color:var(--mut);font-size:14px;font-weight:600}.owl-top .x:hover{color:var(--ink)}
.owl-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 22px 60px;text-align:center}

/* The real OrbUp hero orb, at medium size. Same SVG the landing uses, in its
   idle state: no voice wiring, no wave canvas, no caption. */
.owl-orb{width:164px;height:164px;margin:0 auto 22px}
.owl .orb-svg{width:100%;height:100%;display:block;
  filter:drop-shadow(0 8px 32px rgba(34,211,238,.25)) drop-shadow(0 4px 18px rgba(139,92,246,.20))}
.owl .orb-ring-outer{transform-box:fill-box;transform-origin:120px 120px;animation:orbSpin 32s linear infinite}
.owl .orb-ring-mid{transform-box:fill-box;transform-origin:120px 120px;animation:orbSpinRev 22s linear infinite}
.owl .orb-ring-inner{transform-box:fill-box;transform-origin:120px 120px;animation:orbSpin 14s linear infinite}
.owl .orb-iris-segs{transform-box:fill-box;transform-origin:120px 120px;animation:orbSpin 9s linear infinite}
.owl .orb-scan{transform-box:fill-box;transform-origin:120px 120px;animation:orbScanSweep 6s linear infinite}
.owl .orb-particles{opacity:0}
@keyframes orbSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes orbSpinRev{from{transform:rotate(360deg)}to{transform:rotate(0)}}
@keyframes orbScanSweep{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.owl .orb-ring-outer,.owl .orb-ring-mid,.owl .orb-ring-inner,.owl .orb-iris-segs,.owl .orb-scan{animation:none}
  .owl .orb-svg animate{display:none}}

.owl h1{font-size:clamp(1.8rem,4vw,2.4rem);font-weight:800;letter-spacing:-.02em;margin:0 0 8px}
.owl .sub{color:var(--mut);font-size:15px;max-width:460px;margin:0 auto 28px;line-height:1.55}
.owl-field{max-width:420px;margin:0 auto 14px;text-align:left}
.owl-field label{display:block;font-size:13px;color:var(--mut);margin:0 0 7px;font-weight:600}
.owl-field input{width:100%;background:var(--card);border:1px solid var(--line2);color:var(--ink);
  border-radius:14px;padding:15px 16px;font:inherit;font-size:15.5px;transition:border-color .15s}
.owl-field input:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,92,255,.18)}
.owl-msg{max-width:420px;margin:2px auto 0;font-size:13px;min-height:18px;line-height:1.5}
.owl-msg.err{color:#fca5a5}.owl-msg.ok{color:#86efac}.owl-msg a{color:var(--cyan);font-weight:600}
.owl-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;cursor:pointer;font-family:inherit;
  font-weight:700;font-size:15px;border-radius:999px;padding:14px 34px;margin-top:14px;
  background:linear-gradient(135deg,var(--cyan),var(--violet));color:#06101f;transition:.15s}
.owl-btn:hover{transform:translateY(-1px);box-shadow:0 12px 34px rgba(124,92,255,.35)}
.owl-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.owl-alt{margin-top:24px;font-size:13.5px;color:var(--mut)}.owl-alt a{color:var(--ink);font-weight:600}
.owl-forgot{max-width:420px;margin:2px auto 0;text-align:right;font-size:13px}
.owl-forgot a{color:var(--mut)}.owl-forgot a:hover{color:var(--cyan)}
.owl-spin{width:16px;height:16px;border:2px solid rgba(6,16,31,.35);border-top-color:#06101f;border-radius:50%;animation:owlSpin .8s linear infinite;display:inline-block}
@media(max-width:560px){.owl-top{padding:16px 18px}.owl-top img{height:54px}.owl-orb{width:132px;height:132px}}
</style>

<div class="owl">
  <div class="owl-top">
    <a href="/orbup" aria-label="OrbUp"><img src="https://assets.cdn.filesafe.space/3lSeAHXNU9t09Hhp9oai/media/6a580b27c06d2134c6e06440.png" alt="OrbUp"></a>
    <a class="x" href="/orbup">Home</a>
  </div>
  <div class="owl-stage">
    <div class="owl-orb" aria-hidden="true">
  <svg class="orb-svg" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <radialGradient id="orbCore" cx="0.5" cy="0.45">
            <stop offset="0" stop-color="#a5f3fc" stop-opacity="1"/>
            <stop offset="0.25" stop-color="#22d3ee" stop-opacity="0.95"/>
            <stop offset="0.55" stop-color="#3b82f6" stop-opacity="0.85"/>
            <stop offset="0.82" stop-color="#8b5cf6" stop-opacity="0.7"/>
            <stop offset="1" stop-color="#ec4899" stop-opacity="0.5"/>
          </radialGradient>
          <radialGradient id="orbGlow" cx="0.5" cy="0.5">
            <stop offset="0" stop-color="#22d3ee" stop-opacity="0.4"/>
            <stop offset="0.45" stop-color="#8b5cf6" stop-opacity="0.22"/>
            <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="orbInnerCore" cx="0.5" cy="0.45">
            <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
            <stop offset="0.35" stop-color="#a5f3fc" stop-opacity="0.95"/>
            <stop offset="1" stop-color="#22d3ee" stop-opacity="0.4"/>
          </radialGradient>
          <linearGradient id="orbRingGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#22d3ee"/>
            <stop offset="0.4" stop-color="#3b82f6"/>
            <stop offset="0.75" stop-color="#8b5cf6"/>
            <stop offset="1" stop-color="#ec4899"/>
          </linearGradient>
          <linearGradient id="orbScan" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
            <stop offset="0.5" stop-color="#a5f3fc" stop-opacity="0.9"/>
            <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <circle class="orb-glow" cx="120" cy="120" r="112" fill="url(#orbGlow)">
          <animate attributeName="r" values="104;120;104" dur="5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/>
        </circle>
        <g class="orb-ring-outer">
          <circle cx="120" cy="120" r="108" fill="none" stroke="url(#orbRingGrad)" stroke-width="0.6" stroke-dasharray="2 4" opacity="0.55"/>
          <circle cx="120" cy="12"  r="2.5" fill="#22d3ee" opacity="0.9"/>
          <circle cx="228" cy="120" r="2.5" fill="#3b82f6" opacity="0.9"/>
          <circle cx="120" cy="228" r="2.5" fill="#ec4899" opacity="0.9"/>
          <circle cx="12"  cy="120" r="2.5" fill="#8b5cf6" opacity="0.9"/>
        </g>
        <g class="orb-ring-mid">
          <circle cx="120" cy="120" r="96" fill="none" stroke="url(#orbRingGrad)" stroke-width="0.8" stroke-dasharray="6 3" opacity="0.7"/>
          <g fill="#a5f3fc">
            <circle cx="120" cy="24"  r="1.5"/><circle cx="188" cy="52"  r="1.5"/>
            <circle cx="216" cy="120" r="1.5"/><circle cx="188" cy="188" r="1.5"/>
            <circle cx="120" cy="216" r="1.5"/><circle cx="52"  cy="188" r="1.5"/>
            <circle cx="24"  cy="120" r="1.5"/><circle cx="52"  cy="52"  r="1.5"/>
          </g>
        </g>
        <circle class="orb-ring-inner" cx="120" cy="120" r="84" fill="none" stroke="url(#orbRingGrad)" stroke-width="1" stroke-dasharray="10 2 2 2" opacity="0.85"/>
        <g class="orb-scan">
          <line x1="120" y1="120" x2="120" y2="32" stroke="url(#orbScan)" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
        </g>
        <circle class="orb-ring orb-ring-1" cx="120" cy="120" r="92" fill="none" stroke="url(#orbRingGrad)" stroke-width="1.5" stroke-opacity="0.45"/>
        <circle class="orb-ring orb-ring-2" cx="120" cy="120" r="84" fill="none" stroke="url(#orbRingGrad)" stroke-width="1.5" stroke-opacity="0.55"/>
        <circle class="orb-ring orb-ring-3" cx="120" cy="120" r="76" fill="none" stroke="url(#orbRingGrad)" stroke-width="1.5" stroke-opacity="0.65"/>
        <g class="orb-particles">
          <circle class="orb-particle" cx="120" cy="36" r="2.5" fill="#22d3ee"/>
          <circle class="orb-particle" cx="120" cy="36" r="2" fill="#8b5cf6" style="animation-delay:-1.2s"/>
          <circle class="orb-particle" cx="120" cy="36" r="2.5" fill="#ec4899" style="animation-delay:-2.4s"/>
          <circle class="orb-particle" cx="120" cy="36" r="2" fill="#3b82f6" style="animation-delay:-3.6s"/>
        </g>
        <circle class="orb-iris-outer" cx="120" cy="120" r="66" fill="none" stroke="url(#orbRingGrad)" stroke-width="1" opacity="0.5">
          <animate attributeName="r" values="64;70;64" dur="4.5s" repeatCount="indefinite"/>
        </circle>
        <circle class="orb-iris-segs" cx="120" cy="120" r="56" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="14 18" stroke-linecap="round" opacity="0.75"/>
        <circle class="orb-core" cx="120" cy="120" r="48" fill="url(#orbCore)">
          <animate attributeName="r" values="44;52;44" dur="4.5s" repeatCount="indefinite"/>
        </circle>
        <circle class="orb-core-inner" cx="120" cy="120" r="32" fill="url(#orbCore)" opacity="0.95">
          <animate attributeName="r" values="34;28;34" dur="4.5s" repeatCount="indefinite"/>
        </circle>
        <circle class="orb-core-pinpoint" cx="120" cy="120" r="14" fill="url(#orbInnerCore)">
          <animate attributeName="r" values="12;18;12" dur="2.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.85;1;0.85" dur="2.2s" repeatCount="indefinite"/>
        </circle>
        <ellipse class="orb-highlight" cx="108" cy="106" rx="14" ry="9" fill="rgba(255,255,255,0.45)" opacity="0.55">
          <animate attributeName="opacity" values="0.35;0.75;0.35" dur="4.5s" repeatCount="indefinite"/>
        </ellipse>
        <g class="orb-crosshair" opacity="0.35" stroke="#a5f3fc" stroke-width="0.6">
          <line x1="120" y1="2"   x2="120" y2="10"/><line x1="120" y1="230" x2="120" y2="238"/>
          <line x1="2"   y1="120" x2="10"  y2="120"/><line x1="230" y1="120" x2="238" y2="120"/>
        </g>
      </svg>
    </div>
    <h1>Reset your password</h1>
    <p class="sub">Enter your email and we will send you a link to set a new password. The link is good for one hour.</p>
    <form id="owl-form" autocomplete="on">
      <div class="owl-field"><label>Email</label><input id="owl-email" type="email" placeholder="you@company.com" autocomplete="email" autofocus></div>
      <div class="owl-msg" id="owl-msg" aria-live="polite"></div>
      <div><button class="owl-btn" id="owl-go" type="submit">Send the link &rarr;</button></div>
    </form>
    <div class="owl-alt"><a href="/orbup/login">Back to sign in</a></div>
  </div>
</div>

<script>
(function(){
  var BASE='/orbup';
  var form=document.getElementById('owl-form');
  var emailEl=document.getElementById('owl-email');
  var msg=document.getElementById('owl-msg');
  var go=document.getElementById('owl-go');

  try{ var c=JSON.parse(localStorage.getItem('d2ai_contact')||'{}'); if(c.email) emailEl.value=c.email; }catch(e){}

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var email=(emailEl.value||'').trim();
    msg.className='owl-msg'; msg.textContent='';
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ msg.className='owl-msg err'; msg.textContent='Please enter a valid email.'; emailEl.focus(); return; }
    go.disabled=true; go.innerHTML='<span class="owl-spin"></span> Sending…';
    fetch('/projects/api/v1/intake/orbup/forgot',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:email,brand:'orbup'})})
      .then(function(r){ return r.json().then(function(j){ return {status:r.status,json:j}; }); })
      .then(function(res){
        var j=res.json||{};
        if(res.status!==200 || !j.ok){
          go.disabled=false; go.innerHTML='Send the link &rarr;';
          msg.className='owl-msg err'; msg.textContent=j.error||'Something went wrong. Please try again.';
          return;
        }
        // Deliberately the same answer whether or not the account exists.
        var m='If that email has a workspace, the reset link is on its way. Check your inbox (and spam).';
        if(j.dev_link){ m+='<br><br>Email is not configured on this server, so here is the link: <a href="'+j.dev_link+'">Set a new password &rarr;</a>'; }
        msg.className='owl-msg ok'; msg.innerHTML=m;
        go.innerHTML='Link sent';
      })
      .catch(function(){ go.disabled=false; go.innerHTML='Send the link &rarr;'; msg.className='owl-msg err'; msg.textContent='Could not reach the server. Please try again.'; });
  });
})();
</script>
