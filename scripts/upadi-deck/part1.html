<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>HISPANOTEC — La plataforma de negocio entre asociaciones | UPADI</title>
<style>
/* ===========================================================================
   HISPANOTEC para UPADI — un solo archivo, sin dependencias externas.
   Tipografía del sistema a propósito: el deck tiene que abrir igual sin
   conexión en una sala de congreso. El simulador va INCRUSTADO y vivo, no
   como captura: una captura se proyecta borrosa y envejece el día que
   cambia el producto.
   =========================================================================== */
:root{
  --navy:#07345B; --deep:#04182b; --mid:#0a2b47;
  --accent:#509BCD; --accent-lt:#7db8de; --accent-dk:#0f5a8f;
  --ink:#eaf2f8; --mut:rgba(234,242,248,.68); --faint:rgba(234,242,248,.44);
  --line:rgba(125,184,222,.20); --card:rgba(255,255,255,.045);
  --ok:#3ecf7a; --warn:#f0b849; --no:#e8836f;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Roboto,Helvetica,Arial,sans-serif;
  --serif:'Iowan Old Style','Palatino Linotype','Source Serif 4',Georgia,serif;
  --nav-h:56px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans); color:var(--ink); background:var(--deep);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
a{color:inherit;text-decoration:none}

/* ── barra ──────────────────────────────────────────────────────────── */
.bar{
  position:fixed; top:0; left:0; right:0; height:var(--nav-h); z-index:60;
  display:flex; align-items:center; gap:14px; padding:0 20px;
  background:rgba(4,24,43,.92); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.bar img{height:30px;width:30px;border-radius:7px;background:#fff;padding:2px}
.bar b{font-size:14.5px;font-weight:800;letter-spacing:1.6px}
.bar .x{font-size:12px;color:var(--faint);letter-spacing:1px}
.bar .sp{flex:1}
.dots{display:flex;gap:6px}
.dots button{
  width:9px;height:9px;border-radius:50%;border:0;padding:0;cursor:pointer;
  background:rgba(255,255,255,.22);transition:all .2s;
}
.dots button.on{background:var(--accent);transform:scale(1.45)}
.dots button:hover{background:var(--accent-lt)}
.count{font-size:12px;color:var(--faint);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.prog{position:fixed;top:var(--nav-h);left:0;height:2px;background:var(--accent);z-index:61;width:0;transition:width .25s}

/* ── secciones ──────────────────────────────────────────────────────── */
.sec{
  min-height:100vh; padding:calc(var(--nav-h) + 46px) 28px 64px;
  display:flex; flex-direction:column; justify-content:center;
  max-width:1280px; margin:0 auto; position:relative;
}
.sec > .in{width:100%}
.kicker{
  display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:2.2px;
  text-transform:uppercase;color:var(--accent-lt);
  border:1px solid rgba(80,155,205,.42);background:rgba(80,155,205,.12);
  border-radius:20px;padding:5px 14px;margin-bottom:18px;
}
h1{font-size:clamp(30px,5.2vw,58px);font-weight:800;letter-spacing:-1.2px;line-height:1.08}
h2{font-size:clamp(25px,3.6vw,42px);font-weight:800;letter-spacing:-.8px;line-height:1.14;margin-bottom:14px}
h3{font-size:17px;font-weight:700;color:var(--accent-lt);margin-bottom:8px}
.lede{font-size:clamp(15px,1.6vw,19px);color:var(--mut);line-height:1.62;max-width:820px;margin-bottom:26px}
.lede b{color:var(--ink);font-weight:600}
p{line-height:1.62}
.note{font-size:13.5px;color:var(--faint);line-height:1.6;margin-top:18px;max-width:840px}
.note b{color:var(--accent-lt)}

/* ── portada ────────────────────────────────────────────────────────── */
.cover{text-align:center;align-items:center}
.cover .mark{width:120px;height:120px;border-radius:30px;background:#fff;padding:18px;margin:0 auto 30px;
  box-shadow:0 22px 60px rgba(0,0,0,.5)}
.cover h1{max-width:960px;margin:0 auto}
.cover .sub{font-family:var(--serif);font-size:clamp(17px,2.1vw,23px);color:var(--mut);margin-top:20px;font-style:italic}
.cover .to{margin-top:38px;font-size:13px;letter-spacing:2.4px;text-transform:uppercase;color:var(--faint)}
.cover .to b{color:var(--accent-lt);font-weight:700}
.hint{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--faint);
  display:flex;align-items:center;gap:8px}
.hint kbd{font:600 11px var(--sans);border:1px solid var(--line);border-radius:5px;padding:2px 7px;color:var(--mut)}

/* ── tarjetas / rejillas ────────────────────────────────────────────── */
.grid{display:grid;gap:15px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;
}
.card h4{font-size:15.5px;font-weight:700;margin-bottom:7px;color:var(--ink)}
.card p{font-size:13.6px;color:var(--mut)}
.card .ic{width:34px;height:34px;margin-bottom:12px;color:var(--accent)}
.card .ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.stat{text-align:center;padding:24px 16px}
.stat b{display:block;font-size:clamp(34px,4.6vw,52px);font-weight:800;color:var(--accent-lt);
  letter-spacing:-1.5px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:12.5px;color:var(--mut);margin-top:9px;line-height:1.45}

.split{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center}

/* ── diagrama del ecosistema ────────────────────────────────────────── */
.eco{position:relative}
#ecoSvg{width:100%;height:auto;display:block;max-height:64vh}
.eco-cap{
  text-align:center;margin-top:12px;min-height:46px;
  font-size:14px;color:var(--mut);max-width:760px;margin-inline:auto;line-height:1.55;
}
.eco-cap b{color:var(--accent-lt)}
.n-ring{fill:none;stroke:var(--line);stroke-width:1}
.n-link{fill:none;stroke:rgba(125,184,222,.26);stroke-width:1.4}
.n-flow{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 11;opacity:0}
.n-node circle{fill:#0b2740;stroke:rgba(125,184,222,.42);stroke-width:1.5;transition:all .45s}
.n-node .ico{stroke:var(--accent-lt);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke .45s}
.n-node text{fill:var(--mut);font:600 13px var(--sans);text-anchor:middle;transition:fill .45s}
.n-node tspan.s{font-weight:400;font-size:11px;fill:var(--faint)}
.n-node{cursor:pointer}
.n-node.on circle{fill:#134463;stroke:var(--accent);stroke-width:2.5}
.n-node.on .ico{stroke:#fff}
.n-node.on text{fill:#fff}
.n-node.human circle{fill:#132a1e;stroke:rgba(62,207,122,.5)}
.n-node.human .ico{stroke:var(--ok)}
.n-node.human.on circle{stroke:var(--ok);fill:#1b4430}
.brain circle.core{fill:url(#bg1);stroke:var(--accent);stroke-width:2}
.brain text.t{fill:#fff;font:800 15px var(--sans);text-anchor:middle;letter-spacing:1.4px}
.brain text.s{fill:var(--accent-lt);font:600 10.5px var(--sans);text-anchor:middle;letter-spacing:1.6px}
.pulse{fill:none;stroke:var(--accent);stroke-width:1.5;opacity:0}
@keyframes pr{0%{r:62px;opacity:.55}100%{r:118px;opacity:0}}
@keyframes fl{to{stroke-dashoffset:-160}}
.anim .pulse{animation:pr 3.2s ease-out infinite}
.anim .pulse.b{animation-delay:1.6s}
.anim .n-flow.go{opacity:.95;animation:fl 1.1s linear infinite}
