<!-- Alta de asociado HISPANOTEC. Replaces the WordPress form on /formulario-de-interes/.
     Same fields as camaravirtual.app/cv-105/signup-member; posts to the cv-105 member signup, so the
     account and password live in the digital ecosystem, not WordPress. Payment (100 EUR/year) runs on
     HISPANOTEC's own Stripe account when CHAMBER_STRIPE_KEY_CV_105 is set. Inserted by snapshot.js. -->
<div class="hx-signup">
<form class="elementor-form" id="hxSignup" novalidate>

<div class="elementor-field-group elementor-column elementor-field-group-first_name elementor-col-50 elementor-field-required">
<label for="hx-first_name" class="elementor-field-label">Nombre</label>
<input size="1" type="text" id="hx-first_name" name="first_name" class="elementor-field elementor-size-sm elementor-field-textual" required autocomplete="given-name">
</div>
<div class="elementor-field-group elementor-column elementor-field-group-last_name elementor-col-50 elementor-field-required">
<label for="hx-last_name" class="elementor-field-label">Apellido(s)</label>
<input size="1" type="text" id="hx-last_name" name="last_name" class="elementor-field elementor-size-sm elementor-field-textual" required autocomplete="family-name">
</div>
<div class="elementor-field-group elementor-column elementor-field-group-email elementor-col-50 elementor-field-required">
<label for="hx-email" class="elementor-field-label">Correo electrónico</label>
<input size="1" type="email" id="hx-email" name="email" class="elementor-field elementor-size-sm elementor-field-textual" required autocomplete="email">
</div>
<div class="elementor-field-group elementor-column elementor-field-group-phone elementor-col-50">
<label for="hx-phone" class="elementor-field-label">Teléfono (opcional)</label>
<input size="1" type="tel" id="hx-phone" name="phone" class="elementor-field elementor-size-sm elementor-field-textual" autocomplete="tel" placeholder="+34 600 000 000">
</div>
<div class="elementor-field-group elementor-column elementor-field-group-password elementor-col-50 elementor-field-required">
<label for="hx-password" class="elementor-field-label">Contraseña (mínimo 8 caracteres)</label>
<input size="1" type="password" id="hx-password" name="password" class="elementor-field elementor-size-sm elementor-field-textual" required minlength="8" autocomplete="new-password">
</div>
<div class="elementor-field-group elementor-column elementor-field-group-password_confirm elementor-col-50 elementor-field-required">
<label for="hx-password_confirm" class="elementor-field-label">Confirmar contraseña</label>
<input size="1" type="password" id="hx-password_confirm" name="password_confirm" class="elementor-field elementor-size-sm elementor-field-textual" required minlength="8" autocomplete="new-password">

<input size="1" type="text" id="hx-company_name" name="company_name" class="elementor-field elementor-size-sm elementor-field-textual">

<div class="elementor-field-group elementor-column elementor-field-group-years_experience elementor-col-50">

</div>
<div class="elementor-field-group elementor-column elementor-field-group-website_url elementor-col-50">

<div class="elementor-field-group elementor-column elementor-col-100 elementor-field-type-acceptance elementor-field-required">

<div class="hx-account">

<div class="hx-forgot-row"><input type="email" id="hx-forgot-email" required class="elementor-field elementor-size-sm elementor-field-textual" autocomplete="email"><button type="submit" class="elementor-button elementor-size-sm"><span class="elementor-button-text">Enviar enlace</span></button></div>
