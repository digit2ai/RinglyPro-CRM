<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Hispanotec Digital — Estructura</title>
<style>
/* ===========================================================================
   Estructura de Hispanotec Digital — constelación animada.

   Mismo lenguaje visual que el diagrama del cerebro MCP de Digit2AI: anillos
   concéntricos girando despacio en direcciones alternas, enlaces de guiones
   que fluyen del cerebro hacia fuera, cajas rectangulares en monoespaciada y
   encendido por secuencia. Debajo queda el detalle por capas, que es lo que
   se puede imprimir.

   Un solo archivo, sin recursos externos.
   =========================================================================== */
:root{
  --navy:#07345B; --deep:#04182b; --accent:#509BCD; --accent-lt:#7db8de;
  --ink:#eaf2f8; --mut:rgba(234,242,248,.70); --faint:rgba(234,242,248,.46);
  --line:rgba(125,184,222,.22); --card:rgba(255,255,255,.05);
  --wire:125,184,222; --ok:#3ecf7a; --warn:#f0b849; --no:#e8836f;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--deep);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.page{width:1600px;margin:0 auto;padding:36px 44px 34px}

.head{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.head img{width:46px;height:46px;border-radius:11px;background:#fff;padding:4px}
.head h1{font-size:27px;font-weight:800;letter-spacing:-.5px}
.head .s{font-size:13.5px;color:var(--faint);margin-top:3px}
.head .sp{flex:1}
.key{display:flex;gap:16px;font-size:11px;color:var(--mut)}
.key i{font-style:normal;display:inline-flex;align-items:center;gap:6px}
.key b{width:9px;height:9px;border-radius:50%;display:inline-block}
.k1{background:var(--ok)} .k2{background:var(--warn)} .k3{background:var(--no)}

/* ── la constelación ────────────────────────────────────────────────── */
.cstwrap{
  background:radial-gradient(ellipse 70% 70% at 50% 46%, rgba(80,155,205,.09), transparent 70%),
             linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.015));
  border:1px solid var(--line);border-radius:18px;overflow:hidden;position:relative;
}
.cst{display:block;width:100%;height:auto;font-family:var(--mono)}
.cstcap{padding:0 30px 20px;text-align:center;color:var(--mut);font-size:13.5px;min-height:52px;line-height:1.55}
.cstcap b{color:var(--accent-lt)}
.cstcap code{font-family:var(--mono);font-size:12.5px;color:var(--accent-lt);
  background:rgba(80,155,205,.12);border-radius:4px;padding:1px 5px}

/* anillos: giran despacio y en direcciones alternas */
.cst .rings circle{fill:none;stroke:rgba(var(--wire),.13);stroke-width:1;
  transform-origin:800px 430px;animation:cstspin 90s linear infinite}
.cst .rings circle:nth-child(even){animation-direction:reverse;animation-duration:130s}
@keyframes cstspin{to{transform:rotate(360deg)}}

/* enlaces: guiones viajando del cerebro hacia fuera */
.cst .lk{fill:none;stroke:rgba(var(--wire),.28);stroke-width:1.4;stroke-dasharray:5 13;
  animation:cstflow 2.6s linear infinite}
.cst .lk.inb{stroke:rgba(240,184,73,.42);animation-direction:reverse}
@keyframes cstflow{to{stroke-dashoffset:-36}}

/* cajas */
.cst .slot rect{fill:rgba(255,255,255,.05);stroke:rgba(var(--wire),.22);stroke-width:1.2;
  transition:fill .5s,stroke .5s}
.cst .slot text{fill:var(--faint);font-size:13px;letter-spacing:.06em;text-anchor:middle;transition:fill .5s}
.cst .slot .sub{fill:rgba(234,242,248,.34);font-size:11px;letter-spacing:.02em}
.cst .slot.on rect{fill:rgba(80,155,205,.20);stroke:var(--accent);stroke-width:2}
.cst .slot.on text{fill:#fff}
.cst .slot.wp rect{stroke:rgba(240,184,73,.45)}
.cst .slot.wp.on rect{fill:rgba(240,184,73,.18);stroke:var(--warn)}
.cst .slot.gap rect{stroke:rgba(232,131,111,.45);stroke-dasharray:5 4}
.cst .slot.gap.on rect{fill:rgba(232,131,111,.14);stroke:var(--no)}

/* el cerebro */
.cst .brain rect.shell{fill:rgba(10,43,71,.92);stroke:rgba(var(--wire),.34);stroke-width:1.5}
.cst .brain rect.core{fill:rgba(80,155,205,.12);stroke:rgba(80,155,205,.6);stroke-width:1.6}
.cst .brain .top{fill:var(--accent);font-size:12px;letter-spacing:.24em;text-anchor:middle}
.cst .brain .big{fill:#fff;font-size:27px;font-weight:700;letter-spacing:.12em;text-anchor:middle}
.cst .brain .slotlbl{fill:var(--faint);font-size:11px;letter-spacing:.11em;text-anchor:middle}
.cst .brain rect.chip{fill:rgba(255,255,255,.05);stroke:rgba(var(--wire),.2);stroke-width:1}
.cst .pulse{fill:none;stroke:rgba(80,155,205,.5);stroke-width:1.5;opacity:0;
  animation:cstpulse 3.4s ease-out infinite}
.cst .pulse.b{animation-delay:1.7s}
@keyframes cstpulse{0%{r:120px;opacity:.5}100%{r:230px;opacity:0}}

.cst .blink{animation:cstblink 2s ease-in-out infinite}
@keyframes cstblink{0%,100%{opacity:1}50%{opacity:.25}}
.cst .tag{font-size:10.5px;letter-spacing:.14em;text-anchor:middle}

@media(prefers-reduced-motion:reduce){
  .cst .rings circle,.cst .lk,.cst .pulse,.cst .blink{animation:none}
  .cst .pulse{opacity:.22}
}

/* ── detalle por capas, debajo ──────────────────────────────────────── */
.layers{margin-top:22px}
.layer{border:1px solid var(--line);border-radius:13px;background:var(--card);padding:14px 17px 16px;margin-bottom:11px}
.layer .lt{display:flex;align-items:baseline;gap:12px;margin-bottom:11px}
.layer .lt b{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--accent-lt)}
.layer .lt span{font-size:12.5px;color:var(--faint)}
.row{display:flex;gap:11px}
.box{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.box h4{font-size:13.5px;font-weight:700;margin-bottom:5px;display:flex;align-items:center;gap:8px}
.box p{font-size:12px;color:var(--mut);line-height:1.5}
.box code{font-family:var(--mono);font-size:11px;color:var(--accent-lt);
  background:rgba(80,155,205,.12);border-radius:4px;padding:1px 5px}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.d-ok{background:var(--ok)} .d-w{background:var(--warn)} .d-n{background:var(--no)}
.rule{font-size:11.6px;color:var(--faint);margin-top:10px;padding-top:9px;border-top:1px solid var(--line);line-height:1.55}
.rule b{color:var(--accent-lt)}

.foot{margin-top:16px;display:flex;align-items:baseline;gap:14px;font-size:11.5px;color:var(--faint)}
.foot .sp{flex:1}
.foot a{color:var(--accent-lt);font-weight:700;border-bottom:1px solid rgba(125,184,222,.4)}
.foot code{font-family:var(--mono);color:var(--accent-lt)}
@media print{ body{background:#fff} .page{width:auto} }
</style>
</head>
<body>
<div class="page">
