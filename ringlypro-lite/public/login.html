<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>RinglyPro Lite</title>
<link rel="icon" type="image/png" href="/favicon-32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#0d1320" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="RinglyPro Lite" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
  :root{--bg:#0d1320;--card:#141b29;--line:#243049;--txt:#e9eef7;--mut:#8a98b0;--acc:#6a4bff;--acc2:#bda4ff;--ok:#3ad29f;--err:#ff6b6b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100svh;display:flex;align-items:center;justify-content:center;padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}
  .card{width:100%;max-width:400px;background:linear-gradient(180deg,var(--card),#0e1421);border:1px solid var(--line);border-radius:20px;padding:28px}
  .brand{font-weight:800;font-size:22px;margin-bottom:4px}
  .brand span{color:var(--acc2)}
  .sub{color:var(--mut);font-size:14px;margin-bottom:22px}
  label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
  input{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:#0f1626;color:var(--txt);font-size:16px}
  button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
  button:active{transform:translateY(1px)}
  .row{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:14px}
  a{color:var(--acc2);text-decoration:none}
  .msg{margin-top:14px;font-size:14px;min-height:18px}
  .lang{position:fixed;top:calc(12px + env(safe-area-inset-top));right:calc(16px + env(safe-area-inset-right));font-size:13px;color:var(--mut);cursor:pointer;z-index:9}
</style>
</head>
<body>
<div class="lang" id="lang">ES</div>
<div class="card">
  <div class="brand"><img src="/icon-192.png" alt="" style="height:26px;width:26px;border-radius:7px;vertical-align:middle;margin-right:8px" />RinglyPro <span>Lite</span></div>
  <div class="sub" data-i="tagline">Never miss a call. The AI takes a message or books the appointment.</div>
  <label data-i="email">Email</label>
  <input id="email" type="email" autocomplete="username" />
  <label data-i="password">Password</label>
  <input id="password" type="password" autocomplete="current-password" />
  <button id="go" data-i="login">Log in</button>
  <div class="msg" id="msg"></div>
  <div class="row"><span data-i="noacct">No account?</span> <a href="/signup" data-i="signup">Create one</a></div>
</div>
<script>
  const I={en:{tagline:"Never miss a call. The AI takes a message or books the appointment.",email:"Email",password:"Password",login:"Log in",noacct:"No account?",signup:"Create one",bad:"Wrong email or password."},
          es:{tagline:"No pierda ninguna llamada. La IA toma el mensaje o agenda la cita.",email:"Correo",password:"Contraseña",login:"Ingresar",noacct:"¿Sin cuenta?",signup:"Crear una",bad:"Correo o contraseña incorrectos."}};
  let lang=localStorage.getItem('lite_lang')||'en';
  function apply(){document.querySelectorAll('[data-i]').forEach(e=>{const k=e.getAttribute('data-i');if(I[lang][k])e.textContent=I[lang][k]});document.getElementById('lang').textContent=lang==='en'?'ES':'EN';document.documentElement.lang=lang}
  document.getElementById('lang').onclick=()=>{lang=lang==='en'?'es':'en';localStorage.setItem('lite_lang',lang);apply()};
  apply();
  if('serviceWorker'in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{})}
  document.getElementById('go').onclick=async()=>{
    const msg=document.getElementById('msg');msg.textContent='';
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',
      body:JSON.stringify({email:email.value,password:password.value})});
    if(r.ok){location.href='/dashboard'}else{msg.style.color='#ff6b6b';msg.textContent=I[lang].bad}
  };
</script>
</body>
</html>
