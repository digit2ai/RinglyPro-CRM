<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>RinglyPro Lite</title>
<link rel="icon" type="image/png" href="/favicon-32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#0d1320" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="RinglyPro Lite" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
  :root{--bg:#0d1320;--card:#141b29;--line:#243049;--txt:#e9eef7;--mut:#8a98b0;--acc:#6a4bff;--acc2:#bda4ff;--ok:#3ad29f;--warn:#ffb454;--err:#ff6b6b;--inp:#0f1626}
  html[data-theme="light"]{--bg:#f4f7fb;--card:#ffffff;--line:#e5e7eb;--txt:#111827;--mut:#6b7280;--acc:#2563eb;--acc2:#1d4ed8;--ok:#0f9d6e;--warn:#c2740a;--err:#dc2626;--inp:#eef2f7}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:calc(78px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
  header{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 12px calc(16px + env(safe-area-inset-left));border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  .brand{font-weight:800}.brand span{color:var(--acc2)}
  .lang{font-size:13px;color:var(--mut);cursor:pointer}
  main{max-width:560px;margin:0 auto;padding:14px}
  .view{display:none}.view.on{display:block}
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .item .top{display:flex;justify-content:space-between;align-items:center}
  .name{font-weight:700}.when{color:var(--mut);font-size:12px}
  .body{color:var(--mut);font-size:14px;margin-top:6px}
  .badge{background:var(--acc);color:#fff;font-size:11px;border-radius:10px;padding:2px 7px;margin-left:6px}
  .unread{border-left:3px solid var(--acc)}
  .call{display:inline-block;margin-top:8px;color:var(--ok);text-decoration:none;font-weight:700;font-size:14px}
  .day{margin:16px 0 6px;color:var(--acc2);font-weight:700;font-size:14px}
  label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
  input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--inp);color:var(--txt);font-size:16px}
  button{padding:11px 14px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:700;cursor:pointer}
  button.sm{padding:7px 10px;font-size:13px}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
  .empty{color:var(--mut);text-align:center;padding:40px 10px}
  .avail-row{display:flex;gap:6px;align-items:center;margin:6px 0}
  .avail-row select,.avail-row input{padding:8px}
  nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);z-index:6}
  nav a{flex:1;text-align:center;padding:14px 0;color:var(--mut);text-decoration:none;font-size:12px;font-weight:600}
  nav a.on{color:var(--acc2)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
  .msg{font-size:13px;color:var(--mut);min-height:16px}
  .fwd{font-family:ui-monospace,Menlo,monospace;background:var(--inp);border:1px dashed var(--acc);border-radius:8px;padding:6px 10px;display:inline-block}
  .telbtn{flex:1;min-width:96px;text-align:center;text-decoration:none;font-weight:800;border-radius:10px;padding:13px 10px;font-size:15px}
  .telbtn.on{background:var(--ok);color:#04231a}
  .telbtn.off{background:var(--err);color:#2a0606}
  .telbtn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);flex:0 0 auto;min-width:64px}
  /* Messages filter chips + bottom search */
  #v-messages{padding-bottom:54px}
  .msgtools{display:flex;gap:8px;margin-bottom:12px}
  .chip{background:var(--card);border:1px solid var(--line);color:var(--mut);padding:7px 14px;border-radius:20px;font-size:13px;font-weight:700}
  .chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  #msgSearchBar{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);padding:8px calc(12px + env(safe-area-inset-right)) 8px calc(12px + env(safe-area-inset-left));z-index:6;display:none}
  #msgSearchBar.on{display:block}
  #msgSearch{max-width:560px;margin:0 auto;display:block;font-size:15px;padding:10px 12px}
  /* Swipe-to-act on a message row */
  .swipewrap{position:relative;overflow:hidden;border-radius:14px;margin-bottom:10px}
  .swipewrap .item{margin-bottom:0;position:relative;z-index:2;touch-action:pan-y;transition:transform .18s ease;will-change:transform}
  .swipe-actions{position:absolute;inset:0;display:flex;align-items:stretch;justify-content:space-between;z-index:1;border-radius:14px;overflow:hidden;font-weight:800}
  .swipe-actions .sms-hint{background:var(--ok);color:#04231a;display:flex;align-items:center;padding:0 22px}
  .swipe-actions .del-hint{background:var(--err);color:#fff;display:flex;align-items:center;padding:0 22px;margin-left:auto}
  /* Calendar contact action buttons */
  .apptbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .actbtn{text-decoration:none;font-weight:700;font-size:13px;padding:7px 12px;border-radius:10px}
  .actbtn.wa{background:#25d366;color:#04231a}
  .actbtn.sms{background:transparent;border:1px solid var(--line);color:var(--txt)}
  /* Recharge bottom sheet modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
  .modal.on{display:flex}
  .sheet{background:var(--card);border:1px solid var(--line);border-top-left-radius:18px;border-top-right-radius:18px;width:100%;max-width:560px;padding:20px calc(16px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
  .amtgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .amtbtn{padding:16px 0;font-size:18px;font-weight:800;border-radius:12px;background:var(--acc);color:#fff;border:0;cursor:pointer}
  .amtbtn:disabled{opacity:.5}
</style>
<script>/* apply saved theme before paint to avoid a flash */(function(){try{var t=localStorage.getItem('lite_theme');if(t!=='light'&&t!=='dark')t='dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
<header>
  <div class="brand"><img src="/icon-192.png" alt="" style="height:24px;width:24px;border-radius:6px;vertical-align:middle;margin-right:7px" />RinglyPro <span>Lite</span></div>
  <div style="display:flex;align-items:center;gap:14px"><span class="lang" id="bell" title="Alerts" style="cursor:pointer" data-i="alerts">Alerts</span><span class="lang" id="lang">ES</span></div>
</header>
<div id="payBanner" style="display:none;background:#3a0f14;border-bottom:1px solid var(--err);color:#ffd0d0;padding:12px 16px;font-size:14px;text-align:center">
  <span data-i="payMsg">Your free trial ended. Add payment to keep answering calls.</span>
  <button class="sm" id="payNow" style="margin-left:10px" data-i="payNow">Add payment</button>
</div>
<main>
  <!-- MESSAGES -->
  <section class="view on" id="v-messages">
    <div class="msgtools">
      <button class="chip on" id="fAll" data-filter="all" data-i="fall">All</button>
      <button class="chip" id="fUnread" data-filter="unread" data-i="funread">Unread</button>
    </div>
    <div id="messages"></div>
  </section>
  <!-- CALENDAR -->
  <section class="view" id="v-calendar">
    <div id="calendar"></div>
  </section>
  <!-- SETTINGS -->
  <section class="view" id="v-settings">
    <div class="card">
      <div class="day" data-i="biz">Business</div>
      <label data-i="bizname">Business name</label><input id="set_business_name" />
      <label data-i="ownerph">Owner mobile (SMS alerts)</label><input id="set_owner_phone" />
      <label data-i="transferph">Transfer-to number (live person)</label><input id="set_transfer_number" placeholder="+1..." />
      <label data-i="glang">Greeting language</label>
      <select id="set_locale"><option value="en">English</option><option value="es">Español</option></select>
      <label data-i="tz">Timezone</label><input id="set_timezone" />
      <div style="margin-top:14px"><button id="saveBiz" class="sm" data-i="save">Save</button> <span class="msg" id="bizMsg"></span></div>
    </div>
    <div class="card">
      <div class="day" data-i="avail">Availability</div>
      <div id="avail"></div>
      <button class="sm ghost" id="addRow" data-i="addhours">+ Add hours</button>
      <div style="margin-top:12px"><button id="saveAvail" class="sm" data-i="save">Save</button> <span class="msg" id="availMsg"></span></div>
    </div>
    <div class="card">
      <div class="day" data-i="fwd">Call forwarding</div>
      <div class="msg" id="fwdNum" style="margin-bottom:8px">—</div>
      <label data-i="fmode">Forwarding mode</label>
      <select id="fwdMode">
        <option value="direct" data-i="mdirect">Forward all calls (AI always answers)</option>
        <option value="noanswer" data-i="mnoans">After 2 rings (if I don't answer)</option>
      </select>
      <label data-i="carrier">Carrier</label><select id="fwdCarrier"></select>
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
        <a class="telbtn on" id="fwdOn" href="#" data-i="turnon">Turn ON</a>
        <a class="telbtn off" id="fwdOff" href="#" data-i="turnoff">Turn OFF</a>
        <a class="telbtn ghost" id="fwdCheck" href="#" data-i="check">Check</a>
      </div>
      <div style="margin-top:12px;font-size:13px;color:var(--mut)">
        <div style="display:flex;align-items:center;gap:8px;margin:4px 0"><span data-i="onlabel">ON code</span>: <span class="fwd" id="fwdOnCode">—</span> <button class="sm ghost" onclick="copyCode('fwdOnCode')" data-i="copy">Copy</button></div>
        <div style="display:flex;align-items:center;gap:8px;margin:4px 0"><span data-i="offlabel">OFF code</span>: <span class="fwd" id="fwdOffCode">—</span> <button class="sm ghost" onclick="copyCode('fwdOffCode')" data-i="copy">Copy</button></div>
      </div>
      <div class="msg" id="fwdReminder" style="margin-top:10px"></div>
    </div>
    <div class="card" id="billCard" style="display:none">
      <div class="day" data-i="bill">Billing</div>
      <div class="msg" id="billStatus">—</div>
      <div class="msg" id="billPlan" style="margin-top:6px"></div>
      <div id="billUsage" style="margin-top:8px"></div>
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="sm" id="manageBill" data-i="startbill">Start / manage plan</button>
        <button class="sm ghost" id="cancelBill" style="display:none;border-color:var(--err);color:var(--err)" data-i="cancelsub">Cancel subscription</button>
      </div>
      <div class="msg" id="cancelMsg" style="margin-top:8px"></div>
    </div>
    <div class="card">
      <div class="day" data-i="theme">Theme</div>
      <label data-i="themepick">Appearance</label>
      <select id="themeSel"><option value="dark" data-i="tdark">Dark</option><option value="light" data-i="tlight">Light</option></select>
    </div>
    <div style="text-align:center;margin:18px 0"><a href="#" id="logout" style="color:var(--mut)" data-i="logout">Log out</a></div>
  </section>
</main>
<!-- fixed bottom search (Messages view only) -->
<div id="msgSearchBar"><input id="msgSearch" placeholder="Search messages…" data-i-ph="searchph" /></div>
<!-- recharge bottom sheet -->
<div class="modal" id="rechargeModal">
  <div class="sheet">
    <div class="day" data-i="addmin">Add minutes</div>
    <div class="msg" id="rechargeInfo"></div>
    <div class="amtgrid" id="amtGrid"></div>
    <div class="msg" id="rechargeMsg" style="margin-top:10px"></div>
    <div id="startPlanRow" style="display:none;margin-top:14px"><button class="sm ghost" id="startPlanBtn" data-i="startplan">Start monthly plan</button></div>
    <div style="margin-top:14px;text-align:right"><button class="sm ghost" id="closeRecharge" data-i="close">Close</button></div>
  </div>
</div>
<nav>
  <a href="#" class="on" data-view="messages" data-i="nmsg">Messages<span class="badge" id="unread" style="display:none">0</span></a>
  <a href="#" data-view="calendar" data-i="ncal">Calendar</a>
  <a href="#" data-view="settings" data-i="nset">Settings</a>
</nav>
<script>
const I={en:{payMsg:"Your free trial ended. Add payment to keep answering calls.",payNow:"Add payment",alerts:"Alerts",nmsg:"Messages",ncal:"Calendar",nset:"Settings",biz:"Business",bizname:"Business name",ownerph:"Owner mobile (SMS alerts)",transferph:"Transfer-to number (live person)",glang:"Greeting language",tz:"Timezone",save:"Save",avail:"Availability",addhours:"+ Add hours",fwd:"Call forwarding",fmode:"Forwarding mode",mdirect:"Forward all calls (AI always answers)",mnoans:"After 2 rings (if I don't answer)",carrier:"Carrier",turnon:"Turn ON",turnoff:"Turn OFF",check:"Check",onlabel:"ON code",offlabel:"OFF code",copy:"Copy",bill:"Billing",startbill:"Start / manage plan",cancelsub:"Cancel subscription",logout:"Log out",noMsg:"No messages yet. When you miss a call, it shows up here.",noAppt:"No appointments yet.",cancel:"Cancel",read:"Mark read",callback:"Call back",fall:"All",funread:"Unread",searchph:"Search messages…",del:"Delete",whatsapp:"WhatsApp",sms:"SMS",theme:"Theme",themepick:"Appearance",tdark:"Dark",tlight:"Light",addmin:"Add minutes",startplan:"Start monthly plan",close:"Close",rechargeInfo:"Buy extra answered minutes. Charged to your saved card and added to your balance.",noResults:"No messages match your search.",rollLabel:"rollover",prepaidLabel:"prepaid",wd:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]},
        es:{payMsg:"Su prueba gratis terminó. Agregue un método de pago para seguir contestando llamadas.",payNow:"Agregar pago",alerts:"Alertas",nmsg:"Mensajes",ncal:"Agenda",nset:"Ajustes",biz:"Negocio",bizname:"Nombre del negocio",ownerph:"Móvil del dueño (alertas SMS)",transferph:"Número para transferir (persona real)",glang:"Idioma del saludo",tz:"Zona horaria",save:"Guardar",avail:"Disponibilidad",addhours:"+ Agregar horario",fwd:"Reenvío de llamadas",fmode:"Modo de reenvío",mdirect:"Reenviar todas las llamadas (la IA siempre contesta)",mnoans:"Después de 2 timbres (si no contesto)",carrier:"Operador",turnon:"Activar",turnoff:"Desactivar",check:"Verificar",onlabel:"Código ON",offlabel:"Código OFF",copy:"Copiar",bill:"Facturación",startbill:"Iniciar / administrar plan",cancelsub:"Cancelar suscripción",logout:"Cerrar sesión",noMsg:"Aún no hay mensajes. Cuando pierda una llamada, aparecerá aquí.",noAppt:"Aún no hay citas.",cancel:"Cancelar",read:"Marcar leído",callback:"Llamar",fall:"Todos",funread:"No leídos",searchph:"Buscar mensajes…",del:"Eliminar",whatsapp:"WhatsApp",sms:"SMS",theme:"Tema",themepick:"Apariencia",tdark:"Oscuro",tlight:"Claro",addmin:"Agregar minutos",startplan:"Iniciar plan mensual",close:"Cerrar",rechargeInfo:"Compre minutos contestados adicionales. Se cargan a su tarjeta guardada y se suman a su saldo.",noResults:"Ningún mensaje coincide con su búsqueda.",rollLabel:"acumulados",prepaidLabel:"prepagados",wd:["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"]}};
let lang=localStorage.getItem('lite_lang')||'en';
function apply(){document.querySelectorAll('[data-i]').forEach(e=>{const k=e.getAttribute('data-i');const v=I[lang][k];if(typeof v==='string'){if(e.querySelector('.badge')){e.childNodes[0].nodeValue=v}else e.textContent=v}});document.querySelectorAll('[data-i-ph]').forEach(e=>{const v=I[lang][e.getAttribute('data-i-ph')];if(typeof v==='string')e.placeholder=v});document.getElementById('lang').textContent=lang==='en'?'ES':'EN';document.documentElement.lang=lang}
document.getElementById('lang').onclick=()=>{lang=lang==='en'?'es':'en';localStorage.setItem('lite_lang',lang);apply();render()};
const $=id=>document.getElementById(id);
async function api(path,opts){const r=await fetch(path,Object.assign({credentials:'include',headers:{'Content-Type':'application/json'}},opts||{}));if(r.status===401){location.href='/login';return null}return r.json()}

// nav
document.querySelectorAll('nav a').forEach(a=>a.onclick=e=>{e.preventDefault();const v=a.getAttribute('data-view');
  document.querySelectorAll('nav a').forEach(x=>x.classList.remove('on'));a.classList.add('on');
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));$('v-'+v).classList.add('on');
  $('msgSearchBar').classList.toggle('on',v==='messages');   // search bar only on Messages
  if(v==='calendar')loadCalendar();if(v==='settings')loadSettings();});

function fmt(d){return new Date(d).toLocaleString(lang==='es'?'es-CO':'en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}

let lastUnread=null;
function setAppBadge(n){
  try{ if('setAppBadge'in navigator){ n>0?navigator.setAppBadge(n):navigator.clearAppBadge&&navigator.clearAppBadge(); } }catch(e){}
  try{ navigator.serviceWorker&&navigator.serviceWorker.controller&&navigator.serviceWorker.controller.postMessage({type:'badge',count:n}); }catch(e){}
}
function notifyNew(delta){
  if(!('Notification'in window)||Notification.permission!=='granted')return;
  try{
    const title=lang==='es'?'RinglyPro Lite':'RinglyPro Lite';
    const body=lang==='es'?(delta>1?`${delta} mensajes nuevos`:'Nuevo mensaje'):(delta>1?`${delta} new messages`:'New message');
    if(navigator.serviceWorker&&navigator.serviceWorker.ready){navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,icon:'/icon-192.png',badge:'/icon-192.png'}))}
    else new Notification(title,{body,icon:'/icon-192.png'});
  }catch(e){}
}
let allMessages=[], msgFilter='all', msgQuery='';
async function loadMessages(){
  const j=await api('/api/messages');if(!j)return;
  const u=$('unread');if(j.unread>0){u.style.display='inline-block';u.textContent=j.unread}else u.style.display='none';
  setAppBadge(j.unread);
  if(lastUnread!==null&&j.unread>lastUnread){ notifyNew(j.unread-lastUnread); }
  lastUnread=j.unread;
  allMessages=j.messages||[];
  renderMessages();
}
function renderMessages(){
  const box=$('messages');
  if(!allMessages.length){box.innerHTML='<div class="empty">'+I[lang].noMsg+'</div>';return}
  let list=allMessages.slice();
  if(msgFilter==='unread')list=list.filter(m=>!m.read_at);
  if(msgQuery){const q=msgQuery.toLowerCase();list=list.filter(m=>((m.caller_name||'')+' '+(m.body||'')+' '+(m.callback_number||'')).toLowerCase().includes(q));}
  if(!list.length){box.innerHTML='<div class="empty">'+I[lang].noResults+'</div>';return}
  box.innerHTML=list.map(m=>`<div class="swipewrap" data-id="${m.id}" data-num="${esc(m.callback_number||'')}">
    <div class="swipe-actions"><div class="sms-hint">${I[lang].sms}</div><div class="del-hint">${I[lang].del}</div></div>
    <div class="item ${m.read_at?'':'unread'}">
      <div class="top"><div class="name">${esc(m.caller_name||'—')}</div><div class="when">${fmt(m.created_at)}</div></div>
      <div class="body">${esc(m.body||'')}</div>
      ${m.callback_number?`<a class="call" href="tel:${esc(m.callback_number)}">${I[lang].callback}: ${esc(m.callback_number)}</a>`:''}
      ${m.read_at?'':`<div style="margin-top:8px"><button class="sm ghost" onclick="markRead(${m.id})">${I[lang].read}</button></div>`}
    </div></div>`).join('');
  attachSwipe();
}
// Swipe LEFT → delete · swipe RIGHT → open the phone's Messages app (SMS from your
// own personal number) to the caller. Native touch gesture; vertical scroll wins
// until a clear horizontal drag is detected.
function attachSwipe(){
  document.querySelectorAll('#messages .swipewrap').forEach(wrap=>{
    const item=wrap.querySelector('.item');
    let x0=0,y0=0,dx=0,dragging=false,decided=false,horiz=false;
    item.addEventListener('touchstart',e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY;dx=0;dragging=true;decided=false;horiz=false;item.style.transition='none';},{passive:true});
    item.addEventListener('touchmove',e=>{
      if(!dragging)return;const t=e.touches[0];const mx=t.clientX-x0,my=t.clientY-y0;
      if(!decided&&(Math.abs(mx)>10||Math.abs(my)>10)){decided=true;horiz=Math.abs(mx)>Math.abs(my);}
      if(!horiz)return;
      dx=mx;item.style.transform='translateX('+dx+'px)';
    },{passive:true});
    item.addEventListener('touchend',()=>{
      if(!dragging)return;dragging=false;item.style.transition='transform .18s ease';
      const TH=80;
      if(horiz&&dx<=-TH){ item.style.transform='translateX(-100%)'; setTimeout(()=>deleteMsg(wrap.getAttribute('data-id')),160); }
      else if(horiz&&dx>=TH){ item.style.transform='translateX(0)'; const num=wrap.getAttribute('data-num'); if(num)location.href='sms:'+num; }
      else{ item.style.transform='translateX(0)'; }
    });
  });
}
window.markRead=async id=>{await api('/api/messages/'+id+'/read',{method:'POST'});loadMessages()};
window.deleteMsg=async id=>{await api('/api/messages/'+id,{method:'DELETE'});allMessages=allMessages.filter(m=>String(m.id)!==String(id));renderMessages();setTimeout(loadMessages,400);};
$('fAll').onclick=()=>{msgFilter='all';$('fAll').classList.add('on');$('fUnread').classList.remove('on');renderMessages()};
$('fUnread').onclick=()=>{msgFilter='unread';$('fUnread').classList.add('on');$('fAll').classList.remove('on');renderMessages()};
$('msgSearch').addEventListener('input',e=>{msgQuery=(e.target.value||'').trim();renderMessages()});

async function loadCalendar(){
  const j=await api('/api/appointments');if(!j)return;const box=$('calendar');
  if(!j.appointments.length){box.innerHTML='<div class="empty">'+I[lang].noAppt+'</div>';return}
  const byDay={};j.appointments.filter(a=>a.status!=='cancelled').forEach(a=>{const d=new Date(a.starts_at).toLocaleDateString(lang==='es'?'es-CO':'en-US',{weekday:'long',month:'long',day:'numeric'});(byDay[d]=byDay[d]||[]).push(a)});
  box.innerHTML=Object.keys(byDay).map(d=>`<div class="day">${d}</div>`+byDay[d].map(a=>`<div class="item">
    <div class="top"><div class="name">${esc(a.caller_name||'—')}</div><div class="when">${new Date(a.starts_at).toLocaleTimeString(lang==='es'?'es-CO':'en-US',{hour:'numeric',minute:'2-digit'})}</div></div>
    ${a.callback_number?`<a class="call" href="tel:${esc(a.callback_number)}">${esc(a.callback_number)}</a>`:''}
    <div class="apptbtns">
      <button class="sm ghost" onclick="cancelAppt(${a.id})">${I[lang].cancel}</button>
      ${a.callback_number?`<a class="actbtn wa" target="_blank" rel="noopener" href="https://wa.me/${digits(a.callback_number)}">${I[lang].whatsapp}</a>
      <a class="actbtn sms" href="sms:${esc(a.callback_number)}">${I[lang].sms}</a>`:''}
    </div>
  </div>`).join('')).join('');
}
window.cancelAppt=async id=>{await api('/api/appointments/'+id+'/cancel',{method:'POST'});loadCalendar()};

let rules=[]; let curBill=null;
async function loadSettings(){
  const j=await api('/api/settings');if(!j)return;
  $('set_business_name').value=j.tenant.business_name||'';
  $('set_owner_phone').value=j.tenant.owner_phone||'';
  $('set_transfer_number').value=j.tenant.transfer_number||'';
  $('set_locale').value=j.tenant.locale||'en';
  $('set_timezone').value=j.tenant.timezone||'';
  rules=j.availability_rules.map(r=>({weekday:r.weekday,start:r.start,end:r.end,slot_minutes:r.slot_minutes}));
  renderAvail();
  // forwarding — carrier selector + tap-to-dial ON/OFF
  await loadForwarding();
  const cfg=await fetch('/api/config').then(r=>r.json()).catch(()=>({billing_enabled:false}));
  if(cfg.billing_enabled){
    $('billCard').style.display='';
    const bs=await api('/api/billing/status');
    curBill=bs;
    if(bs){
      let line='',color='var(--mut)';
      if(bs.needs_payment){line=lang==='es'?'Prueba terminada — agregue un método de pago para seguir contestando llamadas':'Trial ended — add payment to keep answering calls';color='var(--err)';}
      else if(bs.subscription_status==='active'){line=lang==='es'?'Suscripción activa':'Subscription active';color='var(--ok)';}
      else if(bs.trial_days_left!=null&&!bs.has_subscription){line=lang==='es'?`Prueba gratis: ${bs.trial_days_left} día(s) restante(s)`:`Free trial: ${bs.trial_days_left} day(s) left`;color=bs.trial_days_left<=2?'var(--warn)':'var(--acc2)';}
      else line=bs.subscription_status||'';
      $('billStatus').style.color=color;$('billStatus').textContent=line;
      if(bs.plan)$('billPlan').textContent=`$${bs.plan.monthly_usd}/mo · ${bs.plan.included_minutes} min ${lang==='es'?'incluidos':'incl'} · overage $${bs.plan.overage_per_min_usd}/min`+(bs.plan.setup_usd>0?` · setup $${bs.plan.setup_usd}`:'');
      // Show Cancel only when there is a subscription on file.
      if(bs.has_subscription && bs.subscription_status!=='canceled'){$('cancelBill').style.display='';}
      // Prominent banner if payment is needed (answering is suspended).
      if(bs.needs_payment){$('payBanner').style.display='';}
    }
    const us=await api('/api/billing/usage');
    if(us&&!us.error){
      const u=lang==='es'?'Usados':'Used', c=lang==='es'?'llamadas':'calls', rem=lang==='es'?'restantes':'left';
      const avail=us.available_minutes!=null?us.available_minutes:us.included_minutes;
      let extra='';
      if(us.rollover_minutes>0)extra+=` · +${us.rollover_minutes} ${I[lang].rollLabel}`;
      if(us.purchased_minutes>0)extra+=` · +${us.purchased_minutes} ${I[lang].prepaidLabel}`;
      $('billUsage').innerHTML=`<div style="font-size:13px;color:var(--mut)">${u} <b style="color:var(--txt)">${us.minutes_used}</b> / ${avail} min${extra} · <b style="color:var(--ok)">${us.minutes_remaining} ${rem}</b> · ${us.calls} ${c}`+
        (us.overage_minutes>0?` · <span style="color:var(--warn)">overage ${us.overage_minutes} min ($${us.overage_usd})</span>`:'')+
        `</div>`;
    }
  }
}
function renderAvail(){
  $('avail').innerHTML=rules.map((r,i)=>`<div class="avail-row">
    <select onchange="rules[${i}].weekday=+this.value">${I[lang].wd.map((w,wi)=>`<option value="${wi}" ${wi===r.weekday?'selected':''}>${w}</option>`).join('')}</select>
    <input type="time" value="${r.start}" onchange="rules[${i}].start=this.value">
    <input type="time" value="${r.end}" onchange="rules[${i}].end=this.value">
    <button class="sm ghost" onclick="rules.splice(${i},1);renderAvail()">×</button>
  </div>`).join('');
}
async function loadForwarding(){
  const cj=await api('/api/onboarding/carriers');
  if(!cj||!cj.carriers){$('fwdNum').textContent=lang==='es'?'Asigne un número primero.':'Assign a number first.';return}
  const sel=$('fwdCarrier');
  if(!sel.dataset.loaded){sel.innerHTML=cj.carriers.map(c=>`<option value="${c.id}">${c.label}</option>`).join('');sel.dataset.loaded='1';sel.onchange=refreshFwd;$('fwdMode').onchange=refreshFwd}
  await refreshFwd();
}
async function refreshFwd(){
  const fc=await api('/api/onboarding/forwarding-codes?carrier='+encodeURIComponent($('fwdCarrier').value)+'&mode='+$('fwdMode').value);
  if(!fc||!fc.codes){$('fwdNum').textContent=lang==='es'?'Asigne un número primero.':'Assign a number first.';return}
  $('fwdNum').textContent=(lang==='es'?'Número Lite: ':'Lite number: ')+fc.did;
  $('fwdOn').href=fc.codes.activate_tel; $('fwdOff').href=fc.codes.deactivate_tel;
  $('fwdOnCode').textContent=fc.codes.activate; $('fwdOffCode').textContent=fc.codes.deactivate;
  if(fc.codes.check){$('fwdCheck').href='tel:'+encodeURIComponent(fc.codes.check);$('fwdCheck').style.display=''}
  else $('fwdCheck').style.display='none';
  $('fwdReminder').textContent=(fc.reminder||'')+(fc.warning?(' '+fc.warning):'');
}
window.copyCode=id=>{const t=document.getElementById(id).textContent;navigator.clipboard&&navigator.clipboard.writeText(t);};
$('addRow').onclick=()=>{rules.push({weekday:1,start:'09:00',end:'17:00',slot_minutes:30});renderAvail()};
$('saveBiz').onclick=async()=>{const r=await api('/api/settings',{method:'PATCH',body:JSON.stringify({business_name:$('set_business_name').value,owner_phone:$('set_owner_phone').value,transfer_number:$('set_transfer_number').value,locale:$('set_locale').value,timezone:$('set_timezone').value})});$('bizMsg').textContent=r&&r.success?'✓':'!'};
$('saveAvail').onclick=async()=>{const r=await api('/api/availability',{method:'PUT',body:JSON.stringify({rules})});$('availMsg').textContent=r&&r.success?'✓':'!'};
$('manageBill').onclick=()=>{ if(!curBill){loadSettings();} openRecharge(); };
$('payNow').onclick=async()=>{const r=await api('/api/billing/checkout',{method:'POST'});if(r&&r.url)location.href=r.url};
$('cancelBill').onclick=async()=>{
  const msg=lang==='es'?'¿Cancelar la suscripción? Lina seguirá contestando hasta el fin del período pagado.':'Cancel your subscription? Lina keeps answering until the end of the paid period.';
  if(!confirm(msg))return;
  const r=await api('/api/billing/cancel',{method:'POST'});
  $('cancelMsg').style.color=r&&r.success?'var(--ok)':'var(--err)';
  $('cancelMsg').textContent=r&&r.success?(lang==='es'?'Suscripción cancelada. Activa hasta el fin del período.':'Subscription canceled. Active until the end of the period.'):(lang==='es'?'No se pudo cancelar.':'Could not cancel.');
  if(r&&r.success)$('cancelBill').style.display='none';
};
$('logout').onclick=async e=>{e.preventDefault();await api('/api/auth/logout',{method:'POST'});location.href='/login'};

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function digits(s){return String(s==null?'':s).replace(/[^0-9]/g,'')}
function render(){loadMessages();}

/* ── Theme (Light/Dark) — applied to <html data-theme>, persisted ─────── */
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('lite_theme',t)}catch(e){}
  const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.setAttribute('content',t==='light'?'#f4f7fb':'#0d1320');
  const sel=$('themeSel');if(sel)sel.value=t;}
(function(){let t='dark';try{t=localStorage.getItem('lite_theme')||'dark'}catch(e){}if(t!=='light'&&t!=='dark')t='dark';applyTheme(t)})();
$('themeSel').onchange=function(){applyTheme(this.value)};

/* ── Recharge dialog (buy prepaid overage minutes) ────────────────────── */
function openRecharge(){
  const modal=$('rechargeModal');
  $('rechargeInfo').textContent=I[lang].rechargeInfo;
  $('rechargeMsg').textContent='';
  const amounts=(curBill&&curBill.recharge_amounts_usd)||[10,20,40,60,80,100];
  $('amtGrid').innerHTML=amounts.map(a=>`<button class="amtbtn" data-amt="${a}">$${a}</button>`).join('');
  document.querySelectorAll('#amtGrid .amtbtn').forEach(b=>b.onclick=()=>doRecharge(+b.getAttribute('data-amt')));
  // Offer "Start monthly plan" only when there is no active subscription yet.
  const noSub=!(curBill&&(curBill.has_subscription||curBill.subscription_status==='active'));
  $('startPlanRow').style.display=noSub?'':'none';
  modal.classList.add('on');
}
function closeRecharge(){$('rechargeModal').classList.remove('on')}
$('closeRecharge').onclick=closeRecharge;
$('rechargeModal').onclick=e=>{if(e.target===$('rechargeModal'))closeRecharge()};
$('startPlanBtn').onclick=async()=>{const r=await api('/api/billing/checkout',{method:'POST'});if(r&&r.url)location.href=r.url};
async function doRecharge(amt){
  const btns=document.querySelectorAll('#amtGrid .amtbtn');btns.forEach(b=>b.disabled=true);
  $('rechargeMsg').style.color='var(--mut)';
  $('rechargeMsg').textContent=lang==='es'?'Procesando…':'Processing…';
  try{
    const r=await api('/api/billing/recharge',{method:'POST',body:JSON.stringify({amount_usd:amt})});
    if(r&&r.success&&r.charged){
      $('rechargeMsg').style.color='var(--ok)';
      $('rechargeMsg').textContent=(lang==='es'?`Listo: +${r.minutes_added} min. Saldo prepagado: ${r.purchased_minutes} min.`:`Done: +${r.minutes_added} min. Prepaid balance: ${r.purchased_minutes} min.`);
      setTimeout(()=>{closeRecharge();loadSettings();},1400);
    }else if(r&&r.checkout_url){ location.href=r.checkout_url; }
    else{ $('rechargeMsg').style.color='var(--err)'; $('rechargeMsg').textContent=(r&&r.error)||(lang==='es'?'No se pudo procesar el pago.':'Payment could not be processed.'); btns.forEach(b=>b.disabled=false); }
  }catch(e){ $('rechargeMsg').style.color='var(--err)'; $('rechargeMsg').textContent=lang==='es'?'Error de conexión.':'Connection error.'; btns.forEach(b=>b.disabled=false); }
}

// PWA + alerts
if('serviceWorker'in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{})}
function refreshBell(){const b=$('bell');if(!('Notification'in window)){b.style.display='none';return}b.style.opacity=Notification.permission==='granted'?'1':'0.5'}
$('bell').onclick=async()=>{
  if(!('Notification'in window)){alert(lang==='es'?'Este dispositivo no admite alertas. Agregue la app a la pantalla de inicio.':'Alerts not supported here. Add the app to your Home Screen first.');return}
  try{const p=await Notification.requestPermission();refreshBell();
    if(p==='granted'){setAppBadge(lastUnread||0);}
    else alert(lang==='es'?'Active las notificaciones en Ajustes del navegador. En iPhone: agregue la app a la pantalla de inicio y vuelva a intentar.':'Enable notifications in browser settings. On iPhone: add the app to your Home Screen, then try again.');
  }catch(e){}
};
refreshBell();
apply();render();
$('msgSearchBar').classList.add('on');   // Messages is the default view
// Returning from a recharge Checkout fallback → refresh billing view.
if(/[?&]recharge=1/.test(location.search)){location.hash='';document.querySelector('nav a[data-view="settings"]').click();}
setInterval(loadMessages,20000);
</script>
