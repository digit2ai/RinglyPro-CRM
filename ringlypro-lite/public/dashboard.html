<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>RinglyPro Lite</title>
<link rel="icon" type="image/png" href="/favicon-32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#0d1320" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="RinglyPro Lite" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
  :root{--bg:#0d1320;--card:#141b29;--line:#243049;--txt:#e9eef7;--mut:#8a98b0;--acc:#6a4bff;--acc2:#bda4ff;--ok:#3ad29f;--warn:#ffb454;--err:#ff6b6b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:calc(78px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
  header{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 12px calc(16px + env(safe-area-inset-left));border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  .brand{font-weight:800}.brand span{color:var(--acc2)}
  .lang{font-size:13px;color:var(--mut);cursor:pointer}
  main{max-width:560px;margin:0 auto;padding:14px}
  .view{display:none}.view.on{display:block}
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .item .top{display:flex;justify-content:space-between;align-items:center}
  .name{font-weight:700}.when{color:var(--mut);font-size:12px}
  .body{color:var(--mut);font-size:14px;margin-top:6px}
  .badge{background:var(--acc);color:#fff;font-size:11px;border-radius:10px;padding:2px 7px;margin-left:6px}
  .unread{border-left:3px solid var(--acc)}
  .call{display:inline-block;margin-top:8px;color:var(--ok);text-decoration:none;font-weight:700;font-size:14px}
  .day{margin:16px 0 6px;color:var(--acc2);font-weight:700;font-size:14px}
  label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
  input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0f1626;color:var(--txt);font-size:16px}
  button{padding:11px 14px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:700;cursor:pointer}
  button.sm{padding:7px 10px;font-size:13px}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
  .empty{color:var(--mut);text-align:center;padding:40px 10px}
  .avail-row{display:flex;gap:6px;align-items:center;margin:6px 0}
  .avail-row select,.avail-row input{padding:8px}
  nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);z-index:6}
  nav a{flex:1;text-align:center;padding:14px 0;color:var(--mut);text-decoration:none;font-size:12px;font-weight:600}
  nav a.on{color:var(--acc2)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
  .msg{font-size:13px;color:var(--mut);min-height:16px}
  .fwd{font-family:ui-monospace,Menlo,monospace;background:#0f1626;border:1px dashed var(--acc);border-radius:8px;padding:6px 10px;display:inline-block}
  .telbtn{flex:1;min-width:96px;text-align:center;text-decoration:none;font-weight:800;border-radius:10px;padding:13px 10px;font-size:15px}
  .telbtn.on{background:var(--ok);color:#04231a}
  .telbtn.off{background:var(--err);color:#2a0606}
  .telbtn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);flex:0 0 auto;min-width:64px}
</style>
</head>
<body>
<header>
  <div class="brand"><img src="/icon-192.png" alt="" style="height:24px;width:24px;border-radius:6px;vertical-align:middle;margin-right:7px" />RinglyPro <span>Lite</span></div>
  <div style="display:flex;align-items:center;gap:14px"><span class="lang" id="bell" title="Alerts" style="cursor:pointer" data-i="alerts">Alerts</span><span class="lang" id="lang">ES</span></div>
</header>
<div id="payBanner" style="display:none;background:#3a0f14;border-bottom:1px solid var(--err);color:#ffd0d0;padding:12px 16px;font-size:14px;text-align:center">
  <span data-i="payMsg">Your free trial ended. Add payment to keep answering calls.</span>
  <button class="sm" id="payNow" style="margin-left:10px" data-i="payNow">Add payment</button>
</div>
<main>
  <!-- MESSAGES -->
  <section class="view on" id="v-messages">
    <div id="messages"></div>
  </section>
  <!-- CALENDAR -->
  <section class="view" id="v-calendar">
    <div id="calendar"></div>
  </section>
  <!-- SETTINGS -->
  <section class="view" id="v-settings">
    <div class="card">
      <div class="day" data-i="biz">Business</div>
      <label data-i="bizname">Business name</label><input id="set_business_name" />
      <label data-i="ownerph">Owner mobile (SMS alerts)</label><input id="set_owner_phone" />
      <label data-i="transferph">Transfer-to number (live person)</label><input id="set_transfer_number" placeholder="+1..." />
      <label data-i="glang">Greeting language</label>
      <select id="set_locale"><option value="en">English</option><option value="es">Español</option></select>
      <label data-i="tz">Timezone</label><input id="set_timezone" />
      <div style="margin-top:14px"><button id="saveBiz" class="sm" data-i="save">Save</button> <span class="msg" id="bizMsg"></span></div>
    </div>
    <div class="card">
      <div class="day" data-i="avail">Availability</div>
      <div id="avail"></div>
      <button class="sm ghost" id="addRow" data-i="addhours">+ Add hours</button>
      <div style="margin-top:12px"><button id="saveAvail" class="sm" data-i="save">Save</button> <span class="msg" id="availMsg"></span></div>
    </div>
    <div class="card">
      <div class="day" data-i="fwd">Call forwarding</div>
      <div class="msg" id="fwdNum" style="margin-bottom:8px">—</div>
      <label data-i="fmode">Forwarding mode</label>
      <select id="fwdMode">
        <option value="direct" data-i="mdirect">Forward all calls (AI always answers)</option>
        <option value="noanswer" data-i="mnoans">After 2 rings (if I don't answer)</option>
      </select>
      <label data-i="carrier">Carrier</label><select id="fwdCarrier"></select>
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
        <a class="telbtn on" id="fwdOn" href="#" data-i="turnon">Turn ON</a>
        <a class="telbtn off" id="fwdOff" href="#" data-i="turnoff">Turn OFF</a>
        <a class="telbtn ghost" id="fwdCheck" href="#" data-i="check">Check</a>
      </div>
      <div style="margin-top:12px;font-size:13px;color:var(--mut)">
        <div style="display:flex;align-items:center;gap:8px;margin:4px 0"><span data-i="onlabel">ON code</span>: <span class="fwd" id="fwdOnCode">—</span> <button class="sm ghost" onclick="copyCode('fwdOnCode')" data-i="copy">Copy</button></div>
        <div style="display:flex;align-items:center;gap:8px;margin:4px 0"><span data-i="offlabel">OFF code</span>: <span class="fwd" id="fwdOffCode">—</span> <button class="sm ghost" onclick="copyCode('fwdOffCode')" data-i="copy">Copy</button></div>
      </div>
      <div class="msg" id="fwdReminder" style="margin-top:10px"></div>
    </div>
    <div class="card" id="billCard" style="display:none">
      <div class="day" data-i="bill">Billing</div>
      <div class="msg" id="billStatus">—</div>
      <div class="msg" id="billPlan" style="margin-top:6px"></div>
      <div id="billUsage" style="margin-top:8px"></div>
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="sm" id="manageBill" data-i="startbill">Start / manage plan</button>
        <button class="sm ghost" id="cancelBill" style="display:none;border-color:var(--err);color:var(--err)" data-i="cancelsub">Cancel subscription</button>
      </div>
      <div class="msg" id="cancelMsg" style="margin-top:8px"></div>
    </div>
    <div style="text-align:center;margin:18px 0"><a href="#" id="logout" style="color:var(--mut)" data-i="logout">Log out</a></div>
  </section>
</main>
<nav>
  <a href="#" class="on" data-view="messages" data-i="nmsg">Messages<span class="badge" id="unread" style="display:none">0</span></a>
  <a href="#" data-view="calendar" data-i="ncal">Calendar</a>
  <a href="#" data-view="settings" data-i="nset">Settings</a>
</nav>
<script>
const I={en:{payMsg:"Your free trial ended. Add payment to keep answering calls.",payNow:"Add payment",alerts:"Alerts",nmsg:"Messages",ncal:"Calendar",nset:"Settings",biz:"Business",bizname:"Business name",ownerph:"Owner mobile (SMS alerts)",transferph:"Transfer-to number (live person)",glang:"Greeting language",tz:"Timezone",save:"Save",avail:"Availability",addhours:"+ Add hours",fwd:"Call forwarding",fmode:"Forwarding mode",mdirect:"Forward all calls (AI always answers)",mnoans:"After 2 rings (if I don't answer)",carrier:"Carrier",turnon:"Turn ON",turnoff:"Turn OFF",check:"Check",onlabel:"ON code",offlabel:"OFF code",copy:"Copy",bill:"Billing",startbill:"Start / manage plan",cancelsub:"Cancel subscription",logout:"Log out",noMsg:"No messages yet. When you miss a call, it shows up here.",noAppt:"No appointments yet.",cancel:"Cancel",read:"Mark read",callback:"Call back",wd:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]},
        es:{payMsg:"Su prueba gratis terminó. Agregue un método de pago para seguir contestando llamadas.",payNow:"Agregar pago",alerts:"Alertas",nmsg:"Mensajes",ncal:"Agenda",nset:"Ajustes",biz:"Negocio",bizname:"Nombre del negocio",ownerph:"Móvil del dueño (alertas SMS)",transferph:"Número para transferir (persona real)",glang:"Idioma del saludo",tz:"Zona horaria",save:"Guardar",avail:"Disponibilidad",addhours:"+ Agregar horario",fwd:"Reenvío de llamadas",fmode:"Modo de reenvío",mdirect:"Reenviar todas las llamadas (la IA siempre contesta)",mnoans:"Después de 2 timbres (si no contesto)",carrier:"Operador",turnon:"Activar",turnoff:"Desactivar",check:"Verificar",onlabel:"Código ON",offlabel:"Código OFF",copy:"Copiar",bill:"Facturación",startbill:"Iniciar / administrar plan",cancelsub:"Cancelar suscripción",logout:"Cerrar sesión",noMsg:"Aún no hay mensajes. Cuando pierda una llamada, aparecerá aquí.",noAppt:"Aún no hay citas.",cancel:"Cancelar",read:"Marcar leído",callback:"Llamar",wd:["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"]}};
let lang=localStorage.getItem('lite_lang')||'en';
function apply(){document.querySelectorAll('[data-i]').forEach(e=>{const k=e.getAttribute('data-i');const v=I[lang][k];if(typeof v==='string'){if(e.querySelector('.badge')){e.childNodes[0].nodeValue=v}else e.textContent=v}});document.getElementById('lang').textContent=lang==='en'?'ES':'EN';document.documentElement.lang=lang}
document.getElementById('lang').onclick=()=>{lang=lang==='en'?'es':'en';localStorage.setItem('lite_lang',lang);apply();render()};
const $=id=>document.getElementById(id);
async function api(path,opts){const r=await fetch(path,Object.assign({credentials:'include',headers:{'Content-Type':'application/json'}},opts||{}));if(r.status===401){location.href='/login';return null}return r.json()}

// nav
document.querySelectorAll('nav a').forEach(a=>a.onclick=e=>{e.preventDefault();const v=a.getAttribute('data-view');
  document.querySelectorAll('nav a').forEach(x=>x.classList.remove('on'));a.classList.add('on');
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));$('v-'+v).classList.add('on');
  if(v==='calendar')loadCalendar();if(v==='settings')loadSettings();});

function fmt(d){return new Date(d).toLocaleString(lang==='es'?'es-CO':'en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}

let lastUnread=null;
function setAppBadge(n){
  try{ if('setAppBadge'in navigator){ n>0?navigator.setAppBadge(n):navigator.clearAppBadge&&navigator.clearAppBadge(); } }catch(e){}
  try{ navigator.serviceWorker&&navigator.serviceWorker.controller&&navigator.serviceWorker.controller.postMessage({type:'badge',count:n}); }catch(e){}
}
function notifyNew(delta){
  if(!('Notification'in window)||Notification.permission!=='granted')return;
  try{
    const title=lang==='es'?'RinglyPro Lite':'RinglyPro Lite';
    const body=lang==='es'?(delta>1?`${delta} mensajes nuevos`:'Nuevo mensaje'):(delta>1?`${delta} new messages`:'New message');
    if(navigator.serviceWorker&&navigator.serviceWorker.ready){navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,icon:'/icon-192.png',badge:'/icon-192.png'}))}
    else new Notification(title,{body,icon:'/icon-192.png'});
  }catch(e){}
}
async function loadMessages(){
  const j=await api('/api/messages');if(!j)return;
  const u=$('unread');if(j.unread>0){u.style.display='inline-block';u.textContent=j.unread}else u.style.display='none';
  setAppBadge(j.unread);
  if(lastUnread!==null&&j.unread>lastUnread){ notifyNew(j.unread-lastUnread); }
  lastUnread=j.unread;
  const box=$('messages');
  if(!j.messages.length){box.innerHTML='<div class="empty">'+I[lang].noMsg+'</div>';return}
  box.innerHTML=j.messages.map(m=>`<div class="item ${m.read_at?'':'unread'}">
    <div class="top"><div class="name">${esc(m.caller_name||'—')}</div><div class="when">${fmt(m.created_at)}</div></div>
    <div class="body">${esc(m.body||'')}</div>
    ${m.callback_number?`<a class="call" href="tel:${esc(m.callback_number)}">${I[lang].callback}: ${esc(m.callback_number)}</a>`:''}
    ${m.read_at?'':`<div style="margin-top:8px"><button class="sm ghost" onclick="markRead(${m.id})">${I[lang].read}</button></div>`}
  </div>`).join('');
}
window.markRead=async id=>{await api('/api/messages/'+id+'/read',{method:'POST'});loadMessages()};

async function loadCalendar(){
  const j=await api('/api/appointments');if(!j)return;const box=$('calendar');
  if(!j.appointments.length){box.innerHTML='<div class="empty">'+I[lang].noAppt+'</div>';return}
  const byDay={};j.appointments.filter(a=>a.status!=='cancelled').forEach(a=>{const d=new Date(a.starts_at).toLocaleDateString(lang==='es'?'es-CO':'en-US',{weekday:'long',month:'long',day:'numeric'});(byDay[d]=byDay[d]||[]).push(a)});
  box.innerHTML=Object.keys(byDay).map(d=>`<div class="day">${d}</div>`+byDay[d].map(a=>`<div class="item">
    <div class="top"><div class="name">${esc(a.caller_name||'—')}</div><div class="when">${new Date(a.starts_at).toLocaleTimeString(lang==='es'?'es-CO':'en-US',{hour:'numeric',minute:'2-digit'})}</div></div>
    ${a.callback_number?`<a class="call" href="tel:${esc(a.callback_number)}">${esc(a.callback_number)}</a>`:''}
    <div style="margin-top:8px"><button class="sm ghost" onclick="cancelAppt(${a.id})">${I[lang].cancel}</button></div>
  </div>`).join('')).join('');
}
window.cancelAppt=async id=>{await api('/api/appointments/'+id+'/cancel',{method:'POST'});loadCalendar()};

let rules=[];
async function loadSettings(){
  const j=await api('/api/settings');if(!j)return;
  $('set_business_name').value=j.tenant.business_name||'';
  $('set_owner_phone').value=j.tenant.owner_phone||'';
  $('set_transfer_number').value=j.tenant.transfer_number||'';
  $('set_locale').value=j.tenant.locale||'en';
  $('set_timezone').value=j.tenant.timezone||'';
  rules=j.availability_rules.map(r=>({weekday:r.weekday,start:r.start,end:r.end,slot_minutes:r.slot_minutes}));
  renderAvail();
  // forwarding — carrier selector + tap-to-dial ON/OFF
  await loadForwarding();
  const cfg=await fetch('/api/config').then(r=>r.json()).catch(()=>({billing_enabled:false}));
  if(cfg.billing_enabled){
    $('billCard').style.display='';
    const bs=await api('/api/billing/status');
    if(bs){
      let line='',color='var(--mut)';
      if(bs.needs_payment){line=lang==='es'?'Prueba terminada — agregue un método de pago para seguir contestando llamadas':'Trial ended — add payment to keep answering calls';color='var(--err)';}
      else if(bs.subscription_status==='active'){line=lang==='es'?'Suscripción activa':'Subscription active';color='var(--ok)';}
      else if(bs.trial_days_left!=null&&!bs.has_subscription){line=lang==='es'?`Prueba gratis: ${bs.trial_days_left} día(s) restante(s)`:`Free trial: ${bs.trial_days_left} day(s) left`;color=bs.trial_days_left<=2?'var(--warn)':'var(--acc2)';}
      else line=bs.subscription_status||'';
      $('billStatus').style.color=color;$('billStatus').textContent=line;
      if(bs.plan)$('billPlan').textContent=`$${bs.plan.monthly_usd}/mo · ${bs.plan.included_minutes} min ${lang==='es'?'incluidos':'incl'} · overage $${bs.plan.overage_per_min_usd}/min`+(bs.plan.setup_usd>0?` · setup $${bs.plan.setup_usd}`:'');
      // Show Cancel only when there is a subscription on file.
      if(bs.has_subscription && bs.subscription_status!=='canceled'){$('cancelBill').style.display='';}
      // Prominent banner if payment is needed (answering is suspended).
      if(bs.needs_payment){$('payBanner').style.display='';}
    }
    const us=await api('/api/billing/usage');
    if(us&&!us.error){
      const u=lang==='es'?'Usados':'Used', c=lang==='es'?'llamadas':'calls', est=lang==='es'?'total est.':'est. total';
      $('billUsage').innerHTML=`<div style="font-size:13px;color:var(--mut)">${u} <b style="color:var(--txt)">${us.minutes_used}</b> / ${us.included_minutes} min · ${us.calls} ${c}`+
        (us.overage_minutes>0?` · <span style="color:var(--warn)">overage ${us.overage_minutes} min ($${us.overage_usd})</span>`:'')+
        ` · ${est} <b style="color:var(--txt)">$${us.estimated_total_usd}</b></div>`;
    }
  }
}
function renderAvail(){
  $('avail').innerHTML=rules.map((r,i)=>`<div class="avail-row">
    <select onchange="rules[${i}].weekday=+this.value">${I[lang].wd.map((w,wi)=>`<option value="${wi}" ${wi===r.weekday?'selected':''}>${w}</option>`).join('')}</select>
    <input type="time" value="${r.start}" onchange="rules[${i}].start=this.value">
    <input type="time" value="${r.end}" onchange="rules[${i}].end=this.value">
    <button class="sm ghost" onclick="rules.splice(${i},1);renderAvail()">×</button>
  </div>`).join('');
}
async function loadForwarding(){
  const cj=await api('/api/onboarding/carriers');
  if(!cj||!cj.carriers){$('fwdNum').textContent=lang==='es'?'Asigne un número primero.':'Assign a number first.';return}
  const sel=$('fwdCarrier');
  if(!sel.dataset.loaded){sel.innerHTML=cj.carriers.map(c=>`<option value="${c.id}">${c.label}</option>`).join('');sel.dataset.loaded='1';sel.onchange=refreshFwd;$('fwdMode').onchange=refreshFwd}
  await refreshFwd();
}
async function refreshFwd(){
  const fc=await api('/api/onboarding/forwarding-codes?carrier='+encodeURIComponent($('fwdCarrier').value)+'&mode='+$('fwdMode').value);
  if(!fc||!fc.codes){$('fwdNum').textContent=lang==='es'?'Asigne un número primero.':'Assign a number first.';return}
  $('fwdNum').textContent=(lang==='es'?'Número Lite: ':'Lite number: ')+fc.did;
  $('fwdOn').href=fc.codes.activate_tel; $('fwdOff').href=fc.codes.deactivate_tel;
  $('fwdOnCode').textContent=fc.codes.activate; $('fwdOffCode').textContent=fc.codes.deactivate;
  if(fc.codes.check){$('fwdCheck').href='tel:'+encodeURIComponent(fc.codes.check);$('fwdCheck').style.display=''}
  else $('fwdCheck').style.display='none';
  $('fwdReminder').textContent=(fc.reminder||'')+(fc.warning?(' '+fc.warning):'');
}
window.copyCode=id=>{const t=document.getElementById(id).textContent;navigator.clipboard&&navigator.clipboard.writeText(t);};
$('addRow').onclick=()=>{rules.push({weekday:1,start:'09:00',end:'17:00',slot_minutes:30});renderAvail()};
$('saveBiz').onclick=async()=>{const r=await api('/api/settings',{method:'PATCH',body:JSON.stringify({business_name:$('set_business_name').value,owner_phone:$('set_owner_phone').value,transfer_number:$('set_transfer_number').value,locale:$('set_locale').value,timezone:$('set_timezone').value})});$('bizMsg').textContent=r&&r.success?'✓':'!'};
$('saveAvail').onclick=async()=>{const r=await api('/api/availability',{method:'PUT',body:JSON.stringify({rules})});$('availMsg').textContent=r&&r.success?'✓':'!'};
$('manageBill').onclick=async()=>{const r=await api('/api/billing/checkout',{method:'POST'});if(r&&r.url)location.href=r.url};
$('payNow').onclick=async()=>{const r=await api('/api/billing/checkout',{method:'POST'});if(r&&r.url)location.href=r.url};
$('cancelBill').onclick=async()=>{
  const msg=lang==='es'?'¿Cancelar la suscripción? Lina seguirá contestando hasta el fin del período pagado.':'Cancel your subscription? Lina keeps answering until the end of the paid period.';
  if(!confirm(msg))return;
  const r=await api('/api/billing/cancel',{method:'POST'});
  $('cancelMsg').style.color=r&&r.success?'var(--ok)':'var(--err)';
  $('cancelMsg').textContent=r&&r.success?(lang==='es'?'Suscripción cancelada. Activa hasta el fin del período.':'Subscription canceled. Active until the end of the period.'):(lang==='es'?'No se pudo cancelar.':'Could not cancel.');
  if(r&&r.success)$('cancelBill').style.display='none';
};
$('logout').onclick=async e=>{e.preventDefault();await api('/api/auth/logout',{method:'POST'});location.href='/login'};

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){loadMessages();}

// PWA + alerts
if('serviceWorker'in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{})}
function refreshBell(){const b=$('bell');if(!('Notification'in window)){b.style.display='none';return}b.style.opacity=Notification.permission==='granted'?'1':'0.5'}
$('bell').onclick=async()=>{
  if(!('Notification'in window)){alert(lang==='es'?'Este dispositivo no admite alertas. Agregue la app a la pantalla de inicio.':'Alerts not supported here. Add the app to your Home Screen first.');return}
  try{const p=await Notification.requestPermission();refreshBell();
    if(p==='granted'){setAppBadge(lastUnread||0);}
    else alert(lang==='es'?'Active las notificaciones en Ajustes del navegador. En iPhone: agregue la app a la pantalla de inicio y vuelva a intentar.':'Enable notifications in browser settings. On iPhone: add the app to your Home Screen, then try again.');
  }catch(e){}
};
refreshBell();
apply();render();
setInterval(loadMessages,20000);
