<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OK Hola — Voice to Video Prompt</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .orb { box-shadow: 0 0 0 0 rgba(99,102,241,.5); }
    .orb.rec { animation: pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(99,102,241,.5)} 70%{box-shadow:0 0 0 18px rgba(99,102,241,0)} 100%{box-shadow:0 0 0 0 rgba(99,102,241,0)} }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
  <script>window.__DICT = {{DICT_JSON}}; window.__LANG = "{{LANG}}";</script>

  <header class="border-b border-zinc-800">
    <div class="max-w-3xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="font-bold tracking-tight" data-i18n="h1">{{H1}}</div>
      <div class="flex items-center gap-3 text-sm">
        <a href="./dashboard?lang={{LANG}}" class="text-indigo-400 hover:underline" data-i18n="nav_library">Mi biblioteca</a>
        <a id="langToggle" href="#" class="text-zinc-400 hover:text-zinc-200">EN / ES</a>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-6 py-10 space-y-8">
    <p class="text-zinc-400" data-i18n="tagline">{{TAGLINE}}</p>

    <!-- Auth panel -->
    <section id="authPanel" class="rounded-xl border border-zinc-800 bg-zinc-900/50 p-5 space-y-3">
      <h2 class="font-semibold" data-i18n="login_title">Entra sin contraseña</h2>
      <p class="text-sm text-zinc-400" data-i18n="login_desc"></p>
      <div class="flex flex-col sm:flex-row gap-2">
        <input id="email" type="email" class="flex-1 rounded-lg bg-zinc-800 border border-zinc-700 px-3 py-2 text-sm" data-i18n-ph="email_placeholder">
        <button id="btnMagic" class="rounded-lg bg-indigo-600 hover:bg-indigo-500 px-5 py-2 text-sm font-medium" data-i18n="enter">Entrar</button>
      </div>
      <!-- Fallback: only shown if real email delivery is enabled (token arrives by email) -->
      <div id="tokenRow" class="hidden flex-col sm:flex-row gap-2 pt-2 border-t border-zinc-800">
        <input id="loginToken" type="text" class="flex-1 rounded-lg bg-zinc-800 border border-zinc-700 px-3 py-2 text-sm mono" data-i18n-ph="have_token">
        <button id="btnVerify" class="rounded-lg bg-emerald-600 hover:bg-emerald-500 px-4 py-2 text-sm font-medium" data-i18n="verify">Verificar y entrar</button>
      </div>
      <div id="authMsg" class="text-sm text-amber-400"></div>
    </section>

    <!-- Session bar -->
    <section id="sessionBar" class="hidden items-center justify-between text-sm text-zinc-400">
      <span><span data-i18n="logged_in_as">Sesión iniciada como</span> <span id="whoami" class="text-zinc-200"></span></span>
      <button id="btnLogout" class="text-rose-400 hover:underline" data-i18n="logout">Salir</button>
    </section>

    <!-- Composer -->
    <section id="composer" class="hidden space-y-4">
      <label class="block font-semibold" data-i18n="describe_label">Describe el video que quieres</label>
      <div class="flex items-start gap-3">
        <button id="mic" class="orb w-14 h-14 flex-none rounded-full bg-indigo-600 hover:bg-indigo-500 grid place-items-center text-xl" title="mic">&#127908;</button>
        <textarea id="rawText" rows="7" class="flex-1 rounded-xl bg-zinc-900 border border-zinc-800 px-4 py-3 text-sm" data-i18n-ph="describe_placeholder"></textarea>
      </div>
      <div id="micMsg" class="text-xs text-zinc-500"></div>
      <button id="btnGenerate" class="rounded-lg bg-indigo-600 hover:bg-indigo-500 px-5 py-2.5 font-medium" data-i18n="generate">Generar prompt estructurado</button>
    </section>

    <!-- Result -->
    <section id="result" class="hidden space-y-4">
      <h2 class="font-semibold text-lg" data-i18n="result_title">Prompt estructurado</h2>
      <div class="grid sm:grid-cols-2 gap-3">
        <label class="text-sm"><span class="text-zinc-400" data-i18n="field_title">Título</span><input id="f_title" class="mt-1 w-full rounded-lg bg-zinc-800 border border-zinc-700 px-3 py-2 text-sm"></label>
        <label class="text-sm"><span class="text-zinc-400" data-i18n="field_style">Estilo</span><input id="f_style" class="mt-1 w-full rounded-lg bg-zinc-800 border border-zinc-700 px-3 py-2 text-sm"></label>
        <label class="text-sm"><span class="text-zinc-400" data-i18n="field_duration">Duración (seg)</span><input id="f_duration" type="number" class="mt-1 w-full rounded-lg bg-zinc-800 border border-zinc-700 px-3 py-2 text-sm"></label>
        <label class="text-sm"><span class="text-zinc-400" data-i18n="field_aspect">Relación de aspecto</span>
          <select id="f_aspect" class="mt-1 w-full rounded-lg bg-zinc-800 border border-zinc-700 px-3 py-2 text-sm">
            <option>9:16</option><option>16:9</option><option>1:1</option>
          </select></label>
        <label class="text-sm"><span class="text-zinc-400" data-i18n="field_platform">Plataforma</span>
          <select id="f_platform" class="mt-1 w-full rounded-lg bg-zinc-800 border border-zinc-700 px-3 py-2 text-sm">
            <option>tiktok</option><option>youtube</option><option>instagram</option><option>facebook</option><option>general</option>
          </select></label>
      </div>
      <div>
        <div class="text-sm text-zinc-400 mb-1" data-i18n="field_scenes">Escenas</div>
        <textarea id="f_scenes" rows="8" class="w-full rounded-xl bg-zinc-900 border border-zinc-800 px-4 py-3 text-sm mono"></textarea>
      </div>
      <div class="flex flex-wrap gap-2">
        <button id="btnSave" class="rounded-lg bg-emerald-600 hover:bg-emerald-500 px-4 py-2 text-sm font-medium" data-i18n="save">Guardar en mi biblioteca</button>
        <button id="btnRender" class="rounded-lg bg-zinc-700 hover:bg-zinc-600 px-4 py-2 text-sm" data-i18n="render">Renderizar (simulado)</button>
        <button id="btnPublish" class="rounded-lg bg-zinc-700 hover:bg-zinc-600 px-4 py-2 text-sm" data-i18n="publish">Publicar (simulado)</button>
      </div>
      <div id="resultMsg" class="text-sm text-emerald-400"></div>
    </section>
  </main>

  <footer class="border-t border-zinc-800 mt-10">
    <div class="max-w-3xl mx-auto px-6 py-6 text-sm text-zinc-500">
      <a href="./privacy" class="hover:underline" data-i18n="footer_privacy">Aviso de privacidad</a>
    </div>
  </footer>

  <script src="./app.js?v={{VERSION}}"></script>
</body>
</html>
