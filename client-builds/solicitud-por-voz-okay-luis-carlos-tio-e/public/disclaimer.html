<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{DISC_H1}} — Digit2AI</title>
  <link rel="icon" type="image/svg+xml" href="/maramed-icon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background:#0b0f19; color:#e9eef7; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .card { background:linear-gradient(180deg,#141b29,#0d1320); border:1px solid #243049; border-radius:20px; }
  </style>
</head>
<body class="min-h-screen">
  <main class="max-w-2xl mx-auto px-4 py-10">
    <div class="flex items-center justify-between mb-4 text-sm text-slate-400">
      <span class="font-semibold text-slate-200">Digit2AI</span>
      <span>
        <a class="underline hover:text-cyan-300" href="disclaimer?lang=es">ES</a> ·
        <a class="underline hover:text-cyan-300" href="disclaimer?lang=en">EN</a>
      </span>
    </div>

    <h1 class="text-2xl font-bold mb-4 text-amber-300">{{DISC_H1}}</h1>

    <div class="card p-6 space-y-4 text-slate-300 leading-relaxed">
      <p class="font-semibold text-slate-100">{{DISC_BODY_1}}</p>
      <p>{{DISC_BODY_2}}</p>
      <p class="text-amber-300/90">{{DISC_BODY_EXP}}</p>
      <p>{{DISC_BODY_SKIN}}</p>
      <p>{{DISC_BODY_3}}</p>
      <p>{{DISC_BODY_4}}</p>
      <p>{{DISC_BODY_5}}</p>
    </div>

    <div class="mt-6 text-sm">
      <a class="underline hover:text-cyan-300" href="./?lang={{LANG}}">&larr; {{H1}}</a>
    </div>
  </main>
</body>
</html>
