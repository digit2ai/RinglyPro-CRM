<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>{{H1}} — Digit2AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html,body { background:#0b0f19; color:#e9eef7; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; margin:0; }
    .card { background:linear-gradient(180deg,#141b29,#0d1320); border:1px solid #243049; border-radius:16px; }
    .stage { position:relative; width:100%; aspect-ratio:4/3; border-radius:12px; overflow:hidden; background:#000; }
    #cam { width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
    #overlay { position:absolute; inset:0; width:100%; height:100%; transform:scaleX(-1); pointer-events:none; }
    .bpm { font-variant-numeric: tabular-nums; font-family: ui-monospace, Menlo, monospace; }
    .bar { height:5px; border-radius:5px; background:#22304a; overflow:hidden; }
    .bar > i { display:block; height:100%; background:linear-gradient(90deg,#4ade80,#22d3ee); width:0%; transition:width .3s; }
    .metric { background:#0e1524; border:1px solid #243049; border-radius:12px; padding:10px; }
    .sqi-dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
    button:disabled { opacity:.45; }
  </style>
</head>
<body>
  <main class="p-3" style="max-width:420px;margin:0 auto">
    <div class="card p-3">
      <div class="stage">
        <video id="cam" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <canvas id="work" width="72" height="48" style="display:none"></canvas>
      </div>
      <p id="hint" class="text-slate-400 text-xs mt-2 text-center">{{ALIGN}}</p>
      <div class="bar mt-2"><i id="prog"></i></div>
      <div class="flex gap-2 justify-center mt-3">
        <button id="start" class="px-4 py-2 rounded-lg bg-cyan-500 text-slate-900 text-sm font-semibold">{{START}}</button>
        <button id="stop" class="px-4 py-2 rounded-lg bg-slate-700 text-sm font-semibold" disabled>{{STOP}}</button>
        <button id="sim" class="px-3 py-2 rounded-lg bg-slate-800 text-slate-300 text-sm border border-slate-600">{{SIMULATE}}</button>
      </div>
      <div id="sqiBanner" class="hidden mt-3 text-xs rounded-lg px-2 py-1"></div>
      <div id="result" class="hidden mt-3">
        <div class="grid grid-cols-2 gap-2">
          <div class="metric"><div class="text-slate-400" style="font-size:11px">{{M_HR}}</div><div class="bpm text-cyan-300" style="font-size:1.5rem"><span id="hrVal">--</span> <span class="text-slate-500 text-xs">{{U_BPM}}</span></div></div>
          <div class="metric"><div class="text-slate-400" style="font-size:11px">{{M_RR}}</div><div class="bpm text-emerald-300" style="font-size:1.5rem"><span id="rrVal">--</span> <span class="text-slate-500 text-xs">{{U_RPM}}</span></div></div>
        </div>
        <div class="metric mt-2">
          <div class="flex items-center justify-between"><span class="text-slate-400" style="font-size:11px">{{M_SQI}}</span><span><span id="sqiDot" class="sqi-dot" style="background:#64748b"></span> <span id="sqiTxt" class="text-slate-400 text-xs">--</span></span></div>
          <div class="bar mt-1"><i id="sqiBar"></i></div>
        </div>
        <div class="grid grid-cols-2 gap-2 mt-2">
          <div class="metric"><div class="text-slate-400" style="font-size:11px">{{M_HRV}}</div><div class="bpm text-violet-300" style="font-size:1.2rem"><span id="hrvVal">--</span></div></div>
          <div class="metric"><div class="text-slate-400" style="font-size:11px">{{M_STRESS}}</div><div class="bpm text-violet-300" style="font-size:1.2rem"><span id="stressVal">--</span></div></div>
        </div>
        <p class="text-amber-300/70 mt-1" style="font-size:10px">{{TIER_B_NOTE}}</p>
        <div id="saveMsg" class="text-xs mt-1"></div>
      </div>
      <p class="text-amber-300/80 mt-2 text-center" style="font-size:10px">{{DISCLAIMER_INLINE}}</p>
    </div>
  </main>
  <script>
    window.__I18N = {
      lang:'{{LANG}}', capturing:'{{CAPTURING}}', early:'{{PROGRESS_EARLY}}', refining:'{{REFINING}}', done:'{{DONE}}',
      saved:'{{SAVED}}', saveErr:'{{SAVE_ERR}}', camErr:'{{CAM_ERR}}', lowConf:'{{LOWCONF}}',
      sqiLow:'{{SQI_LOW}}', sqiGood:'{{SQI_GOOD}}', sqiFair:'{{SQI_FAIR}}'
    };
  </script>
  <script src="rppg-core.js"></script>
  <script src="rppg.js"></script>
</body>
</html>
