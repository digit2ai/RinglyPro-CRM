<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{LOGIN_H1}} — MaraMed</title>
  <link rel="icon" type="image/svg+xml" href="/maramed-icon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background:#0b0f19; color:#e9eef7; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .card { background:linear-gradient(180deg,#141b29,#0d1320); border:1px solid #243049; border-radius:20px; }
    input { background:#0e1524; border:1px solid #243049; border-radius:10px; padding:11px 12px; color:#e9eef7; width:100%; }
    input:focus { outline:none; border-color:#22d3ee; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
  <main class="w-full" style="max-width:400px">
    <div class="flex items-center justify-between mb-4 text-sm text-slate-400">
      <a href="/maramed-landing.html" style="display:inline-flex;align-items:center;gap:8px;text-decoration:none">
        <img src="/maramed-logo.svg" alt="MaraMed" style="height:26px;width:auto;display:block" />
      </a>
      <span>
        <a class="underline hover:text-cyan-300" href="login?lang=es">ES</a> ·
        <a class="underline hover:text-cyan-300" href="login?lang=en">EN</a>
      </span>
    </div>

    <div class="card p-6">
      <h1 class="text-2xl font-bold mb-1">{{LOGIN_H1}}</h1>
      <p class="text-slate-400 text-sm mb-5">{{LOGIN_SUB}}</p>

      <form id="form" class="space-y-3">
        <div>
          <label class="text-sm text-slate-400 block mb-1">{{LBL_EMAIL}}</label>
          <input id="email" type="email" autocomplete="username" required placeholder="tu@correo.com" />
        </div>
        <div>
          <label class="text-sm text-slate-400 block mb-1">{{LBL_PASS}}</label>
          <input id="password" type="password" autocomplete="current-password" required />
        </div>
        <button id="btn" type="submit" class="w-full px-5 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-semibold">{{BTN_LOGIN}}</button>
      </form>

      <div id="err" class="hidden mt-3 text-sm text-red-400"></div>

      <div class="mt-5 text-center text-sm">
        <a class="underline text-slate-400 hover:text-cyan-300" href="./?lang={{LANG}}">{{LOGIN_GUEST}}</a>
      </div>
    </div>

    <div class="mt-4 text-center text-sm">
      <a class="underline text-slate-500 hover:text-cyan-300" href="/maramed-landing.html">&larr; {{LOGIN_BACK}}</a>
    </div>
  </main>

  <script>
    var LANG = '{{LANG}}';
    var T = { wait: '{{LOGIN_WAIT}}', err: '{{LOGIN_ERR}}', btn: '{{BTN_LOGIN}}' };
    var form = document.getElementById('form'), btn = document.getElementById('btn'), errEl = document.getElementById('err');
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      errEl.classList.add('hidden');
      btn.disabled = true; btn.textContent = T.wait;
      try {
        var r = await fetch('/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value.trim(), password: document.getElementById('password').value })
        });
        var j = await r.json();
        if (r.ok && j && j.token) {
          try { localStorage.setItem('token', j.token); } catch (e2) {}
          // Hand the token to the app so saving + history work.
          location.href = '/maramed/?lang=' + LANG + '&token=' + encodeURIComponent(j.token);
          return;
        }
        throw new Error((j && j.error) || 'login failed');
      } catch (e3) {
        errEl.textContent = T.err; errEl.classList.remove('hidden');
        btn.disabled = false; btn.textContent = T.btn;
      }
    });
  </script>
</body>
</html>
