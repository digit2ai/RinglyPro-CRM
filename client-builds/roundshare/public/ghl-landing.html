<!-- ============================================================= -->
<!-- RoundShare — GHL wrapper for roundshare.app                    -->
<!--                                                                -->
<!-- BETTER OPTION: instead of pasting a full copy, this loads the  -->
<!-- always-current hosted landing (videos + Lina voice + simulator -->
<!-- all work) inside a full-screen frame. Redeploys update it      -->
<!-- automatically — nothing to re-paste.                           -->
<!--                                                                -->
<!-- HOW TO USE IN GHL:                                             -->
<!--  1. Funnel/Website builder -> add a blank page (no sections).  -->
<!--  2. Page Settings -> Custom Code (Body/Footer) -> paste this.  -->
<!--     (Or drop a full-width Custom HTML element and paste it.)   -->
<!--  3. Remove default page padding/margins so it fills the screen.-->
<!--  4. Publish on roundshare.app.                                 -->
<!-- ============================================================= -->
<style>
  html,body{margin:0;padding:0;height:100%;background:#090c16}
  /* GHL sometimes wraps content — force our frame to fill the viewport */
  #rs-frame-wrap{position:fixed;inset:0;width:100vw;height:100vh;border:0;overflow:hidden;background:#090c16;z-index:2147483000}
  #rs-frame-wrap iframe{width:100%;height:100%;border:0;display:block}
  #rs-loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#090c16;color:#f2a9c8;
    font-family:'Inter',-apple-system,Segoe UI,Roboto,sans-serif;font-weight:800;letter-spacing:.04em;z-index:2147483001}
  #rs-loading .rs-sp{width:26px;height:26px;border-radius:50%;border:3px solid rgba(242,169,200,.3);border-top-color:#f2a9c8;
    margin-right:12px;animation:rs-spin .8s linear infinite}
  @keyframes rs-spin{to{transform:rotate(360deg)}}
</style>

<div id="rs-loading"><span class="rs-sp"></span> RoundShare</div>
<div id="rs-frame-wrap">
  <iframe
    src="https://aiagent.ringlypro.com/roundshare/"
    title="RoundShare"
    allow="autoplay; microphone; fullscreen; encrypted-media; clipboard-write"
    referrerpolicy="no-referrer-when-downgrade"
    onload="var l=document.getElementById('rs-loading'); if(l) l.style.display='none';"></iframe>
</div>

<script>
  // Fallback: hide the loader after 6s even if onload is blocked.
  setTimeout(function(){ var l=document.getElementById('rs-loading'); if(l) l.style.display='none'; }, 6000);
</script>
<!-- ===================== END RoundShare GHL wrapper ===================== -->
