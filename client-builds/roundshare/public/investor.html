<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>RoundShare — Confidential Valuation (Private)</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root{
    --ink:#161326; --ink2:#2a2540; --muted:#6b6684; --line:#e7e3f0;
    --brand:#6d4aff; --brand2:#e07aa8; --accent:#0f9d58; --warn:#b9740b;
    --bg:#f6f4fb; --card:#ffffff; --shadow:0 1px 3px rgba(22,19,38,.08),0 8px 28px rgba(22,19,38,.06);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased;}
  .doc{max-width:920px; margin:0 auto; padding:0 22px 90px;}

  .cover{background:linear-gradient(150deg,#140c2b 0%,#241541 55%,#3a1c52 100%);
    color:#fff; border-radius:0 0 26px 26px; padding:54px 44px 46px; position:relative; overflow:hidden; box-shadow:var(--shadow);}
  .cover:after{content:"";position:absolute;right:-120px;top:-120px;width:360px;height:360px;
    background:radial-gradient(circle,rgba(224,122,168,.34),transparent 62%);}
  .brandrow{display:flex;align-items:center;gap:18px;margin-bottom:30px}
  .logo{height:84px;width:84px;display:block;filter:drop-shadow(0 6px 22px rgba(224,122,168,.4))}
  .brandrow b{font-size:19px;letter-spacing:.3px}
  .brandrow span{color:#c8b6ff;font-size:12.5px;display:block;margin-top:2px;letter-spacing:.4px}
  .conf{position:absolute;top:22px;right:26px;font-size:11px;letter-spacing:2px;
    border:1px solid rgba(255,255,255,.35);padding:5px 11px;border-radius:20px;color:#e6d8ff}
  .cover h1{font-size:33px;line-height:1.18;margin:8px 0 6px;font-weight:800;letter-spacing:-.5px}
  .cover .sub{color:#d5c6ff;font-size:16px;max-width:620px}
  .coverstats{display:flex;flex-wrap:wrap;gap:26px;margin-top:34px;padding-top:26px;border-top:1px solid rgba(255,255,255,.14)}
  .coverstats div{min-width:120px}
  .coverstats b{display:block;font-size:24px;color:#fff;letter-spacing:-.5px}
  .coverstats small{color:#c8b6ff;font-size:12px;text-transform:uppercase;letter-spacing:1px}
  .meta{display:flex;flex-wrap:wrap;gap:22px;margin-top:30px;font-size:12.5px;color:#c8b6ff}
  .meta b{color:#fff;font-weight:600}

  section{margin-top:40px}
  h2{font-size:13px;letter-spacing:2.4px;text-transform:uppercase;color:var(--brand);margin:0 0 4px;font-weight:700}
  .h2sub{font-size:23px;font-weight:800;letter-spacing:-.4px;margin:0 0 18px;color:var(--ink)}
  p{color:var(--ink2)}
  .lead{font-size:17px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px;box-shadow:var(--shadow)}
  .grid{display:grid;gap:16px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr 1fr}
  @media(max-width:640px){.g2,.g3{grid-template-columns:1fr}}

  .headline{background:linear-gradient(135deg,#6d4aff 0%,#e07aa8 100%);color:#fff;border:none;text-align:center;padding:30px}
  .headline small{text-transform:uppercase;letter-spacing:2px;font-size:11.5px;opacity:.92}
  .headline .big{font-size:42px;font-weight:800;letter-spacing:-1px;margin:6px 0 2px}
  .headline .note{font-size:13.5px;opacity:.95;max-width:580px;margin:8px auto 0}

  .kpi{padding:18px 20px}
  .kpi .n{font-size:27px;font-weight:800;letter-spacing:-.6px;color:var(--ink)}
  .kpi .l{font-size:12.5px;color:var(--muted);margin-top:2px}
  .kpi .n.brand{color:var(--brand)}
  .kpi .n.rose{color:var(--brand2)}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:none}
  .tbl-wrap{overflow-x:auto}
  .tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;letter-spacing:.3px}
  .tag.live{background:#e3f6ec;color:#0f7a44}
  .tag.beta{background:#fbeaf3;color:#b23a7e}
  .tag.pre{background:#efecf6;color:#6b6684}

  .ff{margin-top:10px}
  .ffrow{display:flex;align-items:center;gap:14px;margin:13px 0}
  .ffrow .lbl{width:200px;font-size:13px;color:var(--ink2);flex-shrink:0}
  .fftrack{flex:1;height:30px;position:relative;background:#efecf6;border-radius:8px}
  .ffbar{position:absolute;height:100%;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-size:11.5px;color:#fff;font-weight:600;white-space:nowrap}
  .axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin:6px 0 0 214px}
  @media(max-width:640px){.ffrow{flex-direction:column;align-items:stretch}.ffrow .lbl{width:auto}.axis{margin-left:0}}

  ul.clean{list-style:none;padding:0;margin:0}
  ul.clean li{padding:9px 0 9px 26px;position:relative;border-bottom:1px solid var(--line);font-size:14.5px;color:var(--ink2)}
  ul.clean li:last-child{border-bottom:none}
  ul.clean li:before{content:"";position:absolute;left:4px;top:16px;width:8px;height:8px;border-radius:50%;background:var(--brand2)}
  ul.risk li:before{background:var(--warn)}

  .callout{border-left:4px solid var(--brand);background:#f2eeff;padding:14px 18px;border-radius:0 12px 12px 0;font-size:14px;color:var(--ink2)}
  .foot{margin-top:46px;border-top:1px solid var(--line);padding-top:20px;font-size:11.5px;color:var(--muted)}
  .foot p{font-size:11.5px;color:var(--muted);margin:6px 0}
  .toc{font-size:13.5px}
  .toc a{color:var(--brand);text-decoration:none}
  .toc a:hover{text-decoration:underline}
  .pill{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:3px 10px;display:inline-block}

  @media print{ body{background:#fff} .cover{border-radius:0} .card,.cover,.headline{box-shadow:none} section{break-inside:avoid} .noprint{display:none} }
  .printbar{position:fixed;bottom:18px;right:18px;z-index:20}
  .printbar button{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-weight:600;font-size:14px;cursor:pointer;box-shadow:0 6px 20px rgba(109,74,255,.4)}
</style>

<style>
  .gate{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;
    background:linear-gradient(150deg,#140c2b 0%,#241541 55%,#3a1c52 100%)}
  .gatecard{width:100%;max-width:400px;background:#fbfaf8;border-radius:18px;padding:30px 28px;text-align:center;
    box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .gatecard .glogo{width:58px;height:58px;margin:0 auto 14px;display:block}
  .gatecard h1{font-size:19px;margin:0 0 4px;color:#161326}
  .gatecard p{font-size:13px;color:#6b6684;margin:0 0 18px}
  .gatecard input{width:100%;font-size:16px;padding:12px 14px;border:1px solid #e0dbd1;border-radius:10px;background:#f4f2ee;color:#161326;text-align:center;letter-spacing:.04em}
  .gatecard input:focus{outline:2px solid #6d4aff;border-color:#6d4aff}
  .gatecard button{width:100%;margin-top:12px;padding:12px;background:#6d4aff;color:#fff;border:none;border-radius:10px;font-weight:600;font-size:15px;cursor:pointer}
  .gerr{color:#c0392b;font-size:12.5px;margin-top:10px;min-height:1em}
  .hidden{display:none!important}
  .doc.hidden{display:none!important}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gatecard">
    <svg class="glogo" viewBox="0 0 100 100" aria-label="RoundShare"><defs><linearGradient id="gg" x1="0" y1="0" x2="100" y2="100"><stop offset="0" stop-color="#f2a9c8"/><stop offset="1" stop-color="#e07aa8"/></linearGradient></defs><rect x="2" y="2" width="96" height="96" rx="22" fill="#212430"/><g transform="translate(50,51) scale(.86) translate(-49,-51)"><path fill="none" stroke="url(#gg)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M30 86 C 20 60, 30 40, 46 34 C 48 30, 50 27, 52 26 L 63 15 C 61 24, 59 30, 57 34 C 64 38, 70 52, 74 64 C 76 70, 73 76, 66 74 C 61 72, 55 64, 51 58 C 49 66, 46 78, 44 88"/><circle cx="57" cy="40" r="3" fill="url(#gg)"/></g></svg>
    <h1>Private &mdash; RoundShare Valuation</h1>
    <p>Confidential investor &amp; valuation package.<br>Enter the access key to view.</p>
    <form id="gateForm">
      <input type="password" id="passcode" placeholder="Access key" autocomplete="off" autofocus>
      <button type="submit">Unlock</button>
      <div class="gerr" id="gerr"></div>
    </form>
  </div>
</div>
<div class="doc hidden" id="invBody"></div>
<div class="printbar noprint hidden" id="printbar">
  <button id="pdfBtn">Download / Print PDF</button>
</div>

<script>
  var BASE=location.pathname.replace(/\/+$/,'');
  // '' on roundshare.app, '/roundshare' on aiagent — mount base for the admin endpoint.
  var APP=location.pathname.replace(/\/(investors?|investor-summary|valuation|pre-seed-valuation)\/?$/,'');

  function revealDoc(html){
    document.getElementById('invBody').innerHTML=html;
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('invBody').classList.remove('hidden');
    document.getElementById('printbar').classList.remove('hidden');
  }

  // Authenticated admins skip the access-key gate entirely.
  fetch(APP+'/admin/api/investor-body',{credentials:'same-origin'})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ if(j&&j.ok&&j.html){ revealDoc(j.html); } })
    .catch(function(){});

  document.getElementById('gateForm').addEventListener('submit',function(e){
    e.preventDefault();
    var pc=document.getElementById('passcode').value||'';
    var err=document.getElementById('gerr'); err.textContent='Checking…';
    fetch(BASE+'/body',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({passcode:pc})})
      .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j};});})
      .then(function(res){
        if(res.ok&&res.j&&res.j.ok){
          revealDoc(res.j.html);
        } else { err.textContent=(res.j&&res.j.error)||'Incorrect key.'; }
      }).catch(function(){ err.textContent='Network error — please try again.'; });
  });
  document.getElementById('pdfBtn').addEventListener('click',function(){
    document.title='RoundShare-Valuation-'+new Date().toISOString().slice(0,10); window.print();
  });
</script>
</body>
</html>
