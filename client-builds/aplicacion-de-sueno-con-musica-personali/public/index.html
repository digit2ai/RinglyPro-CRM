<!DOCTYPE html>
<html lang="{{lang}}" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07090f">
  <meta name="description" content="{{tagline}}">
  <title>{{html_title}}</title>

  <!-- Installable on the home screen. iOS ignores the manifest's icons and
       reads apple-touch-icon, so both are declared; iOS also rounds the corners
       itself, which is why the source PNG is full-bleed. -->
  <link rel="manifest" href="{{MOUNT}}/manifest.webmanifest">
  <link rel="apple-touch-icon" href="{{MOUNT}}/apple-touch-icon.png">
  <link rel="icon" href="{{MOUNT}}/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="{{MOUNT}}/favicon-32.png" sizes="32x32" type="image/png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="{{h1}}">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: {
      mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
    } } } };
  </script>
  <style>
    :root { color-scheme: dark; }
    body {
      background:
        radial-gradient(1100px 700px at 18% -10%, #1a2144 0%, transparent 60%),
        radial-gradient(900px 600px at 92% 8%, #2a1a44 0%, transparent 58%),
        #07090f;
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .card { background: rgba(16,20,32,.78); border: 1px solid rgba(255,255,255,.07); backdrop-filter: blur(14px); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; }
    /* The breathing moon: a slow 8-second cycle, the tempo of a calm exhale. */
    .moon { animation: breathe 8s ease-in-out infinite; }
    .moon.is-playing { animation-duration: 5.5s; }
    @keyframes breathe {
      0%,100% { transform: scale(1);    filter: drop-shadow(0 0 26px rgba(150,170,255,.30)); }
      50%     { transform: scale(1.05); filter: drop-shadow(0 0 52px rgba(170,150,255,.52)); }
    }
    @media (prefers-reduced-motion: reduce) { .moon { animation: none; } }
    input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; }
    input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 99px; background: rgba(255,255,255,.14); }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; margin-top: -8px; width: 20px; height: 20px;
      border-radius: 99px; background: #c4b5fd; border: 0; box-shadow: 0 0 14px rgba(167,139,250,.6);
    }
    input[type=range]::-moz-range-track { height: 4px; border-radius: 99px; background: rgba(255,255,255,.14); }
    input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border: 0; border-radius: 99px; background: #c4b5fd; }
    .tp { transition: opacity .25s ease, transform .25s ease; }
    .tp[hidden] { display: none; }
  </style>
</head>
<body class="text-slate-100 antialiased">

<div class="mx-auto max-w-xl px-5 pt-8 pb-16">

  <!-- header -->
  <header class="flex items-center justify-between mb-8">
    <div class="mono text-[11px] uppercase tracking-[.22em] text-slate-500">Digit2AI</div>
    <nav class="flex items-center gap-3 text-[13px]">
      <a id="history-link" href="{{MOUNT}}/history?lang={{lang}}"
         class="mono uppercase tracking-wider text-slate-400 hover:text-violet-300 transition">{{nav_history}}</a>
      <a id="lang-toggle" href="#"
         class="mono uppercase tracking-wider rounded-full border border-white/10 px-2.5 py-1 text-slate-400 hover:text-violet-300 hover:border-violet-400/40 transition">ES / EN</a>
    </nav>
  </header>

  <!-- hero -->
  <div class="text-center mb-9">
    <svg class="moon mx-auto mb-6" id="moon" width="104" height="104" viewBox="0 0 104 104" fill="none" aria-hidden="true">
      <defs>
        <radialGradient id="mg" cx="36%" cy="30%" r="78%">
          <stop offset="0%" stop-color="#e9e6ff"/>
          <stop offset="46%" stop-color="#a78bfa"/>
          <stop offset="100%" stop-color="#3b2d7a"/>
        </radialGradient>
      </defs>
      <circle cx="52" cy="52" r="34" fill="url(#mg)"/>
      <circle cx="52" cy="52" r="43" stroke="rgba(167,139,250,.30)" stroke-width="1.5"/>
      <circle cx="52" cy="52" r="51" stroke="rgba(167,139,250,.13)" stroke-width="1"/>
      <circle cx="41" cy="44" r="5"   fill="rgba(255,255,255,.13)"/>
      <circle cx="62" cy="61" r="3.4" fill="rgba(255,255,255,.10)"/>
      <circle cx="59" cy="40" r="2.2" fill="rgba(255,255,255,.10)"/>
    </svg>
    <h1 id="page-title" class="text-4xl font-semibold tracking-tight">{{h1}}</h1>
    <p id="tagline" class="mt-3 text-[15px] leading-relaxed text-slate-400">{{tagline}}</p>
  </div>

  <!-- the countdown, only present once a night is running -->
  <div id="countdown-card" class="card rounded-3xl p-7 mb-5 text-center tp" hidden>
    <div id="countdown-label" class="mono text-[11px] uppercase tracking-[.2em] text-slate-500">{{remaining}}</div>
    <div id="countdown" class="mono text-6xl font-light tabular-nums mt-2 mb-1 text-violet-200">--:--</div>
    <div id="now-playing" class="text-sm text-slate-400"></div>
    <div class="mt-5 h-1 w-full rounded-full bg-white/10 overflow-hidden">
      <div id="progress" class="h-full w-0 rounded-full bg-gradient-to-r from-violet-500 to-indigo-400 transition-all duration-1000 ease-linear"></div>
    </div>
    <div id="fade-badge" class="mono mt-4 inline-flex items-center gap-2 rounded-full border border-amber-400/30 bg-amber-400/10 px-3 py-1 text-[11px] uppercase tracking-wider text-amber-200 tp" hidden>
      <span class="h-1.5 w-1.5 rounded-full bg-amber-300"></span><span id="fade-badge-text">{{fading}}</span>
    </div>
  </div>

  <!-- controls -->
  <div class="card rounded-3xl p-7">
    <!-- Family switch. With 52 tracks a single dropdown is a wall of text, so
         the family narrows it first and the optgroups organise what is left. -->
    <div id="family-tabs" class="mb-5 grid grid-cols-2 gap-2" role="tablist" aria-label="{{label_family}}"></div>

    <label for="track-select" id="label-track"
           class="mono block text-[11px] uppercase tracking-[.2em] text-slate-500 mb-2">{{label_track}}</label>
    <select id="track-select"
            class="w-full rounded-2xl bg-black/40 border border-white/10 px-4 py-3.5 text-[15px] text-slate-100
                   focus:outline-none focus:ring-2 focus:ring-violet-500/50 focus:border-violet-400/40 transition">
      <option value="">…</option>
    </select>
    <div id="track-note" class="mt-2 min-h-[20px] text-[13px] leading-snug text-slate-500"></div>

    <div class="mt-7 flex items-baseline justify-between">
      <label for="timer-input" id="label-timer"
             class="mono text-[11px] uppercase tracking-[.2em] text-slate-500">{{label_timer}}</label>
      <output for="timer-input" id="timer-readout" class="mono text-2xl font-light tabular-nums text-violet-200">60</output>
    </div>
    <input id="timer-input" name="timer_minutes" type="range" min="5" max="180" step="5" value="60"
           class="mt-3 w-full cursor-pointer" aria-describedby="hint-timer">
    <div class="mono mt-1 flex justify-between text-[10px] text-slate-600"><span>5</span><span>180</span></div>
    <p id="hint-timer" class="mt-3 text-[13px] leading-relaxed text-slate-500">{{hint_timer}}</p>

    <div class="mt-7 grid gap-3">
      <button id="start-btn" type="button"
              class="w-full rounded-2xl bg-gradient-to-r from-violet-600 to-indigo-600 px-6 py-4 text-[16px] font-medium
                     text-white shadow-lg shadow-violet-900/40 hover:from-violet-500 hover:to-indigo-500
                     active:scale-[.985] transition disabled:opacity-50">{{start}}</button>
      <div id="running-controls" class="grid grid-cols-2 gap-3 tp" hidden>
        <button id="pause-btn" type="button"
                class="rounded-2xl border border-white/10 bg-white/[.04] px-4 py-3.5 text-[15px] text-slate-200
                       hover:bg-white/[.08] active:scale-[.985] transition">{{pause}}</button>
        <button id="stop-btn" type="button"
                class="rounded-2xl border border-rose-400/25 bg-rose-500/10 px-4 py-3.5 text-[15px] text-rose-200
                       hover:bg-rose-500/20 active:scale-[.985] transition">{{stop}}</button>
      </div>
    </div>

    <p id="status" class="mt-5 min-h-[20px] text-center text-[13px] text-slate-500">{{status_idle}}</p>
  </div>

  <p id="footer-privacy" class="mono mt-7 text-center text-[11px] leading-relaxed text-slate-600">{{footer_privacy}}</p>
  <p class="mono mt-2 text-center text-[10px] text-slate-700">v{{VERSION}}</p>
</div>

<!-- Playback element. Web Audio drives the fade through a GainNode; `loop`
     keeps the seamless ambient bed running for the whole timer. -->
<audio id="sleep-audio" preload="none" loop crossorigin="anonymous"></audio>

<script>
  window.SUENO = {
    mount: '{{MOUNT}}',
    lang: '{{lang}}',
    version: '{{VERSION}}',
    dict: {{DICT_JSON}}
  };
</script>
<script src="{{MOUNT}}/player.js"></script>
</body>
</html>
