<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#0E120F;color:#ECE6DA;font-family:system-ui,sans-serif}.mono{font-family:ui-monospace,Menlo,monospace}</style>
</head>
<body class="min-h-screen">
<div class="max-w-xl mx-auto px-5 py-8">
  <div class="flex items-center justify-between mb-6">
    <div class="text-xl font-extrabold">Equi<span style="color:#E6C572">Mind</span> 3D</div>
    <a id="langToggle" class="text-xs underline cursor-pointer" style="color:#98A199">EN / ES</a>
  </div>
  <h1 class="text-2xl font-bold" data-i18n="cap_title"></h1>
  <p class="text-sm text-slate-400 mt-1" data-i18n="tagline"></p>

  <section class="mt-6 bg-slate-900/60 border border-slate-800 rounded-xl p-5">
    <label class="block text-xs text-slate-400 mb-1" data-i18n="cap_kind"></label>
    <select id="kind" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm">
      <option value="course_walk" data-i18n="kind_course"></option>
      <option value="conformation" data-i18n="kind_conf"></option>
    </select>
    <label class="block text-xs text-slate-400 mb-1 mt-4" data-i18n="cap_video"></label>
    <input id="file" type="file" accept="video/mp4,video/quicktime,image/*" multiple class="w-full text-xs text-slate-300 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-indigo-600 file:text-white">
    <p class="text-xs text-slate-500 mt-2" data-i18n="cap_hint"></p>
    <button id="go" class="mt-4 w-full bg-emerald-600 hover:bg-emerald-500 rounded-lg px-4 py-3 font-semibold disabled:opacity-50" data-i18n="cap_process"></button>
    <div id="status" class="text-xs mono mt-3" style="color:#98A199"></div>
  </section>

  <section class="mt-8 bg-slate-900/60 border rounded-xl p-5" style="border-color:rgba(230,197,114,.28)">
    <div class="flex items-center gap-2">
      <svg viewBox="0 0 32 32" width="22" height="22" fill="none"><path d="M7 25c-1-6 1-11 6-13 1-2 4-4 7-4 1 0 2 1 1 2-1 1-3 1-3 3 3 0 6 2 7 6-2 0-3-1-4-1 1 3 0 6-2 8" stroke="#E6C572" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="21.5" cy="10.5" r="1" fill="#E6C572"/></svg>
      <h2 class="text-base font-bold" style="color:#E6C572" data-i18n="ru_title"></h2>
    </div>
    <p class="text-xs text-slate-400 mt-1" data-i18n="ru_sub"></p>

    <div class="grid grid-cols-2 gap-3 mt-4">
      <div><label class="block text-[11px] text-slate-400 mb-1" data-i18n="ru_horse"></label><input id="r_horse" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm"></div>
      <div><label class="block text-[11px] text-slate-400 mb-1" data-i18n="ru_breed"></label><input id="r_breed" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm"></div>
      <div><label class="block text-[11px] text-slate-400 mb-1" data-i18n="ru_height"></label><input id="r_height" type="number" step="0.1" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm"></div>
      <div><label class="block text-[11px] text-slate-400 mb-1" data-i18n="ru_length"></label><input id="r_length" type="number" step="0.1" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm"></div>
      <div><label class="block text-[11px] text-slate-400 mb-1" data-i18n="ru_capsec"></label><input id="r_capsec" type="number" step="1" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm"></div>
    </div>

    <div class="mt-5 flex items-center justify-between">
      <label class="text-xs font-semibold" style="color:#E6C572" data-i18n="ru_measures"></label>
      <button id="addMeasure" class="text-xs underline" style="color:#98A199" data-i18n="ru_add_measure"></button>
    </div>
    <div id="measRows" class="mt-2 grid gap-2"></div>

    <div class="mt-5 flex items-center justify-between">
      <label class="text-xs font-semibold" style="color:#E6C572" data-i18n="ru_findings"></label>
      <button id="addFinding" class="text-xs underline" style="color:#98A199" data-i18n="ru_add_finding"></button>
    </div>
    <div id="findRows" class="mt-2 grid gap-2"></div>

    <label class="block text-[11px] text-slate-400 mb-1 mt-5" data-i18n="ru_media_opt"></label>
    <input id="r_file" type="file" accept="video/mp4,video/quicktime,image/*" multiple class="w-full text-xs text-slate-300 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-indigo-600 file:text-white">

    <button id="genReport" class="mt-5 w-full rounded-lg px-4 py-3 font-semibold" style="background:linear-gradient(180deg,#E6C572,#C9A24B);color:#241a08" data-i18n="ru_generate"></button>
    <div id="repStatus" class="text-xs mono mt-3" style="color:#98A199"></div>
    <div id="repResult" class="hidden mt-3 flex items-center gap-3 flex-wrap"></div>
  </section>

  <section class="mt-6">
    <h2 class="text-sm font-semibold" style="color:#E6C572" data-i18n="scenes_title"></h2>
    <div id="scenes" class="mt-3 grid gap-3"></div>
  </section>
</div>

<script>window.__I18N={{DICT_JSON}};window.__BASE="{{BASE}}";window.__LANG="{{LANG}}";</script>
<script>
(function(){
var I=window.__I18N||{},B=window.__BASE||'/',L=window.__LANG||'es';
document.querySelectorAll('[data-i18n]').forEach(function(el){var k=el.getAttribute('data-i18n');if(I[k]!=null)el.textContent=I[k];});
document.getElementById('langToggle').onclick=function(){var u=new URL(location.href);u.searchParams.set('lang',L==='es'?'en':'es');location.href=u.toString();};
function token(){try{return localStorage.getItem('token')||new URL(location.href).searchParams.get('token')||'';}catch(e){return '';}}
function authH(){var t=token();return t?{'Authorization':'Bearer '+t}:{};}
var st=document.getElementById('status');
function setS(m){st.textContent=m||'';}

document.getElementById('go').addEventListener('click',function(){
  var files=document.getElementById('file').files; if(!files.length){setS('Selecciona video o fotos');return;}
  var kind=document.getElementById('kind').value;
  var btn=this;btn.disabled=true;setS('1/3 creando sesión…');
  fetch(B+'api/v1/sessions',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authH()),credentials:'same-origin',body:JSON.stringify({kind:kind,source_type:files.length>1?'photos':'video'})})
   .then(function(r){if(r.status===401){setS('Inicia sesión en EquiMind');throw new Error('auth');}return r.json();})
   .then(function(s){setS('2/3 subiendo…');var fd=new FormData();for(var i=0;i<files.length;i++)fd.append('frames',files[i]);
     return fetch(B+'api/v1/sessions/'+s.id+'/upload',{method:'POST',headers:authH(),credentials:'same-origin',body:fd}).then(function(r){return r.json();}).then(function(){return s;});})
   .then(function(s){setS('3/3 procesando (cobra créditos)…');
     return fetch(B+'api/v1/sessions/'+s.id+'/process?inline=1',{method:'POST',headers:authH(),credentials:'same-origin'}).then(function(r){return r.json().then(function(j){return {ok:r.ok,status:r.status,j:j};});});})
   .then(function(res){btn.disabled=false;
     if(res.status===402){setS('Sin créditos: necesita '+(res.j.needed||'')+'. Recarga en EquiMind.');return;}
     if(!res.ok){setS('Error: '+(res.j.error||''));return;}
     setS('Listo. Escena creada.');loadScenes();})
   .catch(function(e){btn.disabled=false;if(e.message!=='auth')setS('Error: '+e.message);});
});

// ---- 3D Gaussian Splatting Report generator ----
var STATUSES=['ok','watch','info'];
function statusOpts(sel){return STATUSES.map(function(s){var t=I['rep_status_'+s]||s;return '<option value="'+s+'"'+(s===sel?' selected':'')+'>'+t+'</option>';}).join('');}
function measRow(pre){pre=pre||{};var el=document.createElement('div');el.className='meas-row grid gap-1 border border-slate-800 rounded-lg p-2';el.style.gridTemplateColumns='1.4fr .9fr .7fr .7fr .7fr .9fr auto';
  el.innerHTML=
    '<input class="rm-label bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs" placeholder="'+(I.ru_col_label||'Measure')+'" value="'+(pre.label||'')+'">'+
    '<input class="rm-value bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs" placeholder="'+(I.ru_col_value||'Value')+'" value="'+(pre.value||'')+'">'+
    '<input class="rm-cm bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs" type="number" step="0.1" placeholder="'+(I.ru_col_cm||'cm')+'" value="'+(pre.cm!=null?pre.cm:'')+'">'+
    '<input class="rm-lo bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs" type="number" step="0.1" placeholder="min" value="'+(pre.ideal_lo!=null?pre.ideal_lo:'')+'">'+
    '<input class="rm-hi bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs" type="number" step="0.1" placeholder="máx" value="'+(pre.ideal_hi!=null?pre.ideal_hi:'')+'">'+
    '<select class="rm-status bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs">'+statusOpts(pre.status||'ok')+'</select>'+
    '<button class="rm-del text-xs px-2" title="'+(I.ru_remove||'Remove')+'" style="color:#C56A4E">✕</button>';
  el.querySelector('.rm-del').onclick=function(){el.remove();};
  document.getElementById('measRows').appendChild(el);return el;
}
function findRow(pre){pre=pre||{};var el=document.createElement('div');el.className='find-row grid gap-1 border border-slate-800 rounded-lg p-2';el.style.gridTemplateColumns='.8fr 1.4fr 2.2fr auto';
  el.innerHTML=
    '<select class="rf-kind bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs">'+statusOpts(pre.kind||'info')+'</select>'+
    '<input class="rf-title bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs" placeholder="'+(I.ru_col_title||'Title')+'" value="'+(pre.title||'')+'">'+
    '<input class="rf-detail bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs" placeholder="'+(I.ru_col_detail||'Detail')+'" value="'+(pre.detail||'')+'">'+
    '<button class="rf-del text-xs px-2" title="'+(I.ru_remove||'Remove')+'" style="color:#C56A4E">✕</button>';
  el.querySelector('.rf-del').onclick=function(){el.remove();};
  document.getElementById('findRows').appendChild(el);return el;
}
document.getElementById('addMeasure').onclick=function(e){e.preventDefault();measRow();};
document.getElementById('addFinding').onclick=function(e){e.preventDefault();findRow();};
// seed one of each
measRow({}); findRow({});

function num(v){var n=parseFloat(v);return isFinite(n)?n:null;}
function collectReport(){
  var height=num(document.getElementById('r_height').value), length=num(document.getElementById('r_length').value);
  var measurements=[];
  document.querySelectorAll('.meas-row').forEach(function(el){
    var label=el.querySelector('.rm-label').value.trim(); var value=el.querySelector('.rm-value').value.trim();
    var cm=num(el.querySelector('.rm-cm').value);
    if(!label&&!value&&cm==null) return;
    measurements.push({key:label.toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,40),label:label,value:value||null,cm:cm,
      ideal_lo:num(el.querySelector('.rm-lo').value),ideal_hi:num(el.querySelector('.rm-hi').value),
      lo:num(el.querySelector('.rm-lo').value)!=null?num(el.querySelector('.rm-lo').value)*0.85:null,
      hi:num(el.querySelector('.rm-hi').value)!=null?num(el.querySelector('.rm-hi').value)*1.15:null,
      at:cm,status:el.querySelector('.rm-status').value});
  });
  var findings=[];
  document.querySelectorAll('.find-row').forEach(function(el){
    var title=el.querySelector('.rf-title').value.trim(); var detail=el.querySelector('.rf-detail').value.trim();
    if(!title&&!detail) return;
    findings.push({kind:el.querySelector('.rf-kind').value,title:title,detail:detail});
  });
  return {horse_name:document.getElementById('r_horse').value.trim()||null,breed:document.getElementById('r_breed').value.trim()||null,
    height_cm:height,length_cm:length,capture_seconds:num(document.getElementById('r_capsec').value),
    measurements:measurements,findings:findings};
}
function setRS(m){document.getElementById('repStatus').textContent=m||'';}

document.getElementById('genReport').addEventListener('click',function(){
  var report=collectReport();
  if(!report.horse_name && !report.measurements.length && report.height_cm==null){setRS(I.ru_need_name||'Add data');return;}
  var btn=this;btn.disabled=true;setRS((I.ru_generating||'Generating…'));
  document.getElementById('repResult').classList.add('hidden');
  var files=document.getElementById('r_file').files;
  fetch(B+'api/v1/sessions',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authH()),credentials:'same-origin',
    body:JSON.stringify({kind:'conformation',source_type:'video',title:report.horse_name||'Conformation',report:report})})
   .then(function(r){if(r.status===401){setRS('Inicia sesión en EquiMind / Log in');throw new Error('auth');}return r.json();})
   .then(function(s){ // mark ready (upload optional media, or empty to flag ready)
     var fd=new FormData();for(var i=0;i<files.length;i++)fd.append('frames',files[i]);
     if(report.capture_seconds!=null)fd.append('source_seconds',report.capture_seconds);
     return fetch(B+'api/v1/sessions/'+s.id+'/upload',{method:'POST',headers:authH(),credentials:'same-origin',body:fd}).then(function(){return s;});})
   .then(function(s){ return fetch(B+'api/v1/sessions/'+s.id+'/process?inline=1',{method:'POST',headers:authH(),credentials:'same-origin'})
       .then(function(r){return r.json().then(function(j){return {ok:r.ok,status:r.status,j:j,sid:s.id};});});})
   .then(function(res){btn.disabled=false;
     if(res.status===402){setRS('Sin créditos: necesita '+(res.j.needed||'')+' / Out of credits');return;}
     if(!res.ok){setRS('Error: '+(res.j.error||''));return;}
     // find the scene created for this session
     return fetch(B+'api/v1/scenes',{headers:authH(),credentials:'same-origin'}).then(function(r){return r.json();}).then(function(rows){
       var sc=(rows||[]).sort(function(a,b){return b.id-a.id;})[0];
       setRS(I.ru_done||'Report ready.');
       var link=location.origin+B+'report?scene='+sc.id+(sc.share_token?('&k='+sc.share_token):'')+'&lang='+L;
       var box=document.getElementById('repResult');box.classList.remove('hidden');
       box.innerHTML='<a href="'+link+'" target="_blank" rel="noopener" class="rounded-lg px-4 py-2 font-semibold text-sm" style="background:linear-gradient(180deg,#E6C572,#C9A24B);color:#241a08">'+(I.ru_open||'Open report ↗')+'</a>'+
         '<button id="repCopy" class="rounded-lg px-4 py-2 text-sm border" style="border-color:rgba(236,230,218,.2);color:#ECE6DA">'+(I.ru_copy||'Copy link')+'</button>'+
         '<span class="mono text-xs" style="color:#98A199">'+sc.report_code+'</span>';
       document.getElementById('repCopy').onclick=function(){navigator.clipboard&&navigator.clipboard.writeText(link);this.textContent=(I.rep_copied||'Copied')+' ✓';};
       loadScenes();
     });})
   .catch(function(e){btn.disabled=false;if(e.message!=='auth')setRS('Error: '+e.message);});
});

function loadScenes(){
  fetch(B+'api/v1/scenes',{headers:authH(),credentials:'same-origin'}).then(function(r){return r.ok?r.json():[];}).then(function(rows){
    var box=document.getElementById('scenes');box.innerHTML='';
    (rows||[]).forEach(function(s){var d=document.createElement('div');d.className='bg-slate-900/50 border border-slate-800 rounded-xl p-4 flex items-center justify-between gap-3';
      var suf=(s.share_token?('&k='+s.share_token):'');
      d.innerHTML='<div><div class="font-semibold text-sm">'+(s.title||s.kind)+' <span class="mono text-xs" style="color:#98A199">'+s.report_code+'</span></div>'+
        '<div class="text-xs text-slate-400">'+s.splat_count+' splats · '+(s.is_simulated?(I.sim_note||'sim'):'')+'</div></div>'+
        '<div class="flex items-center gap-3 whitespace-nowrap">'+
          '<a href="'+B+'report?scene='+s.id+suf+'&lang='+L+'" target="_blank" rel="noopener" class="text-sm underline" style="color:#E6C572">'+(I.ru_title||'Report')+' ↗</a>'+
          '<a href="'+B+'viewer?scene='+s.id+suf+'" target="_blank" rel="noopener" class="text-sm underline" style="color:#98A199">'+(I.open_viewer||'View 3D')+' ↗</a>'+
        '</div>';
      box.appendChild(d);});
  }).catch(function(){});
}
loadScenes();
})();
</script>
</body>
</html>
