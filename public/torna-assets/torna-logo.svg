<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" role="img" aria-label="Torna">
  <defs>
    <linearGradient id="tgOrb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ee8d5"/>
      <stop offset=".5" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="tgArc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="tgWord" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".52" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <!-- mark: an orb in orbit (Torna = return / orbit) -->
  <circle cx="46" cy="45" r="28" fill="none" stroke="#14b8a6" stroke-opacity=".22" stroke-width="4"/>
  <path d="M 46 17 A 28 28 0 0 1 74 45" fill="none" stroke="url(#tgArc)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="46" cy="45" r="13.5" fill="url(#tgOrb)"/>
  <circle cx="40" cy="40" r="3.6" fill="#eafff9" fill-opacity=".9"/>
  <circle cx="74" cy="45" r="5" fill="#34d399"/>
  <!-- wordmark -->
  <text x="92" y="61" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-weight="850" font-size="52" letter-spacing="-2.5" fill="url(#tgWord)">Torna</text>
</svg>
