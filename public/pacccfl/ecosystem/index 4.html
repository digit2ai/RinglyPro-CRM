<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PACC-CFL — The Ecosystem, Explained | Narrated Walkthrough</title>
<meta name="description" content="A narrated walkthrough of the PACC-CFL digital ecosystem on CamaraVirtual: Ava takes you through every module of the member app, one screen at a time. English, Espanol, Tagalog.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/pacccfl/demo/demo.css">
<link rel="icon" href="/pacccfl/pacc-ai-neural-badge.png">
<style>
  :root {
    --navy: #14245f; --navy-deep: #0c142e; --blue: #2f50c8;
    --gold: #e3a51c; --gold-lt: #f5c63f; --white: #fff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: radial-gradient(1200px 700px at 50% -10%, #22398f 0%, #14245f 45%, #0b1228 100%);
    color: #fff;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }

  /* ── top bar ─────────────────────────────────────────────────────────── */
  .topbar {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 14px;
    padding: 10px 20px;
    background: #0038a8;
    border-top: 3px solid #ce1126;
    border-bottom: 2px solid #fcd116;
  }
  .topbar img { height: 34px; width: 34px; border-radius: 9px; background: #fff; padding: 2px; }
  .topbar b { font-size: 17px; font-weight: 800; letter-spacing: 2px; }
  .topbar .sp { flex: 1 1 auto; }
  .lang-switch { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--gold); background: rgba(200,149,46,.12); border-radius: 20px; }
  .lang-opt { font: 600 12px 'Inter',sans-serif; letter-spacing: 1px; color: rgba(255,255,255,.78); background: none; border: 0; padding: 4px 11px; border-radius: 16px; cursor: pointer; }
  .lang-opt:hover { color: var(--gold); background: rgba(200,149,46,.2); }
  .lang-opt[aria-pressed="true"] { color: #14245f; background: var(--gold); }
  .backlink { font-size: 12.5px; color: rgba(255,255,255,.8); border: 1px solid rgba(255,255,255,.28); border-radius: 20px; padding: 5px 13px; }
  .backlink:hover { border-color: var(--gold); color: var(--gold); }

  /* ── stage ───────────────────────────────────────────────────────────── */
  .wrap { flex: 1 1 auto; display: flex; flex-direction: column; padding: 18px 20px 0; max-width: 1240px; width: 100%; margin: 0 auto; }
  .slide-head { text-align: center; margin-bottom: 12px; min-height: 74px; }
  .step-pill {
    display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: 1.6px;
    text-transform: uppercase; color: var(--gold);
    border: 1px solid rgba(227,165,28,.5); background: rgba(227,165,28,.12);
    border-radius: 20px; padding: 4px 13px; margin-bottom: 9px;
  }
  .slide-head h1 { font-size: 27px; font-weight: 800; letter-spacing: -.4px; line-height: 1.15; }
  .slide-head p { font-size: 14px; color: rgba(255,255,255,.72); margin-top: 5px; max-width: 720px; margin-inline: auto; }

  .stage { position: relative; }
  .stage .vc-chrome { transition: opacity .28s ease; }
  .stage.swapping .vc-chrome { opacity: .35; }

  /* cover / intro + outro panels rendered in place of the app */
  .panel {
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 14px;
    padding: 40px 34px;
    text-align: center;
    min-height: 660px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  }
  .panel img.badge { width: 190px; height: auto; filter: drop-shadow(0 14px 32px rgba(0,0,0,.45)); }
  .panel h2 { font-size: 32px; font-weight: 800; letter-spacing: -.5px; }
  .panel p { font-size: 15.5px; color: rgba(255,255,255,.8); max-width: 620px; line-height: 1.65; }
  .panel .cta { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
  .btn-gold {
    background: var(--gold); color: #14245f; font-weight: 700; font-size: 14.5px;
    border: 0; border-radius: 9px; padding: 13px 26px; cursor: pointer;
  }
  .btn-ghost {
    background: transparent; color: #fff; font-weight: 600; font-size: 14.5px;
    border: 1px solid rgba(255,255,255,.4); border-radius: 9px; padding: 13px 26px; cursor: pointer;
  }

  /* login mock */
  .login-card {
    width: min(430px, 92%); background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.16); border-radius: 16px; padding: 30px 28px; text-align: center;
  }
  .login-card img { width: 96px; border-radius: 20px; background: #fff; padding: 4px; margin-bottom: 14px; }
  .login-card h3 { font-size: 24px; font-weight: 800; margin-bottom: 4px; }
  .login-card .sub { font-size: 13.5px; color: rgba(255,255,255,.7); margin-bottom: 20px; }
  .login-card label { display: block; text-align: left; font-size: 10.5px; letter-spacing: 1.2px; text-transform: uppercase; color: rgba(255,255,255,.62); font-weight: 700; margin: 0 0 6px; }
  .login-card .fake-in {
    text-align: left; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.2);
    border-radius: 9px; padding: 11px 13px; font-size: 14px; color: rgba(255,255,255,.45); margin-bottom: 14px;
  }
  .login-card .signin { width: 100%; background: #c0392b; color: #fff; font-weight: 700; font-size: 15px; border: 0; border-radius: 9px; padding: 13px; }

  /* ── narration dock ──────────────────────────────────────────────────── */
  .dock {
    flex: 0 0 auto; position: sticky; bottom: 0; z-index: 20;
    background: rgba(8, 14, 34, .93);
    backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255,255,255,.14);
    padding: 12px 20px 14px;
    margin-top: 16px;
  }
  .dock-in { max-width: 1240px; margin: 0 auto; }
  .prog { height: 4px; background: rgba(255,255,255,.14); border-radius: 3px; overflow: hidden; margin-bottom: 11px; }
  .prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), var(--gold-lt)); transition: width .2s linear; }
  .narr {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 15.5px; line-height: 1.6; color: rgba(255,255,255,.9);
    min-height: 50px; margin-bottom: 11px;
  }
  .ctrls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ctrl {
    background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.2);
    border-radius: 8px; padding: 8px 15px; font: 600 13px 'Inter',sans-serif; cursor: pointer;
  }
  .ctrl:hover { border-color: var(--gold); color: var(--gold); }
  .ctrl:disabled { opacity: .4; cursor: default; }
  .ctrl.primary { background: var(--gold); color: #14245f; border-color: var(--gold); }
  .count { font-size: 12.5px; color: rgba(255,255,255,.66); margin-left: auto; }
  .voice-ind { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; color: rgba(255,255,255,.62); }
  .voice-ind .dotv { width: 8px; height: 8px; border-radius: 50%; background: #3ecf7a; }
  .voice-ind.buffering .dotv { background: #f4b73e; animation: pulse 1s infinite; }
  .voice-ind.off .dotv { background: #8d94a3; }
  @keyframes pulse { 50% { opacity: .3; } }

  .dots { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px; }
  .dots button { width: 9px; height: 9px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; background: rgba(255,255,255,.24); }
  .dots button.on { background: var(--gold); transform: scale(1.3); }
  .dots button:hover { background: rgba(255,255,255,.6); }

  /* start overlay */
  .cover {
    position: fixed; inset: 0; z-index: 100;
    background: radial-gradient(900px 600px at 50% 30%, #22398f 0%, #14245f 45%, #0b1228 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 30px; text-align: center;
  }
  .cover img { width: 210px; filter: drop-shadow(0 16px 36px rgba(0,0,0,.5)); }
  .cover h2 { font-size: clamp(26px, 5vw, 40px); font-weight: 800; letter-spacing: -.6px; }
  .cover p { font-size: 15.5px; color: rgba(255,255,255,.78); max-width: 560px; line-height: 1.65; }
  .cover.hide { display: none; }

  @media (max-width: 900px) {
    .wrap { padding: 14px 12px 0; }
    .slide-head h1 { font-size: 21px; }
    .slide-head p { font-size: 13px; }
    .panel { min-height: 560px; padding: 28px 20px; }
    .narr { font-size: 14px; }
    .count { width: 100%; margin-left: 0; order: 9; }
  }
</style>
</head>
<body>

<div class="topbar">
  <img src="/pacccfl/pacc-ai-neural-badge.png" alt="PACC-CFL">
  <b>PACC-CFL</b>
  <span class="sp"></span>
  <a class="backlink" href="/pacccfl/" data-en="Back to site" data-es="Volver al sitio" data-tl="Bumalik sa site">Back to site</a>
  <span class="lang-switch" role="group" aria-label="Language">
    <button type="button" class="lang-opt" data-lang="en" aria-pressed="true"  onclick="setLang('en')">EN</button>
    <button type="button" class="lang-opt" data-lang="es" aria-pressed="false" onclick="setLang('es')">ES</button>
    <button type="button" class="lang-opt" data-lang="tl" aria-pressed="false" onclick="setLang('tl')">TL</button>
  </span>
</div>

<div class="wrap">
  <div class="slide-head">
    <div class="step-pill" id="stepPill">Step 1</div>
    <h1 id="slideTitle">—</h1>
    <p id="slideSub"></p>
  </div>
  <div class="stage" id="stage">
    <div class="vc-chrome" id="chrome">
      <div class="vc-chrome-bar">
        <div class="vc-dots"><i></i><i></i><i></i></div>
        <div class="vc-url">camaravirtual.app/<b>cv-2</b></div>
        <span class="vc-demo-tag" id="vcDemoTag">Demo · sample data</span>
      </div>
      <div class="vc-app" id="vcApp"></div>
    </div>
    <div id="panelSlot"></div>
  </div>
</div>

<div class="dock">
  <div class="dock-in">
    <div class="prog"><i id="prog"></i></div>
    <div class="narr" id="narr">—</div>
    <div class="ctrls">
      <button class="ctrl" id="prev" type="button">&larr; <span data-en="Back" data-es="Atrás" data-tl="Balik">Back</span></button>
      <button class="ctrl primary" id="play" type="button" data-en="Pause" data-es="Pausar" data-tl="I-pause">Pause</button>
      <button class="ctrl" id="next" type="button"><span data-en="Next" data-es="Siguiente" data-tl="Susunod">Next</span> &rarr;</button>
      <button class="ctrl" id="replay" type="button" data-en="Replay" data-es="Repetir" data-tl="Ulitin">Replay</button>
      <span class="voice-ind" id="voiceInd"><span class="dotv"></span><span id="voiceTxt">Ava</span></span>
      <span class="count" id="count">1 / 16</span>
    </div>
    <div class="dots" id="dots"></div>
  </div>
</div>

<div class="cover" id="cover">
  <img src="/pacccfl/pacc-ai-neural-badge.png" alt="">
  <h2 data-en="The PACC-CFL Ecosystem, explained"
      data-es="El Ecosistema PACC-CFL, explicado"
      data-tl="Ang Ekosistema ng PACC-CFL, ipinaliwanag">The PACC-CFL Ecosystem, explained</h2>
  <p data-en="Ava walks you through the member app one screen at a time — sixteen steps, about seven minutes. Everything you see is the working software running on sample data."
     data-es="Ava te guía por la app del miembro pantalla por pantalla: dieciséis pasos, unos siete minutos. Todo lo que ves es el software real funcionando con datos de muestra."
     data-tl="Gagabayan ka ni Ava sa app ng miyembro isang screen sa bawat pagkakataon — labing-anim na hakbang, mga pitong minuto. Lahat ng nakikita mo ay ang gumaganang software sa sample na datos.">Ava walks you through the member app one screen at a time — sixteen steps, about seven minutes. Everything you see is the working software running on sample data.</p>
  <div class="cta">
    <button class="btn-gold" id="start" data-en="Start the walkthrough" data-es="Iniciar el recorrido" data-tl="Simulan ang paglalakad">Start the walkthrough</button>
    <button class="btn-ghost" id="startMuted" data-en="Read it without sound" data-es="Leerlo sin sonido" data-tl="Basahin nang walang tunog">Read it without sound</button>
  </div>
</div>

<script src="/pacccfl/demo/demo-data.js"></script>
<script src="/pacccfl/demo/demo.js"></script>
<script src="/pacccfl/ecosystem/deck.js"></script>
</body>
</html>
