<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Test Page - RinglyPro</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1E7A4C">
<style>html,body{background:#1E7A4C}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800;900&display=swap">
<style>
  /* BuyersLine theme: Mulish, navy #26213F + orange #FC4C02 on a lavender-gray band.
     #FC4C02 measures 3.5:1 on white, so the exact orange only fills large type;
     small text and links use #C93D00 (5.1:1). */
  :root{
    --band:#1E7A4C; --surface:#FFFFFF; --ink:#26213F; --muted:#5C6070;
    --rule:#E7E8E9; --brand:#FC4C02; --accent:#C93D00; --accent-soft:#FFEDE3;
    --shadow:0 1px 2px rgba(38,33,63,.04), 0 8px 24px rgba(38,33,63,.06);
    --radius:16px;
    --font:"Mulish","Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--band); color:var(--ink);
    font:400 16px/1.6 var(--font);
    display:flex; align-items:center; justify-content:center;
    padding:32px 20px;
  }
  .card{
    width:100%; max-width:560px; background:var(--surface);
    border:1px solid var(--rule); border-radius:var(--radius);
    padding:36px 28px; text-align:center; box-shadow:var(--shadow);
  }
  h1{
    margin:0 0 10px; font:900 clamp(26px,6vw,36px)/1.2 var(--font);
    letter-spacing:-.02em;
  }
  h1 .hi{color:var(--brand)}
  p{margin:0 0 6px; color:var(--muted); font-size:15px}
  .meta{
    margin-top:22px; padding-top:18px; border-top:1px solid var(--rule);
    font-size:13px; color:var(--muted); word-break:break-word;
  }
  code{
    background:var(--accent-soft); color:var(--accent);
    padding:3px 10px; border-radius:999px; font-family:var(--font);
    font-weight:600; font-size:13px;
  }
</style>
</head>
<body>
  <main class="card">
    <h1><span class="hi">Hello</span> — this is a test</h1>
    <p>Static page served by the RinglyPro CRM app.</p>
    <div class="meta">
      Path: <code>/test/</code><br>
      File: <code>public/test/index.html</code><br>
      Deployed on Render from <code>main</code>.
    </div>
  </main>
</body>
</html>
