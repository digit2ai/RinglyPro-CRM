<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 10 10%22%3E%3Crect width=%2210%22 height=%2210%22 rx=%222%22 fill=%22%232430E0%22/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pre-event checklist | Build With AI</title>
<link rel="stylesheet" href="../assets/site.css">
<script src="../assets/config.js"></script>
<script src="../assets/site.js"></script>
<style>
.grp{margin-top:2.5rem}
.grp h2{margin:0 0 .8rem;font-size:1.5rem}
.item{display:flex;gap:.8rem;align-items:flex-start;background:var(--white);border:1px solid var(--line);padding:.8rem 1rem;margin-bottom:-1px;cursor:pointer}
.item input{width:1.3rem;height:1.3rem;margin-top:.15rem;accent-color:var(--cobalt);flex:none}
.item.done span{color:#7A7FB0;text-decoration:line-through}
.item small{display:block;color:#4A4F86;text-decoration:none}
.count{font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--signal)}
</style>
</head>
<body>
<header id="site-header" data-root="../" data-page="checklist/"></header>
<div class="hero"><div class="wrap">
  <h1><span class="en">Pre-event checklist</span><span class="es">Lista previa al evento</span></h1>
  <p class="lede"><span class="en">Check things off as you verify them. Progress is saved on this device.</span><span class="es">Marca cada punto a medida que lo verificas. El avance se guarda en este dispositivo.</span></p>
  <p style="margin-top:1rem"><span class="count" id="count"></span></p>
</div></div>
<main><div class="wrap read" id="list"></div>
<div class="wrap no-print" style="margin-top:2rem"><button class="btn alt" type="button" id="reset"><span class="en">Clear all checks</span><span class="es">Borrar todas las marcas</span></button></div></main>
<script>
var G = [
 {g:{en:"Configuration",es:"Configuración"}, items:[
  {en:"Set date, start time and venue in assets/config.js",es:"Definir fecha, hora de inicio y lugar en assets/config.js"},
  {en:"Confirm the agent count on slide 12 (agentCount in config.js)",es:"Confirmar el número de agentes en la diapositiva 12 (agentCount en config.js)"},
  {en:"Scan the QR on the live site and confirm it opens /conference/join/",es:"Escanear el QR en el sitio en vivo y confirmar que abre /conference/join/"}]},
 {g:{en:"Recording the ideas",es:"Grabación de las ideas"}, items:[
  {en:"AutoDev signed in on the phone, and a test recording in the real room gives a readable transcript",es:"AutoDev con sesión iniciada en el teléfono, y una grabación de prueba en el salón real da una transcripción legible",note:{en:"The phone hears the presenter far better than the room. Plan to repeat every idea out loud.",es:"El teléfono escucha al presentador mucho mejor que al salón. Planea repetir cada idea en voz alta."}},
  {en:"In that test meeting, the question from the live build guide returns one clear idea",es:"En esa reunión de prueba, la pregunta de la guía de construcción en vivo devuelve una idea clara"},
  {en:"Fieldy charged, recording, and its summary reachable from the laptop",es:"Fieldy cargado, grabando, y su resumen accesible desde la laptop"},
  {en:"A sentence ready to tell the room they are being recorded, and why",es:"Una frase lista para decirle al público que se está grabando, y por qué"}]},
 {g:{en:"The live build",es:"La construcción en vivo"}, items:[
  {en:"VS Code opens the repo and Claude is signed in on the presenter laptop",es:"VS Code abre el repositorio y Claude tiene sesión iniciada en la laptop del presentador"},
  {en:"Run the build prompt from the guide with a sample idea and time it from send to live link",es:"Correr el prompt de construcción de la guía con una idea de ejemplo y medir el tiempo desde enviar hasta el enlace en vivo",note:{en:"You have 23 minutes on stage. If the rehearsal takes more than 18, make the prompt smaller.",es:"Tienes 23 minutos en el escenario. Si el ensayo tarda más de 18, haz el prompt más pequeño."}},
  {en:"Rehearse one small change request on that sample app and time it",es:"Ensayar una solicitud de cambio pequeña sobre esa app de ejemplo y medir el tiempo"},
  {en:"Claude usage limit checked, so the build cannot stop halfway",es:"Límite de uso de Claude revisado, para que la construcción no se detenga a la mitad"},
  {en:"The live build cannot touch client data or production tenants",es:"La construcción en vivo no puede tocar datos de clientes ni cuentas de producción"},
  {en:"Decide when the event app is taken down, and put a reminder on your calendar",es:"Decidir cuándo se apaga la app del evento y poner un recordatorio en el calendario"}]},
 {g:{en:"Fallbacks",es:"Respaldos"}, items:[
  {en:"A working fallback app, built before the event, with its link saved",es:"Una app de respaldo funcionando, construida antes del evento, con su enlace guardado"},
  {en:"Five backup ideas written down, in case the room is quiet",es:"Cinco ideas de respaldo escritas, por si el público no participa"},
  {en:"Screen recording of a full build (prompt, agents working, live link) saved offline",es:"Grabación de pantalla de una construcción completa (prompt, agentes trabajando, enlace en vivo) guardada sin conexión"},
  {en:"Phone hotspot tested with the laptop",es:"Hotspot del teléfono probado con la laptop"}]},
 {g:{en:"Room and equipment",es:"Salón y equipo"}, items:[
  {en:"Projector input tested with your laptop and adapter",es:"Entrada del proyector probada con tu laptop y adaptador"},
  {en:"Presenter view tested on two screens (press P in the keynote)",es:"Vista de presentador probada en dos pantallas (presiona P en la conferencia)"},
  {en:"VS Code font size readable from the back row",es:"Tamaño de letra de VS Code legible desde la última fila"},
  {en:"Microphone, power strip, phone stand",es:"Micrófono, multitoma, soporte para el teléfono"},
  {en:"Wi-Fi name and password posted where everyone can see it",es:"Nombre y contraseña del Wi-Fi visibles para todos"}]},
 {g:{en:"Print",es:"Impresión"}, items:[
  {en:"QR cards for the room (open the printable QR page)",es:"Tarjetas con QR para el salón (abre la página de QR para imprimir)"},
  {en:"Speaker script printed as a backup",es:"Guion del presentador impreso como respaldo"},
  {en:"Live build guide printed, with the two prompts",es:"Guía de construcción en vivo impresa, con los dos prompts"}]},
 {g:{en:"Day of",es:"El día del evento"}, items:[
  {en:"Full rehearsal with the timer: 60 minutes",es:"Ensayo completo con el reloj: 60 minutos"},
  {en:"Reset the keynote timer and build clock before doors open",es:"Reiniciar el reloj de la conferencia y el de construcción antes de abrir puertas"},
  {en:"Open every page once on the presenter laptop so it works offline",es:"Abrir cada página una vez en la laptop para que funcione sin conexión"},
  {en:"After the build: paste the app link into appUrl in config.js and push, so the audience page shows it",es:"Después de la construcción: pegar el enlace de la app en appUrl en config.js y hacer push, para que la página del público lo muestre"}]}
];
(function(){
  var KEY="bwa-checklist-v2", s={}; try{ s=JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){}
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){} }
  function bi(o){ return '<span class="en">'+o.en+'</span><span class="es">'+o.es+'</span>'; }
  var html="", total=0;
  G.forEach(function(g,a){ html += '<section class="grp"><h2>'+bi(g.g)+'</h2>';
    g.items.forEach(function(it,b){ var id=a+"-"+b; total++;
      html += '<label class="item'+(s[id]?' done':'')+'"><input type="checkbox" data-id="'+id+'"'+(s[id]?' checked':'')+'><span>'+bi(it)+(it.note?'<small>'+bi(it.note)+'</small>':'')+'</span></label>'; });
    html += '</section>'; });
  var list=document.getElementById("list"); list.innerHTML=html;
  function count(){ var d=Object.keys(s).filter(function(k){return s[k];}).length; document.getElementById("count").innerHTML = d+" / "+total+' <span class="en">done</span><span class="es">listos</span>'; }
  list.addEventListener("change", function(e){ var id=e.target.dataset.id; s[id]=e.target.checked; e.target.parentNode.classList.toggle("done", e.target.checked); save(); count(); });
  document.getElementById("reset").onclick=function(){ s={}; save(); list.querySelectorAll("input").forEach(function(i){ i.checked=false; i.parentNode.classList.remove("done"); }); count(); };
  count();
})();
</script>
</body>
</html>
