var I18N = {
  en: { foot: 'Operations · Inventory · Customer Service', vcf: 'Save contact', email: 'Email', call: 'Call' },
  es: { foot: 'Operaciones · Inventario · Servicio al Cliente', vcf: 'Guardar contacto', email: 'Correo', call: 'Llamar' }
};

var LANG = 'en';
function t(v){ return (v && typeof v === 'object' && !Array.isArray(v)) ? (v[LANG] !== undefined ? v[LANG] : (v.en || '')) : (v || ''); }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function renderPhoto(){
  var slot = $('photoSlot'), vid = t(PROFILE.video);
  if (vid) {
    slot.innerHTML = '<video class="photo" id="heroVideo" src="' + vid + '"' + (PROFILE.photo ? ' poster="' + PROFILE.photo + '"' : '') +
      ' autoplay muted loop playsinline webkit-playsinline preload="metadata" aria-label="' + esc(PROFILE.name) + '"></video>';
  } else if (PROFILE.photo) {
    slot.innerHTML = '<img class="photo" src="' + PROFILE.photo + '" alt="' + esc(PROFILE.name) + '">';
  }
}

function renderSection(s){
  var head = '<div class="sec-head"><span class="k">' + s.k + '</span><h2>' + t(s.h) + '</h2><span class="rule"></span></div>';
  if (s.type === 'jobs') {
    return '<section class="blk">' + head + '<div class="card">' + s.jobs.map(function(j){
      return '<div class="job"><h3>' + t(j.role) + '</h3>' +
        '<div class="co">' + esc(j.co) + ' &middot; ' + esc(j.place) + '</div>' +
        '<div class="when">' + t(j.when) + '</div>' +
        '<ul>' + t(j.bullets).map(function(b){ return '<li>' + esc(b) + '</li>'; }).join('') + '</ul></div>';
    }).join('') + '</div></section>';
  }
  if (s.type === 'skills') {
    return '<section class="blk">' + head + '<div class="card"><div class="sgrid">' +
      s.skills.map(function(k){ return '<span class="skill">' + esc(k) + '</span>'; }).join('') + '</div></div></section>';
  }
  return '<section class="blk">' + head + '<div class="card"><div class="lead">' + t(s.body) + '</div></div></section>';
}

function render(){
  document.documentElement.lang = LANG;
  $('yr').textContent = new Date().getFullYear();
  $('brandSub').textContent = PROFILE.location;
  $('eyebrow').textContent = t(PROFILE.eyebrow);
  $('titleLine').textContent = t(PROFILE.titleLine);
  $('subtitle').textContent = t(PROFILE.subtitle);
  $('footTag').textContent = (I18N[LANG] || I18N.en).foot;

  $('chips').innerHTML = PROFILE.chips.map(function(c){
    return '<span class="chip"><i class="fas ' + c.icon + '"></i> ' + t(c.label) + '</span>';
  }).join('');

  var d = I18N[LANG] || I18N.en;
  $('socialRow').innerHTML =
    '<a class="sbtn accent" href="mailto:' + PROFILE.email + '"><i class="fas fa-envelope"></i> ' + PROFILE.email + '</a>' +
    '<a class="sbtn" href="tel:' + PROFILE.phone + '"><i class="fas fa-phone"></i> ' + PROFILE.phoneDisplay + '</a>' +
    '<button class="sbtn" id="vcfBtn2"><i class="fas fa-address-card"></i> ' + d.vcf + '</button>';
  $('vcfBtn2').onclick = saveVcf;

  renderPhoto();
  $('content').innerHTML = PROFILE.sections.map(renderSection).join('');
}

function saveVcf(){
  var v = ['BEGIN:VCARD','VERSION:3.0','N:Pacelli;Samuel;;;','FN:Samuel Pacelli',
    'TEL;TYPE=CELL:' + PROFILE.phone, 'EMAIL:' + PROFILE.email,
    'ADR;TYPE=HOME:;;;Tampa;FL;;USA', 'URL:' + PROFILE.site, 'END:VCARD'].join('\r\n');
  var a = document.createElement('a');
  a.href = 'data:text/vcard;charset=utf-8,' + encodeURIComponent(v);
  a.download = 'samuel-pacelli.vcf'; document.body.appendChild(a); a.click(); a.remove();
}
$('vcfBtn').onclick = saveVcf;

function setLang(lang){
  LANG = (lang === 'es') ? 'es' : 'en';
  try { localStorage.setItem('spCvLang', LANG); } catch(e){}
  document.querySelectorAll('.lang-btn').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-lang') === LANG); });
  render();
}
(function(){
  var saved; try { saved = localStorage.getItem('spCvLang'); } catch(e){}
  if (!saved) { var nav = (navigator.language || 'en').toLowerCase(); saved = nav.indexOf('es') === 0 ? 'es' : 'en'; }
  setLang(saved);
})();

(function(){
  var b = $('themeBtn');
  function apply(th){
    document.documentElement.setAttribute('data-theme', th);
    b.innerHTML = '<i class="fas ' + (th === 'light' ? 'fa-moon' : 'fa-sun') + '"></i>';
    try { localStorage.setItem('spCvTheme', th); } catch(e){}
  }
  var saved; try { saved = localStorage.getItem('spCvTheme'); } catch(e){}
  apply(saved || 'dark');
  b.onclick = function(){ apply(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light'); };
})();

(function(){
  try {
    fetch('/api/cv/hit', { method:'POST', headers:{'Content-Type':'application/json'}, keepalive:true,
      body: JSON.stringify({ page:'samuelpacelli', path: location.pathname, referrer: document.referrer || '', lang: navigator.language || '' }) });
  } catch(e){}
})();
</script>
