<style>
:root{
  --bg0:#05070e; --bg1:#080c16; --bg2:#0b1120;
  --card:rgba(255,255,255,0.028); --card2:rgba(255,255,255,0.045);
  --line:rgba(255,255,255,0.09); --line2:rgba(255,255,255,0.16);
  --cyan:#22d3ee; --cyan-dim:#1c93ad; --cyan-bd:rgba(34,211,238,0.34);
  --violet:#8b5cf6; --violet-bd:rgba(139,92,246,0.34);
  --green:#84cc16; --green-bd:rgba(132,204,22,0.40);
  --gold:#d69e2e; --amber:#f59e0b;
  --txt:#e8ecf4; --txt2:#cbd3e2; --dim:#9aa4b8; --dim2:#6b7386;
  --grid-line:rgba(255,255,255,.025); --topbar-bg:rgba(5,7,14,.72);
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','SF Mono',ui-monospace,Consolas,monospace;
  --grad:linear-gradient(135deg,#22d3ee 0%,#8b5cf6 100%);
  --grad-soft:linear-gradient(135deg,rgba(34,211,238,.14),rgba(139,92,246,.14));
}
:root[data-theme="light"]{
  --bg0:#f5f7fb; --bg1:#eef1f8; --bg2:#e7ecf5;
  --card:rgba(15,25,55,0.030); --card2:rgba(15,25,55,0.055);
  --line:rgba(15,25,55,0.12); --line2:rgba(15,25,55,0.20);
  --cyan:#0e7490; --cyan-dim:#0891b2; --cyan-bd:rgba(14,116,144,0.34);
  --violet:#6d28d9; --violet-bd:rgba(109,40,217,0.32);
  --green:#4d7c0f; --green-bd:rgba(77,124,15,0.40);
  --txt:#141c2e; --txt2:#38435a; --dim:#5a6478; --dim2:#8892a4;
  --grid-line:rgba(15,25,55,.05); --topbar-bg:rgba(245,247,251,.82);
  --grad-soft:linear-gradient(135deg,rgba(14,116,144,.10),rgba(109,40,217,.10));
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg0);color:var(--txt);line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px;padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right))}

.aura{position:fixed;inset:0;z-index:-2;background:
  radial-gradient(60% 45% at 78% 8%, rgba(139,92,246,.16), transparent 60%),
  radial-gradient(55% 40% at 12% 20%, rgba(34,211,238,.14), transparent 60%),
  radial-gradient(80% 60% at 50% 120%, rgba(34,211,238,.08), transparent 70%),
  var(--bg0)}
.grid-bg{position:fixed;inset:0;z-index:-1;opacity:.5;
  background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(circle at 50% 30%,#000,transparent 80%)}

.topbar{position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);padding-top:env(safe-area-inset-top);
  background:var(--topbar-bg);border-bottom:1px solid var(--line)}
.topbar .row{display:flex;align-items:center;justify-content:space-between;height:60px;gap:14px}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.3px;font-size:15px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--grad);box-shadow:0 0 12px var(--cyan)}
.brand span.sub{color:var(--dim);font-weight:500;font-size:12px;font-family:var(--mono)}
.tb-actions{display:flex;align-items:center;gap:9px}
.lang-toggle{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:22px;padding:3px}
.lang-btn{border:none;background:transparent;color:var(--dim);padding:5px 12px;border-radius:18px;font-family:var(--mono);font-size:12px;font-weight:600;cursor:pointer;transition:.2s;letter-spacing:.5px}
.lang-btn.active{background:var(--grad);color:#04121a}
.mini-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--card);color:var(--txt);padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer;transition:.2s}
.mini-btn.icon-only{padding:7px 10px}
.mini-btn.icon-only i{font-size:14px}
.mini-btn:hover{border-color:var(--cyan-bd);background:var(--grad-soft)}
@media(max-width:720px){.brand span.sub{display:none}.mini-btn .lbl{display:none}}

.hero{padding:56px 0 34px}
.hero-grid{display:grid;grid-template-columns:200px 1fr;gap:40px;align-items:center}
.photo-col{width:200px}
.photo-wrap{position:relative;width:200px;height:200px}
.photo-wrap::before{content:"";position:absolute;inset:-10px;border-radius:26px;background:var(--grad);opacity:.55;filter:blur(16px);z-index:-1;animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.4}50%{opacity:.75}}
.photo{width:200px;height:200px;border-radius:22px;object-fit:cover;object-position:center 20%;border:1.5px solid var(--line2);box-shadow:0 24px 60px rgba(0,0,0,.5);display:block;background:#08131c}
.ring-orbit{position:absolute;inset:-14px;border:1px dashed rgba(34,211,238,.28);border-radius:28px;animation:spin 22s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;letter-spacing:2.5px;color:var(--cyan);text-transform:uppercase;border:1px solid var(--cyan-bd);background:rgba(34,211,238,.06);padding:6px 12px;border-radius:20px;margin-bottom:16px}
.eyebrow b{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 1.5s steps(1) infinite}
@keyframes blink{50%{opacity:.3}}
h1{font-size:clamp(30px,5vw,46px);font-weight:800;letter-spacing:-.8px;line-height:1.05;margin-bottom:12px}
h1 .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.title-line{font-size:clamp(16px,2.4vw,20px);font-weight:600;color:var(--txt);margin-bottom:6px}
.subtitle{font-size:15px;color:var(--dim);max-width:640px;margin-bottom:18px}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:20px}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:7px 13px}
.chip i{color:var(--cyan)}
.social-row{display:flex;flex-wrap:wrap;gap:10px}
.sbtn{display:inline-flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;padding:10px 16px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--txt);font-family:inherit;cursor:pointer;transition:.2s}
.sbtn:hover{transform:translateY(-2px);border-color:var(--cyan-bd);background:var(--grad-soft)}
.sbtn.accent{background:var(--grad);border:none;color:#04121a}
@media(max-width:760px){.hero-grid{grid-template-columns:1fr;gap:26px;text-align:center}.photo-wrap,.photo-col{margin:0 auto}.chips,.social-row{justify-content:center}.subtitle{margin-left:auto;margin-right:auto}}

.blk{padding:34px 0}
.sec-head{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.sec-head .k{font-family:var(--mono);font-size:12px;color:var(--cyan);border:1px solid var(--cyan-bd);border-radius:8px;padding:3px 9px}
.sec-head h2{font-size:clamp(20px,3vw,27px);font-weight:800;letter-spacing:-.4px}
.sec-head .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:16px}
.lead{font-size:15.5px;color:var(--txt2)}
.lead strong{color:var(--txt)}

/* experience */
.job{position:relative;padding-left:26px;margin-bottom:22px}
.job::before{content:"";position:absolute;left:0;top:9px;width:11px;height:11px;border-radius:50%;background:var(--grad);box-shadow:0 0 10px rgba(34,211,238,.5)}
.job::after{content:"";position:absolute;left:5px;top:24px;bottom:-22px;width:1px;background:var(--line2)}
.job:last-child::after{display:none}
.job h3{font-size:16.5px;font-weight:700;margin-bottom:2px}
.job .co{font-size:14px;color:var(--cyan);font-weight:600}
.job .when{font-family:var(--mono);font-size:12px;color:var(--dim2);margin:3px 0 9px}
.job ul{margin-left:18px;color:var(--txt2);font-size:14.5px}
.job li{margin:4px 0}

.sgrid{display:flex;flex-wrap:wrap;gap:9px}
.skill{font-size:13.5px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;color:var(--txt2)}
.note{font-size:13px;color:var(--dim);margin-top:10px}

/* share + QR */
.sharecard{display:flex;align-items:center;gap:16px;margin-top:20px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:560px}
.qrthumb{width:96px;height:96px;flex:0 0 96px;border-radius:10px;background:#fff;padding:6px;cursor:pointer;transition:transform .2s;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.qrthumb:hover{transform:scale(1.04)}
.sharemeta{flex:1;min-width:0}
.sharehint{font-size:13px;color:var(--dim);margin-bottom:10px}
.sharebtns{display:flex;gap:9px;flex-wrap:wrap}
.sharebtns .sbtn{padding:8px 14px;font-size:13px}
@media(max-width:760px){.sharecard{margin-left:auto;margin-right:auto}}
.qrmodal{position:fixed;inset:0;z-index:3000;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(3,5,12,.82);backdrop-filter:blur(6px)}
.qrmodal.on{display:flex}
.qrbox{background:var(--bg1);border:1px solid var(--line2);border-radius:20px;padding:26px;text-align:center;max-width:380px;width:100%}
.qrbig{width:100%;max-width:300px;border-radius:14px;background:#fff;padding:12px}
.qrhint{font-size:13px;color:var(--dim);margin-top:14px}
.qrclose{margin-top:16px}
@media print{.sharecard,.qrmodal{display:none}}

/* voice orb — zero-key Edge neural TTS via /api/tts/edge (Ava in English, Dalia in Spanish) */
.voicebar{max-width:1120px;margin:26px auto 0;padding:0 24px;padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right))}
.voicecard{display:flex;align-items:center;gap:20px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 22px;position:relative;overflow:hidden}
.voicecard::before{content:"";position:absolute;left:0;top:0;height:100%;width:3px;background:var(--grad)}
.vorb{position:relative;width:72px;height:72px;flex:0 0 72px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#a7f0ff,#22d3ee 42%,#8b5cf6 100%);box-shadow:0 0 0 0 rgba(34,211,238,.5);cursor:pointer;transition:transform .2s}
.vorb:hover{transform:scale(1.05)}
.vorb::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid rgba(139,92,246,.35)}
.vorb.speaking{animation:vpulse 1.15s ease-in-out infinite}
.vorb.loading{animation:vspin 1s linear infinite}
@keyframes vpulse{0%{box-shadow:0 0 0 0 rgba(34,211,238,.5)}70%{box-shadow:0 0 0 20px rgba(34,211,238,0)}100%{box-shadow:0 0 0 0 rgba(34,211,238,0)}}
@keyframes vspin{to{transform:rotate(360deg)}}
.vmeta{flex:1;min-width:0}
.vname{font-weight:700;font-size:16px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.vtag{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--cyan);border:1px solid var(--cyan-bd);border-radius:20px;padding:3px 9px}
.vrole{color:var(--dim);font-size:13px;margin:3px 0 12px}
.vctrls{display:flex;gap:9px;flex-wrap:wrap}
.vbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--card2);color:var(--txt);padding:8px 15px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s;font-family:inherit}
.vbtn:hover{border-color:var(--cyan-bd)}
.vbtn.primary{background:var(--grad);border:none;color:#04121a}
.vbtn:disabled{opacity:.45;cursor:default}
.vstatus{font-size:12.5px;color:var(--dim);margin-top:10px;min-height:16px}
.blk.active .card{border-color:var(--cyan-bd);box-shadow:0 0 0 1px var(--cyan-bd)}
@media(max-width:620px){.voicecard{flex-direction:column;text-align:center}.vctrls{justify-content:center}.vname{justify-content:center}.voicecard::before{width:100%;height:3px}}
@media print{.voicebar{display:none}}

.foot{border-top:1px solid var(--line);padding:26px 0 46px;color:var(--dim2);font-size:12.5px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
</style>
</head>

      </div>

    <div>
      <div class="eyebrow" id="eyebrowWrap"><b></b> <span id="eyebrow"></span></div>

function renderSection(s){
  var head = '<div class="sec-head"><span class="k">' + s.k + '</span><h2>' + t(s.h) + '</h2><span class="rule"></span></div>';
  if (s.type === 'jobs') {
    return '<section class="blk">' + head + '<div class="card">' + s.jobs.map(function(j){
      return '<div class="job"><h3>' + t(j.role) + '</h3>' +
        '<div class="co">' + esc(j.co) + ' &middot; ' + esc(j.place) + '</div>' +
        '<div class="when">' + t(j.when) + '</div>' +
        '<ul>' + t(j.bullets).map(function(b){ return '<li>' + esc(b) + '</li>'; }).join('') + '</ul></div>';
    }).join('') + '</div></section>';
  }
  if (s.type === 'skills') {
    return '<section class="blk">' + head + '<div class="card"><div class="sgrid">' +
      s.skills.map(function(k){ return '<span class="skill">' + esc(k) + '</span>'; }).join('') + '</div></div></section>';
  }
  return '<section class="blk">' + head + '<div class="card"><div class="lead">' + t(s.body) + '</div></div></section>';
}

/* ============================================================================
   VOICE ORB — narrates the profile with zero-key Edge neural TTS via
   /api/tts/edge. Ava (en-US-AvaNeural) in English, Dalia (es-MX-DaliaNeural) in
   Spanish; the voice follows the page's language toggle. Falls back to the
   browser's own speech synthesis if the neural route is unreachable, so the
   feature degrades instead of breaking.
   ============================================================================ */
(function(){
  var synth = window.speechSynthesis;
  var orb = $('vorb'), playBtn = $('vPlay'), pauseBtn = $('vPause'), stopBtn = $('vStop'), statusEl = $('vStatus');
  if (!orb) return;

  var NEURAL_URL = '/api/tts/edge';
  var VOICE_FOR = { en: 'ava', es: 'dalia' };
  var queue = [], qi = 0, runToken = 0, paused = false;
  var playbackMode = null, currentAudio = null, neuralOK = true, audioCache = {};
  var browserVoice = null, vlang = 'en';

  function d(){ return I18N[vlang] || I18N.en; }
  function segments(){ return (PROFILE.narration && PROFILE.narration[vlang]) || []; }
  function voiceName(){ return VOICE_FOR[vlang] || 'ava'; }

  function pickBrowserVoice(){
    if (!synth) return;
    var vs = synth.getVoices() || [];
    var pref = vs.filter(function(v){ return v.lang && v.lang.toLowerCase().indexOf(vlang) === 0; });
    browserVoice = pref[0] || vs[0] || null;
  }
  if (synth) { pickBrowserVoice(); synth.onvoiceschanged = pickBrowserVoice; }

  function clearCache(){
    Object.keys(audioCache).forEach(function(k){ try { URL.revokeObjectURL(audioCache[k]); } catch(e){} });
    audioCache = {};
  }

  function fetchNeural(idx){
    var key = voiceName() + '|' + idx;
    if (audioCache[key]) return Promise.resolve(audioCache[key]);
    return fetch(NEURAL_URL, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ text: segments()[idx], voice: voiceName() }) })
      .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.blob(); })
      .then(function(b){ if (!b || b.size < 200) throw new Error('empty'); var u = URL.createObjectURL(b); audioCache[key] = u; return u; });
  }

  function setActive(i){
    var blks = document.querySelectorAll('#content .blk');
    blks.forEach(function(s){ s.classList.remove('active'); });
    if (i != null && i > 0 && blks[i-1]) {
      blks[i-1].classList.add('active');
      blks[i-1].scrollIntoView({ behavior:'smooth', block:'center' });
    }
  }
  function statusSpeaking(){ statusEl.textContent = d().vSpeaking + ' (' + (qi+1) + ' ' + d().vOf + ' ' + queue.length + ')'; }

  function runQueue(token){
    if (token !== runToken) return;
    if (qi >= queue.length) { finish(); return; }
    var idx = queue[qi];
    setActive(idx);
    function advance(){ if (token !== runToken) return; qi++; runQueue(token); }
    if (neuralOK) {
      statusEl.textContent = d().vLoading; orb.classList.add('loading');
      if (qi + 1 < queue.length) fetchNeural(queue[qi+1]).catch(function(){});
      fetchNeural(idx).then(function(url){
        if (token !== runToken) return;
        orb.classList.remove('loading');
        playbackMode = 'neural'; currentAudio = new Audio(url);
        currentAudio.onended = advance;
        currentAudio.onerror = function(){ neuralOK = false; advance(); };
        orb.classList.add('speaking'); statusSpeaking();
        currentAudio.play().catch(function(){ neuralOK = false; statusEl.textContent = d().vFallback; browserSpeak(idx, advance); });
      }).catch(function(){
        if (token !== runToken) return;
        orb.classList.remove('loading'); neuralOK = false;
        statusEl.textContent = d().vFallback; browserSpeak(idx, advance);
      });
    } else { browserSpeak(idx, advance); }
  }

  function browserSpeak(idx, onEnd){
    if (!synth) { onEnd(); return; }
    playbackMode = 'browser';
    var u = new SpeechSynthesisUtterance(segments()[idx]);
    if (browserVoice) u.voice = browserVoice;
    u.lang = browserVoice ? browserVoice.lang : (vlang === 'es' ? 'es-MX' : 'en-US');
    u.rate = 0.98; u.pitch = 1.05;
    u.onstart = function(){ orb.classList.add('speaking'); statusSpeaking(); };
    u.onend = onEnd; u.onerror = onEnd;
    synth.speak(u);
  }

  function start(){
    if (synth) synth.cancel();
    if (currentAudio) { try { currentAudio.pause(); } catch(e){} currentAudio = null; }
    queue = segments().map(function(_, i){ return i; });
    if (!queue.length) return;
    qi = 0; paused = false; runToken++;
    pauseBtn.disabled = false; stopBtn.disabled = false; playBtn.disabled = true;
    $('vPauseLbl').textContent = d().vPause;
    runQueue(runToken);
  }
  function finish(){
    runToken++; orb.classList.remove('speaking'); orb.classList.remove('loading'); setActive(null);
    if (currentAudio) { try { currentAudio.pause(); } catch(e){} currentAudio = null; }
    if (synth) synth.cancel();
    pauseBtn.disabled = true; stopBtn.disabled = true; playBtn.disabled = false;
    statusEl.textContent = d().vDone;
  }

  playBtn.addEventListener('click', start);
  orb.addEventListener('click', function(){ if (playBtn.disabled) finish(); else start(); });
  orb.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); start(); } });
  pauseBtn.addEventListener('click', function(){
    if (!paused) {
      paused = true; $('vPauseLbl').textContent = d().vResume; orb.classList.remove('speaking'); statusEl.textContent = d().vPaused;
      if (playbackMode === 'neural' && currentAudio) currentAudio.pause(); else if (synth) synth.pause();
    } else {
      paused = false; $('vPauseLbl').textContent = d().vPause; orb.classList.add('speaking'); statusSpeaking();
      if (playbackMode === 'neural' && currentAudio) currentAudio.play(); else if (synth) synth.resume();
    }
  });
  stopBtn.addEventListener('click', finish);
  window.addEventListener('beforeunload', function(){ if (synth) synth.cancel(); if (currentAudio) { try { currentAudio.pause(); } catch(e){} } });

  // Language switch: stop playback, drop cached audio (it is voice-specific) and relabel.
  window.__voiceApplyLang = function(lang){
    var nl = (lang === 'es') ? 'es' : 'en';
    if (nl !== vlang) { finish(); clearCache(); vlang = nl; pickBrowserVoice(); }
    var t = d();
    $('vName').textContent = t.vName; $('vTag').textContent = t.vTag; $('vRole').textContent = t.vRole;
    $('vPlayLbl').textContent = t.vPlay; $('vPauseLbl').textContent = paused ? t.vResume : t.vPause;
    $('vStopLbl').textContent = t.vStop;
    if (playBtn.disabled === false) statusEl.textContent = t.vIdle;
  };
  window.__voiceApplyLang(LANG);
})();
