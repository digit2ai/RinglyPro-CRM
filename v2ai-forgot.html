<!-- VISION2AI | Forgot password — request a reset link -->
<style>
.owl *{box-sizing:border-box}
.owl{--bg:#0a0a0e;--card:#16171f;--line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.18);
  --ink:#f2f4f8;--mut:#9aa3b2;--cyan:#22d3ee;--violet:#7c5cff;--magenta:#ec4899;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  position:fixed;inset:0;z-index:2147483000;overflow:auto;background:
    radial-gradient(900px 600px at 50% -10%,rgba(124,92,255,.20),transparent 60%),
    radial-gradient(700px 500px at 90% 110%,rgba(236,72,153,.15),transparent 60%),var(--bg);
  color:var(--ink);font-family:var(--font);display:flex;flex-direction:column}
.owl a{color:inherit;text-decoration:none}
.owl-top{display:flex;align-items:center;justify-content:space-between;padding:22px 30px}
.owl-top img{height:74px;width:auto;display:block}
.owl-top .x{color:var(--mut);font-size:14px;font-weight:600}.owl-top .x:hover{color:var(--ink)}
.owl-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 22px 60px;text-align:center}

/* mini orb — the brand mark, alive */
.owl-orb{position:relative;width:104px;height:104px;margin:0 auto 24px;flex:0 0 104px}
.owl-orb i{position:absolute;border-radius:50%;display:block}
.owl-orb .halo{inset:0;background:radial-gradient(circle at 50% 50%,rgba(236,72,153,.42),rgba(124,92,255,.30) 55%,transparent 72%);filter:blur(2px);animation:owlBreathe 4.2s ease-in-out infinite}
.owl-orb .core{inset:22px;background:radial-gradient(circle at 38% 32%,#eaf6ff,#5ad6f5 26%,#7c5cff 62%,#2a1f6b 100%);
  box-shadow:0 0 34px rgba(124,92,255,.65),0 0 0 1px rgba(255,255,255,.10) inset;animation:owlBreathe 4.2s ease-in-out infinite .35s}
.owl-orb .spark{width:16px;height:11px;left:34px;top:32px;background:rgba(255,255,255,.55);filter:blur(3px);transform:rotate(-24deg)}
.owl-orb .ring{inset:2px;border:1.5px dashed rgba(124,92,255,.55);animation:owlSpin 14s linear infinite}
.owl-orb .ring2{inset:11px;border:1.5px dashed rgba(34,211,238,.45);animation:owlSpin 9s linear infinite reverse}
@keyframes owlBreathe{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.06);opacity:1}}
@keyframes owlSpin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.owl-orb .halo,.owl-orb .core,.owl-orb .ring,.owl-orb .ring2{animation:none}}

.owl h1{font-size:clamp(1.8rem,4vw,2.4rem);font-weight:800;letter-spacing:-.02em;margin:0 0 8px}
.owl .sub{color:var(--mut);font-size:15px;max-width:460px;margin:0 auto 28px;line-height:1.55}
.owl-field{max-width:420px;margin:0 auto 14px;text-align:left}
.owl-field label{display:block;font-size:13px;color:var(--mut);margin:0 0 7px;font-weight:600}
.owl-field input{width:100%;background:var(--card);border:1px solid var(--line2);color:var(--ink);
  border-radius:14px;padding:15px 16px;font:inherit;font-size:15.5px;transition:border-color .15s}
.owl-field input:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,92,255,.18)}
.owl-msg{max-width:420px;margin:2px auto 0;font-size:13px;min-height:18px;line-height:1.5}
.owl-msg.err{color:#fca5a5}.owl-msg.ok{color:#86efac}.owl-msg a{color:var(--cyan);font-weight:600}
.owl-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;cursor:pointer;font-family:inherit;
  font-weight:700;font-size:15px;border-radius:999px;padding:14px 34px;margin-top:14px;
  background:linear-gradient(135deg,var(--cyan),var(--violet));color:#06101f;transition:.15s}
.owl-btn:hover{transform:translateY(-1px);box-shadow:0 12px 34px rgba(124,92,255,.35)}
.owl-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.owl-alt{margin-top:24px;font-size:13.5px;color:var(--mut)}.owl-alt a{color:var(--ink);font-weight:600}
.owl-forgot{max-width:420px;margin:2px auto 0;text-align:right;font-size:13px}
.owl-forgot a{color:var(--mut)}.owl-forgot a:hover{color:var(--cyan)}
.owl-spin{width:16px;height:16px;border:2px solid rgba(6,16,31,.35);border-top-color:#06101f;border-radius:50%;animation:owlSpin .8s linear infinite;display:inline-block}
@media(max-width:560px){.owl-top{padding:16px 18px}.owl-top img{height:54px}.owl-orb{width:88px;height:88px;flex-basis:88px}.owl-orb .core{inset:19px}}
</style>

<div class="owl">
  <div class="owl-top">
    <a href="/v2ai" aria-label="Vision2Ai"><img src="/v2ai-assets/vision2ai-logo.svg" alt="Vision2Ai"></a>
    <a class="x" href="/v2ai">Home</a>
  </div>
  <div class="owl-stage">
    <div class="owl-orb" aria-hidden="true">
      <i class="halo"></i><i class="ring"></i><i class="ring2"></i><i class="core"></i><i class="spark"></i>
    </div>
    <h1>Reset your password</h1>
    <p class="sub">Enter your email and we will send you a link to set a new password. The link is good for one hour.</p>
    <form id="owl-form" autocomplete="on">
      <div class="owl-field"><label>Email</label><input id="owl-email" type="email" placeholder="you@company.com" autocomplete="email" autofocus></div>
      <div class="owl-msg" id="owl-msg" aria-live="polite"></div>
      <div><button class="owl-btn" id="owl-go" type="submit">Send the link &rarr;</button></div>
    </form>
    <div class="owl-alt"><a href="/v2ai/login">Back to sign in</a></div>
  </div>
</div>

<script>
(function(){
  var BASE='/v2ai';
  var form=document.getElementById('owl-form');
  var emailEl=document.getElementById('owl-email');
  var msg=document.getElementById('owl-msg');
  var go=document.getElementById('owl-go');

  try{ var c=JSON.parse(localStorage.getItem('d2ai_contact')||'{}'); if(c.email) emailEl.value=c.email; }catch(e){}

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var email=(emailEl.value||'').trim();
    msg.className='owl-msg'; msg.textContent='';
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ msg.className='owl-msg err'; msg.textContent='Please enter a valid email.'; emailEl.focus(); return; }
    go.disabled=true; go.innerHTML='<span class="owl-spin"></span> Sending…';
    fetch('/projects/api/v1/intake/orbup/forgot',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:email,brand:'v2ai'})})
      .then(function(r){ return r.json().then(function(j){ return {status:r.status,json:j}; }); })
      .then(function(res){
        var j=res.json||{};
        if(res.status!==200 || !j.ok){
          go.disabled=false; go.innerHTML='Send the link &rarr;';
          msg.className='owl-msg err'; msg.textContent=j.error||'Something went wrong. Please try again.';
          return;
        }
        // Deliberately the same answer whether or not the account exists.
        var m='If that email has a workspace, the reset link is on its way. Check your inbox (and spam).';
        if(j.dev_link){ m+='<br><br>Email is not configured on this server, so here is the link: <a href="'+j.dev_link+'">Set a new password &rarr;</a>'; }
        msg.className='owl-msg ok'; msg.innerHTML=m;
        go.innerHTML='Link sent';
      })
      .catch(function(){ go.disabled=false; go.innerHTML='Send the link &rarr;'; msg.className='owl-msg err'; msg.textContent='Could not reach the server. Please try again.'; });
  });
})();
</script>
