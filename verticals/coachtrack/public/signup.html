<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Visionarium Coaching — Crear cuenta</title>
<meta name="theme-color" content="#17a6a6" />
<link rel="manifest" href="/coaching/manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="/coaching/favicon.svg" />
<link rel="apple-touch-icon" href="/coaching/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="CoachTrack" />
<meta name="mobile-web-app-capable" content="yes" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{--bg:#eef3f8;--card:#ffffff;--ink:#16233a;--muted:#64748b;--border:#e3e9f2;--green:#3fc06a;--teal:#17a6a6;--blue:#2a6f9e;--grad:linear-gradient(120deg,#3fc06a,#17a6a6,#2a6f9e)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100svh;display:grid;place-items:center;padding:24px;padding-top:max(24px,env(safe-area-inset-top));position:relative;overflow:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(ellipse 46% 42% at 85% 6%, rgba(63,192,106,.14) 0%, transparent 62%),
  radial-gradient(ellipse 48% 46% at 10% 92%, rgba(42,111,158,.14) 0%, transparent 62%)}
.card{position:relative;z-index:1;width:100%;max-width:420px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:34px 30px;box-shadow:0 24px 60px rgba(22,35,58,.10)}
.brand{display:flex;flex-direction:column;align-items:center;gap:11px;margin-bottom:4px}
.brand .mk{width:46px;height:46px}
.wm{font-weight:800;font-size:27px;letter-spacing:.15em;padding-left:.15em;display:inline-flex;align-items:center;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.wm .o{width:.56em;height:.56em;border-radius:50%;background:var(--grad);display:inline-block;margin:0 .13em;flex:none}
.sub{text-align:center;color:var(--muted);font-size:12px;margin:10px 0 6px;text-transform:uppercase;letter-spacing:.14em;font-weight:700}
.free{display:block;text-align:center;margin:0 auto 22px;background:rgba(63,192,106,.12);color:#1a7a44;font-size:12px;font-weight:800;padding:6px 12px;border-radius:999px;width:max-content;letter-spacing:.03em}
label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em}
input{width:100%;background:#f6f9fc;border:1px solid var(--border);color:var(--ink);padding:14px 14px;border-radius:12px;font-family:inherit;font-size:16px}
input:focus{outline:none;border-color:var(--teal);background:#fff}
button{width:100%;margin-top:24px;background:var(--grad);color:#fff;border:none;padding:15px;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;transition:filter .15s,transform .15s}
button:hover{filter:brightness(1.05);transform:translateY(-1px)}
button:disabled{opacity:.6;cursor:not-allowed;transform:none}
.hint{font-size:11px;color:var(--muted);margin-top:5px}
.err{margin-top:14px;color:#dc2626;font-size:13px;text-align:center;min-height:18px}
.alt{text-align:center;margin-top:20px;font-size:13px;color:var(--muted)}
.alt a{color:var(--teal);font-weight:800;text-decoration:none}
.foot{text-align:center;margin-top:18px;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <svg class="mk" viewBox="0 0 48 48" fill="none" aria-label="Visionarium">
      <defs><linearGradient id="vgm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fc06a"/><stop offset=".5" stop-color="#17a6a6"/><stop offset="1" stop-color="#2a6f9e"/></linearGradient></defs>
      <path d="M12 15 L24 26 L38 12 M24 26 L18 39 M24 26 L34 37" stroke="url(#vgm)" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="12" cy="15" r="2.7" fill="url(#vgm)"/><circle cx="38" cy="12" r="2.7" fill="url(#vgm)"/><circle cx="18" cy="39" r="2.7" fill="url(#vgm)"/><circle cx="34" cy="37" r="2.7" fill="url(#vgm)"/><circle cx="24" cy="26" r="5" fill="url(#vgm)"/>
    </svg>
    <div class="wm">VISI<i class="o"></i>NARIUM</div>
  </div>
  <div class="sub">Coaching con IA</div>
  <span class="free">Gratis para usuarios Visionarium</span>
  <form id="f">
    <label for="name">Nombre</label>
    <input id="name" type="text" autocomplete="name" required />
    <label for="email">Correo</label>
    <input id="email" type="email" autocomplete="email" inputmode="email" required />
    <label for="password">Contraseña</label>
    <input id="password" type="password" autocomplete="new-password" required />
    <div class="hint">Mínimo 6 caracteres.</div>
    <button id="btn" type="submit">Crear cuenta</button>
    <div class="err" id="err"></div>
  </form>
  <div class="alt">¿Ya tienes cuenta? <a href="/coaching/login">Iniciar sesión</a></div>
  <div class="foot">Visionarium &middot; Creativity &amp; Leadership Incubator</div>
</div>

<div id="pwaBanner" style="display:none;position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:60;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 16px 50px rgba(22,35,58,.18);padding:11px 12px;align-items:center;gap:11px;font-size:13px;color:var(--ink)">
  <img src="/coaching/apple-touch-icon.png" alt="" style="width:42px;height:42px;border-radius:11px;flex:none" />
  <div id="pwaText" style="flex:1;line-height:1.4">Instala CoachTrack en tu inicio.</div>
  <button id="pwaAction" style="background:linear-gradient(120deg,#3fc06a,#17a6a6,#2a6f9e);color:#fff;border:none;font-weight:800;font-size:13px;padding:9px 13px;border-radius:9px;cursor:pointer;font-family:inherit;display:none">Instalar</button>
  <button id="pwaClose" aria-label="Cerrar" style="background:none;border:none;font-size:20px;line-height:1;color:var(--muted);cursor:pointer">&times;</button>
</div>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('/coaching/sw.js').catch(()=>{});}
const f=document.getElementById('f'),btn=document.getElementById('btn'),err=document.getElementById('err');
f.addEventListener('submit',async(e)=>{
  e.preventDefault();err.textContent='';btn.disabled=true;btn.textContent='Creando...';
  try{
    const r=await fetch('/coaching/api/v1/auth/signup',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',
      body:JSON.stringify({name:document.getElementById('name').value,email:document.getElementById('email').value,password:document.getElementById('password').value})});
    const d=await r.json();if(!r.ok)throw new Error(d.error||'Error');location.href='/coaching/';
  }catch(ex){err.textContent=ex.message;btn.disabled=false;btn.textContent='Crear cuenta';}
});
// Install the APP to the home screen (native prompt on Android; iOS instructions).
(function(){
  var b=document.getElementById('pwaBanner');if(!b)return;
  var t=document.getElementById('pwaText'),act=document.getElementById('pwaAction'),cl=document.getElementById('pwaClose');
  if(window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true)return;
  var isiOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  var want=new URLSearchParams(location.search).get('install')==='1';
  var dp=null;
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;t.textContent='Instala CoachTrack en tu inicio.';act.style.display='';b.style.display='flex';});
  act.addEventListener('click',async function(){if(dp){dp.prompt();try{await dp.userChoice;}catch(e){}dp=null;b.style.display='none';}});
  cl.addEventListener('click',function(){b.style.display='none';});
  if(isiOS&&want){t.innerHTML='Para instalar CoachTrack: toca <b>Compartir</b> y luego <b>Añadir a inicio</b>.';act.style.display='none';b.style.display='flex';}
})();
</script>
</body>
</html>
