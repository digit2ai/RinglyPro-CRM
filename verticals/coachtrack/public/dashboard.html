<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Visionarium Coaching</title>
<meta name="theme-color" content="#17a6a6" />
<link rel="manifest" href="/coaching/manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="/coaching/favicon.svg" />
<link rel="apple-touch-icon" href="/coaching/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Visionarium" />
<meta name="mobile-web-app-capable" content="yes" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{--bg:#eef3f8;--panel:#ffffff;--soft:#f6f9fc;--ink:#16233a;--muted:#64748b;--border:#e3e9f2;--green:#3fc06a;--teal:#17a6a6;--blue:#2a6f9e;--grad:linear-gradient(120deg,#3fc06a,#17a6a6,#2a6f9e);--good:#16a34a;--warn:#d97706;--bad:#dc2626;--me:#2a6f9e;--coach:#17a6a6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100svh;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;padding:max(6px,env(safe-area-inset-top)) 0 14px;border-bottom:1px solid var(--border);margin-bottom:18px;flex-wrap:wrap}
.brand{display:inline-flex;align-items:center;gap:9px}
.brand .mk{width:30px;height:30px;flex:none}
.wm{font-weight:800;font-size:19px;letter-spacing:.13em;padding-left:.13em;display:inline-flex;align-items:center;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.wm .o{width:.56em;height:.56em;border-radius:50%;background:var(--grad);display:inline-block;margin:0 .12em;flex:none}
.wm-sub{font-weight:600;font-size:13px;color:var(--muted);align-self:center;letter-spacing:.08em;text-transform:uppercase;border-left:1px solid #d5deea;padding-left:9px;margin-left:2px}
@media(max-width:480px){.wm-sub{display:none}}
.spacer{flex:1}
.btn{background:var(--grad);color:#fff;border:none;padding:11px 16px;border-radius:11px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;transition:filter .15s,transform .15s;min-height:44px}
.btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:9px;min-height:38px}
.btn.ghost{background:#fff;border:1px solid var(--border);color:var(--ink)}
.btn.mic.on{background:var(--bad)}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{padding:10px 16px;border-radius:11px;background:var(--panel);border:1px solid var(--border);color:var(--muted);font-weight:700;font-size:14px;cursor:pointer;min-height:42px}
.tab.on{color:#fff;border-color:transparent;background:var(--grad)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px rgba(22,35,58,.05)}
.grid{display:grid;gap:12px}
.grid.k3{grid-template-columns:repeat(3,1fr)}
.kpi{text-align:center;padding:16px 8px}
.kpi .n{font-size:30px;font-weight:800;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.kpi .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-top:6px}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.sess{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--border);border-radius:13px;background:var(--soft);cursor:pointer;margin-bottom:10px;transition:border-color .15s,transform .1s}
.sess:active{transform:scale(.99)}
.sess:hover{border-color:var(--teal)}
.sess .s-subj{font-weight:700}
.sess .s-meta{font-size:12px;color:var(--muted)}
.pill{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.pill.open{background:rgba(42,111,158,.12);color:#255f88}
.pill.in_progress{background:rgba(217,119,6,.14);color:#b45309}
.pill.done{background:rgba(22,163,74,.14);color:#15803d}
.pill.overdue{background:rgba(220,38,38,.12);color:#b91c1c}
.pill.finalized{background:rgba(23,166,166,.14);color:#0f766e}
h2{font-size:17px;margin-bottom:12px}
h3{font-size:14px;margin:0 0 8px}
textarea,input,select{width:100%;background:var(--soft);border:1px solid var(--border);color:var(--ink);padding:12px;border-radius:11px;font-family:inherit;font-size:16px;resize:vertical}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--teal);background:#fff}
.transcript{max-height:44vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px}
.turn{padding:10px 13px;border-radius:13px;max-width:88%;font-size:14px;line-height:1.45}
.turn.me{align-self:flex-end;background:rgba(42,111,158,.10);border:1px solid rgba(42,111,158,.22)}
.turn.coach{align-self:flex-start;background:rgba(23,166,166,.10);border:1px solid rgba(23,166,166,.24)}
.turn .who{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;opacity:.7;margin-bottom:2px}
.turn.me .who{color:var(--me)} .turn.coach .who{color:var(--coach)}
.ai-item{border:1px solid var(--border);border-radius:13px;padding:14px;margin-bottom:12px;background:var(--soft)}
.ai-item .txt{font-weight:600;margin-bottom:8px}
.item-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.chat{margin-top:10px;border-top:1px dashed var(--border);padding-top:10px}
.q{font-size:13px;color:var(--me);font-weight:700;margin-top:8px}
.a{font-size:13px;color:var(--ink);background:rgba(23,166,166,.07);border-left:3px solid var(--coach);padding:9px 11px;border-radius:8px;margin-top:4px;white-space:pre-wrap;line-height:1.5}
.recdot{width:9px;height:9px;border-radius:50%;background:var(--bad);display:inline-block;animation:pulse 1.1s infinite;margin-right:5px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.hidden{display:none!important}
.empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:14px;line-height:1.6}
.flash{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;font-size:13px;z-index:50;box-shadow:0 12px 40px rgba(22,35,58,.25);max-width:90vw}
.back{cursor:pointer;color:var(--muted);font-weight:700;font-size:14px;margin-bottom:12px;display:inline-block;min-height:40px;line-height:40px}
.back:hover{color:var(--ink)}
#installBar{display:none;align-items:center;gap:10px;background:linear-gradient(120deg,rgba(63,192,106,.10),rgba(42,111,158,.10));border:1px solid var(--border);border-radius:13px;padding:11px 14px;margin-bottom:14px;font-size:13px;font-weight:600}
#installBar.show{display:flex}
@media(max-width:560px){
  .grid.k3{grid-template-columns:1fr 1fr}
  .grid.k3 .kpi:nth-child(3){grid-column:1/-1}
  header .btn span.lbl{display:none}
  .logo{height:30px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg class="mk" viewBox="0 0 48 48" fill="none" aria-label="Visionarium">
        <defs><linearGradient id="vgm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fc06a"/><stop offset=".5" stop-color="#17a6a6"/><stop offset="1" stop-color="#2a6f9e"/></linearGradient></defs>
        <path d="M12 15 L24 26 L38 12 M24 26 L18 39 M24 26 L34 37" stroke="url(#vgm)" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="12" cy="15" r="2.7" fill="url(#vgm)"/><circle cx="38" cy="12" r="2.7" fill="url(#vgm)"/><circle cx="18" cy="39" r="2.7" fill="url(#vgm)"/><circle cx="34" cy="37" r="2.7" fill="url(#vgm)"/><circle cx="24" cy="26" r="5" fill="url(#vgm)"/>
      </svg>
      <div class="wm">VISI<i class="o"></i>NARIUM</div>
      <span class="wm-sub">Coaching</span>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="newBtn">+<span class="lbl"> Nueva sesión</span></button>
    <button class="btn ghost sm" id="logout">Salir</button>
  </header>

  <div id="installBar">
    <span>Instala Visionarium Coaching en tu telefono.</span>
    <div class="spacer"></div>
    <button class="btn sm" id="installBtn">Instalar</button>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab on" data-v="home">Inicio</div>
    <div class="tab" data-v="board">Acciones</div>
  </div>

  <!-- HOME -->
  <div id="view-home">
    <div class="grid k3" id="kpis"></div>
    <div class="card">
      <h2>Mis sesiones</h2>
      <div id="sessList"><div class="empty">Cargando...</div></div>
    </div>
  </div>

  <!-- ACCOUNTABILITY BOARD -->
  <div id="view-board" class="hidden">
    <div class="card">
      <h2>Todas mis acciones</h2>
      <div id="boardList"><div class="empty">Cargando...</div></div>
    </div>
  </div>

  <!-- LIVE SESSION -->
  <div id="view-live" class="hidden">
    <span class="back" id="liveBack">&larr; Volver</span>
    <div class="card">
      <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px">
        <h2 style="margin:0" id="liveTitle">Sesión en curso</h2>
        <span id="recState" class="muted" style="font-size:12px"></span>
      </div>
      <div class="transcript" id="liveTranscript" style="margin:12px 0"></div>
      <div class="row" style="gap:8px;margin-bottom:8px">
        <select id="speaker" style="max-width:130px"><option value="me">Yo</option><option value="coach">Lina</option></select>
        <button class="btn ghost sm mic" id="micBtn">Voz</button>
      </div>
      <textarea id="turnText" rows="2" placeholder="Escribe lo que se dijo, o usa el boton Voz para dictar..."></textarea>
      <div class="row" style="justify-content:space-between;margin-top:10px">
        <button class="btn ghost" id="addTurn">Agregar</button>
        <button class="btn" id="finalizeBtn">Finalizar y extraer acciones</button>
      </div>
    </div>
  </div>

  <!-- SESSION DETAIL -->
  <div id="view-detail" class="hidden">
    <span class="back" id="detailBack">&larr; Volver</span>
    <div class="card">
      <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px">
        <h2 style="margin:0" id="dSubject">—</h2>
        <span class="pill finalized" id="dStatus">finalized</span>
      </div>
      <div class="muted" style="font-size:12px;margin:4px 0 12px" id="dMeta"></div>
      <div id="dSummary" style="line-height:1.6"></div>
    </div>
    <div class="card">
      <h2>Acciones (Action Items)</h2>
      <div id="dItems"></div>
    </div>
    <div class="card">
      <h3>Transcripción completa</h3>
      <div class="transcript" id="dTranscript"></div>
    </div>
  </div>
</div>

<script>
const API='/coaching/api/v1';
let LIVE_ID=null,REC=null,RECOG_ON=false;

if('serviceWorker' in navigator){navigator.serviceWorker.register('/coaching/sw.js').catch(()=>{});}

// PWA install prompt
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBar').classList.add('show');});
window.addEventListener('appinstalled',()=>{document.getElementById('installBar').classList.remove('show');});
document.getElementById('installBtn').onclick=async()=>{ if(!deferredPrompt)return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; document.getElementById('installBar').classList.remove('show'); };

function flash(m){const d=document.createElement('div');d.className='flash';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2200);}
async function api(path,opts={}){
  const r=await fetch(API+path,Object.assign({credentials:'include',headers:{'Content-Type':'application/json'}},opts));
  if(r.status===401){location.href='/coaching/login';throw new Error('401');}
  const d=await r.json();if(!r.ok)throw new Error(d.error||'Error');return d;
}
function show(v){
  ['home','board','live','detail'].forEach(x=>document.getElementById('view-'+x).classList.toggle('hidden',x!==v));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===v));
  document.getElementById('tabs').classList.toggle('hidden',v==='live'||v==='detail');
}
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

async function loadHome(){
  const d=await api('/sessions');const sessions=d.sessions||[];
  let allItems=[];try{allItems=(await api('/action-items')).action_items||[];}catch(e){}
  const open=allItems.filter(i=>i.status!=='done').length;
  const overdue=allItems.filter(i=>i.status==='overdue').length;
  document.getElementById('kpis').innerHTML=kpi(sessions.length,'Sesiones')+kpi(open,'Acciones abiertas')+kpi(overdue,'Vencidas');
  const list=document.getElementById('sessList');
  if(!sessions.length){list.innerHTML='<div class="empty">Aun no tienes sesiones.<br>Toca <b>+ Nueva sesión</b> para empezar tu primera sesión con Lina.</div>';return;}
  list.innerHTML=sessions.map(s=>`
    <div class="sess" onclick="openDetail(${s.id})">
      <div style="flex:1">
        <div class="s-subj">${esc(s.subject||'Sesión sin finalizar')}</div>
        <div class="s-meta">${esc(s.coach_name||'Lina')} &middot; ${esc(s.session_date||'')}</div>
      </div>
      ${s.status==='in_progress'?'<span class="pill open">en curso</span>':`<span class="pill finalized">${s.open_action_items} acciones</span>`}
    </div>`).join('');
}
function kpi(n,l){return `<div class="card kpi"><div class="n">${n}</div><div class="l">${l}</div></div>`;}

async function loadBoard(){
  const d=await api('/action-items');const items=d.action_items||[];
  const el=document.getElementById('boardList');
  if(!items.length){el.innerHTML='<div class="empty">No hay acciones todavia.<br>Finaliza una sesión para generar acciones.</div>';return;}
  el.innerHTML=items.map(renderItem).join('');
}
function renderItem(i){
  return `<div class="ai-item" id="item-${i.id}">
    <div class="txt">${esc(i.text)}</div>
    <div class="item-actions">
      <span class="pill ${i.status}">${i.status}</span>
      ${i.session?`<span class="muted" style="font-size:12px">de: ${esc(i.session.subject||'sesión')}</span>`:''}
      ${i.due_date?`<span class="muted" style="font-size:12px">vence ${esc(i.due_date)}</span>`:''}
    </div>
    <div class="item-actions">
      <button class="btn sm ghost" onclick="setStatus(${i.id},'in_progress')">En progreso</button>
      <button class="btn sm ghost" onclick="setStatus(${i.id},'done')">Hecho</button>
      <button class="btn sm" onclick="toggleChat(${i.id})">Preguntar a Lina</button>
    </div>
    <div class="chat hidden" id="chat-${i.id}">
      <div id="thread-${i.id}"></div>
      <div class="row" style="margin-top:8px">
        <input id="qin-${i.id}" placeholder="¿Como empiezo? ¿Que me esta frenando?" />
        <button class="btn sm" onclick="askCoach(${i.id})">Enviar</button>
      </div>
    </div>
  </div>`;
}
async function setStatus(id,status){await api('/action-items/'+id,{method:'PATCH',body:JSON.stringify({status})});flash('Actualizado');refreshCurrent();}
async function toggleChat(id){
  const c=document.getElementById('chat-'+id);c.classList.toggle('hidden');
  if(!c.classList.contains('hidden')){const d=await api('/action-items/'+id+'/guidance');renderThread(id,d.thread||[]);}
}
function renderThread(id,thread){
  document.getElementById('thread-'+id).innerHTML=thread.map(g=>`<div class="q">Tú: ${esc(g.question)}</div><div class="a">${esc(g.ai_response)}</div>`).join('');
}
async function askCoach(id){
  const inp=document.getElementById('qin-'+id);const q=inp.value.trim();if(!q)return;
  inp.value='';inp.disabled=true;
  const t=document.getElementById('thread-'+id);t.insertAdjacentHTML('beforeend',`<div class="q">Tú: ${esc(q)}</div><div class="a" id="pending">Lina esta pensando...</div>`);
  try{await api('/action-items/'+id+'/guidance',{method:'POST',body:JSON.stringify({question:q})});
    const d=await api('/action-items/'+id+'/guidance');renderThread(id,d.thread||[]);
  }catch(e){document.getElementById('pending').textContent='Error: '+e.message;}
  inp.disabled=false;inp.focus();
}

async function startSession(){
  const d=await api('/sessions',{method:'POST',body:JSON.stringify({coach_name:'Lina'})});
  LIVE_ID=d.session.id;
  document.getElementById('liveTranscript').innerHTML='';
  document.getElementById('liveTitle').textContent='Sesión en curso con Lina';
  show('live');document.getElementById('turnText').focus();
}
function renderTurn(container,role,text){
  container.insertAdjacentHTML('beforeend',`<div class="turn ${role}"><div class="who">${role==='coach'?'Lina':'Yo'}</div>${esc(text)}</div>`);
  container.scrollTop=container.scrollHeight;
}
async function addTurn(){
  const ta=document.getElementById('turnText');const text=ta.value.trim();if(!text||!LIVE_ID)return;
  const role=document.getElementById('speaker').value;const source=RECOG_ON?'voice':'typed';
  renderTurn(document.getElementById('liveTranscript'),role,text);ta.value='';
  try{await api('/sessions/'+LIVE_ID+'/turn',{method:'POST',body:JSON.stringify({role,text,source})});}catch(e){flash('Error al guardar');}
}
async function finalize(){
  if(!LIVE_ID)return;
  const b=document.getElementById('finalizeBtn');b.disabled=true;b.textContent='Lina esta extrayendo...';
  try{const d=await api('/sessions/'+LIVE_ID+'/finalize',{method:'POST',body:JSON.stringify({})});
    flash('Sesión finalizada: '+(d.session.subject||''));openDetail(LIVE_ID);LIVE_ID=null;
  }catch(e){flash('Error: '+e.message);}
  b.disabled=false;b.textContent='Finalizar y extraer acciones';
}

// Voice capture (Web Speech API — zero key)
function setupMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const btn=document.getElementById('micBtn');
  if(!SR){btn.disabled=true;btn.title='Tu navegador no soporta dictado por voz';return;}
  btn.onclick=()=>{
    if(RECOG_ON){REC&&REC.stop();return;}
    REC=new SR();REC.lang='es-ES';REC.interimResults=true;REC.continuous=true;
    let finalText='';
    REC.onstart=()=>{RECOG_ON=true;btn.classList.add('on');btn.textContent='Detener';document.getElementById('recState').innerHTML='<span class="recdot"></span>Escuchando...';};
    REC.onresult=(e)=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=t+' ';else interim+=t;}document.getElementById('turnText').value=(finalText+interim).trim();};
    REC.onerror=()=>{};
    REC.onend=()=>{RECOG_ON=false;btn.classList.remove('on');btn.textContent='Voz';document.getElementById('recState').textContent='';if(document.getElementById('turnText').value.trim())addTurn();};
    REC.start();
  };
}

async function openDetail(id){
  const d=await api('/sessions/'+id);const s=d.session;
  document.getElementById('dSubject').textContent=s.subject||'Sesión sin finalizar';
  document.getElementById('dStatus').textContent=s.status;
  document.getElementById('dStatus').className='pill '+(s.status==='finalized'?'finalized':'open');
  document.getElementById('dMeta').textContent=`${s.coach_name||'Lina'} · ${s.session_date||''}`+(s.duration_min?` · ${s.duration_min} min`:'');
  document.getElementById('dSummary').innerHTML=s.summary?esc(s.summary):'<span class="muted">Sin resumen. Esta sesión aun no se finaliza.</span>';
  const items=d.action_items||[];
  document.getElementById('dItems').innerHTML=items.length?items.map(renderItem).join(''):'<div class="empty">Sin acciones.</div>';
  const tc=document.getElementById('dTranscript');tc.innerHTML='';
  (d.transcript||[]).forEach(t=>renderTurn(tc,t.role,t.text));
  show('detail');
}
function refreshCurrent(){
  if(!document.getElementById('view-board').classList.contains('hidden'))loadBoard();
  else if(!document.getElementById('view-home').classList.contains('hidden'))loadHome();
}

document.getElementById('newBtn').onclick=startSession;
document.getElementById('addTurn').onclick=addTurn;
document.getElementById('finalizeBtn').onclick=finalize;
document.getElementById('turnText').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();addTurn();}});
document.getElementById('liveBack').onclick=()=>{show('home');loadHome();};
document.getElementById('detailBack').onclick=()=>{show('home');loadHome();};
document.getElementById('logout').onclick=async()=>{await api('/auth/logout',{method:'POST'});location.href='/coaching/login';};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{const v=t.dataset.v;show(v);v==='board'?loadBoard():loadHome();});
setupMic();loadHome();
</script>
</body>
</html>
