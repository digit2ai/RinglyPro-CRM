<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CoachTrack — Iniciar sesión</title>
<link rel="icon" type="image/svg+xml" href="/coaching/favicon.svg" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{--bg:#0b1020;--card:#121a33;--card2:#0e1530;--indigo:#6366f1;--teal:#14b8a6;--text:#eef2ff;--muted:#9aa6c8;--border:#233054}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:20px;position:relative;overflow:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(ellipse 50% 55% at 85% 8%, rgba(99,102,241,.22) 0%, transparent 60%),
  radial-gradient(ellipse 50% 50% at 12% 88%, rgba(20,184,166,.18) 0%, transparent 60%)}
.card{position:relative;z-index:1;width:100%;max-width:400px;background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:18px;padding:34px 30px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.brand{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:6px}
.mark{width:42px;height:42px;border-radius:11px;overflow:hidden}
.mark svg{display:block;width:100%;height:100%}
.brand .t{font-size:26px;font-weight:800;letter-spacing:-.01em}
.sub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:26px;text-transform:uppercase;letter-spacing:.12em;font-weight:700}
label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.05em}
input{width:100%;background:#0c1430;border:1px solid var(--border);color:var(--text);padding:13px 14px;border-radius:10px;font-family:inherit;font-size:15px}
input:focus{outline:none;border-color:var(--indigo)}
button{width:100%;margin-top:24px;background:linear-gradient(120deg,var(--indigo),var(--teal));color:#fff;border:none;padding:14px;border-radius:10px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;transition:filter .15s,transform .15s}
button:hover{filter:brightness(1.08);transform:translateY(-1px)}
button:disabled{opacity:.6;cursor:not-allowed;transform:none}
.err{margin-top:14px;color:#ff9aa6;font-size:13px;text-align:center;min-height:18px}
.foot{text-align:center;margin-top:22px;font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.foot strong{color:var(--text)}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="mark"><svg viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#14b8a6"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#g)"/><path d="M20 40 L28 32 L34 38 L46 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="46" cy="24" r="3.5" fill="#fff"/></svg></div>
    <div class="t">CoachTrack</div>
  </div>
  <div class="sub">Coaching Personal con IA</div>
  <form id="f">
    <label for="email">Correo</label>
    <input id="email" type="email" autocomplete="username" required />
    <label for="password">Contraseña</label>
    <input id="password" type="password" autocomplete="current-password" required />
    <button id="btn" type="submit">Entrar</button>
    <div class="err" id="err"></div>
  </form>
  <div class="foot">Digit2AI &middot; <strong>CoachTrack</strong></div>
</div>
<script>
const f = document.getElementById('f'), btn = document.getElementById('btn'), err = document.getElementById('err');
f.addEventListener('submit', async (e) => {
  e.preventDefault(); err.textContent=''; btn.disabled=true; btn.textContent='Entrando...';
  try {
    const r = await fetch('/coaching/api/v1/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
      body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Error');
    location.href = '/coaching/';
  } catch(ex){ err.textContent = ex.message; btn.disabled=false; btn.textContent='Entrar'; }
});
</script>
</body>
</html>
