<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}} — LevelUp Media Marketing</title>
<link rel="icon" href="{{BASE}}/icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem("lu_theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<link rel="stylesheet" href="{{BASE}}/base.css?v={{VERSION}}">
<style>
main{max-width:860px;margin:0 auto;padding:24px 16px 80px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-family:var(--script);font-size:30px;color:var(--pink-d);text-decoration:none}
h1{font-size:34px;line-height:1.15}h2{margin-top:36px;border-bottom:2px solid var(--blush);padding-bottom:6px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px;margin:12px 0}
th{background:var(--blush);text-align:left}th,td{border:1px solid var(--line);padding:8px;vertical-align:top}
code{background:var(--blush);padding:1px 5px;border-radius:6px;font-size:.92em}
@media print{.top{display:none}}
</style>
</head>
<body><main>
<div class="top"><a class="logo" href="{{BASE}}/">LevelUp</a><button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch to dark mode"><svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button><button class="btn small" onclick="print()">Print / PDF</button></div>
{{BODY}}
</main><script src="{{BASE}}/theme.js?v={{VERSION}}" defer></script></body>
</html>
