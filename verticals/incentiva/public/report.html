  // ---------- state ----------
  var params = new URLSearchParams(location.search);
  var paramLang = params.get('lang');
  var lang = (paramLang === 'es' || paramLang === 'en') ? paramLang
    : ((navigator.language || '').toLowerCase().indexOf('es') === 0 ? 'es' : 'en');
  var langChosen = paramLang === 'es' || paramLang === 'en';

  var segs = location.pathname.split('/').filter(Boolean);
  var token = segs.length ? decodeURIComponent(segs[segs.length - 1]) : '';

  var view = { kind: 'loading', data: null };

  // ---------- helpers ----------
  function t(key, vars) {
    var s = (I18N[lang] && I18N[lang][key]);
    if (s == null) s = I18N.en[key];
    if (s == null) return key;
    if (vars) s = s.replace(/\{(\w+)\}/g, function (m, k) { return vars[k] != null ? vars[k] : ''; });
    return s;
  }
  function locale() { return lang === 'es' ? 'es-US' : 'en-US'; }
  function isNum(v) { return v !== null && v !== '' && typeof v !== 'boolean' && !isNaN(Number(v)); }
  function money(v) {
    if (!isNum(v)) return null;
    return new Intl.NumberFormat(locale(), { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(Number(v));
  }
  function moneyOrText(v) {
    if (v == null || v === '') return null;
    return isNum(v) ? money(v) : String(v);
  }
  function numFmt(v, max) {
    return new Intl.NumberFormat(locale(), { maximumFractionDigits: max == null ? 1 : max }).format(Number(v));
  }
  function parseDate(s) {
    if (typeof s !== 'string' || !s) return null;
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
    var d = new Date(s);
    return isNaN(d.getTime()) ? null : d;
  }
  // Completion is 'ready', YYYY-MM or YYYY-MM-DD. A bare month must not parse as the last day of the month before.
  function fmtReady(s) {
    var v = String(s);
    if (/^ready$/i.test(v)) return lang === 'es' ? 'ahora' : 'now';
    var m = v.match(/^(\d{4})-(\d{2})(?:-(\d{2}))?/);
    if (!m) return v;
    var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3] || 1));
    return d.toLocaleDateString(locale(), m[3] ? { year: 'numeric', month: 'short', day: 'numeric' } : { year: 'numeric', month: 'long' });
  }
  function fmtDate(s) {
    var d = parseDate(s);
    return d ? d.toLocaleDateString(locale(), { year: 'numeric', month: 'short', day: 'numeric' }) : '';
  }
  function dayKey(s) {
    var d = parseDate(s);
    return d ? d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate() : null;
  }
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v == null || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    });
    for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }
  function append(el, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { append(el, x); }); return; }
    el.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
  }
  function $(id) { return document.getElementById(id); }
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }
  function safeUrl(u) {
    if (typeof u !== 'string') return null;
    try { var p = new URL(u, location.href); return (p.protocol === 'http:' || p.protocol === 'https:') ? p.href : null; }
    catch (e) { return null; }
  }

    var ns = 'http://www.w3.org/2000/svg';

    p.setAttribute('stroke-width', '2'); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('stroke-linejoin', 'round');
    svg.appendChild(p);
    return svg;
  }

    var ul = h('ul', cls ? { class: cls } : null);

    return ul;
  }

  function applyStatic() {
    document.documentElement.lang = lang;
    document.title = t('doc_title');
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) {

    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-aria]'), function (el) {

    });
    Array.prototype.forEach.call(document.querySelectorAll('.lang-toggle button'), function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-lang') === lang ? 'true' : 'false');
    });
    $('homeLink').setAttribute('href', homeUrl());
  }

  function setLang(l) {
    lang = l === 'es' ? 'es' : 'en';
    langChosen = true;
    var url = new URL(location.href);
    url.searchParams.set('lang', lang);
    history.replaceState(null, '', url.pathname + url.search + url.hash);
    applyStatic();
    render();
    // The narrative and labels come from the server in the chosen language.
    if (view.kind === 'ready') load(false);
  }

  Array.prototype.forEach.call(document.querySelectorAll('.lang-toggle button'), function (b) {
    b.addEventListener('click', function () {
      var l = b.getAttribute('data-lang');
      if (l !== lang) setLang(l);
    });
  });

  // ---------- fetch ----------
  function load(isPoll) {
    if (!token) { view = { kind: 'notfound' }; render(); return; }
    var src = previewId
      ? BASE + '/api/v1/agent/reports/' + previewId + '/preview' + (langChosen ? '?lang=' + lang : '')

    fetch(src, { credentials: 'same-origin', headers: { 'Accept': 'application/json' } })
      .then(function (r) {
        return r.text().then(function (txt) {
          var data = null;
          try { data = txt ? JSON.parse(txt) : null; } catch (e) { data = null; }
          return { status: r.status, ok: r.ok, data: data };
        });
      })
      .then(function (res) {
        poll.lastChecked = new Date();
        if (previewId && (res.status === 401 || res.status === 403)) { view = { kind: 'error', message: lang === 'es' ? 'Inicie sesión en la consola de agentes para ver esta vista previa.' : 'Sign in to the agent console to preview this report.' }; render(); return; }
        if (res.status === 404) { stopPoll(); view = { kind: 'notfound' }; render(); return; }
        if (res.status === 429) {
          if (isPoll && view.kind === 'pending') { schedulePoll(); render(); return; }
          view = { kind: 'error', message: t('err_rate') }; render(); return;
        }
        if (!res.ok || !res.data) {
          if (isPoll && view.kind === 'pending') { schedulePoll(); return; }
          view = { kind: 'error', message: (res.data && res.data.error) || t('err_server_body') }; render(); return;
        }
        var d = res.data;
        if (!langChosen && (d.language === 'es' || d.language === 'en') && d.language !== lang) {
          lang = d.language;
          applyStatic();
        }
        if (d.status === 'ready') {

          var wasPending = view.kind === 'pending';
          view = { kind: 'ready', data: d };
          render();

          return;
        }
        if (d.status === 'pending_review') {

          schedulePoll();
          render();
          return;
        }
        view = { kind: 'error', message: t('err_server_body') }; render();
      })

        inc.type_label ? h('span', { class: 'chip', text: inc.type_label }) : h('span'),
        stamp(inc.last_verified_at)),
      inc.headline ? h('p', { class: 'incentive-headline', text: inc.headline }) : null,
      inc.value_display ? h('p', { class: 'incentive-value', text: inc.value_display }) : null,
      inc.conditions_text ? h('p', { class: 'small', style: 'margin:0', text: inc.conditions_text }) : null,
      dates.childNodes.length ? dates : null,
      h('div', { class: 'incentive-tags' }, lender));
  }

  function renderConsult(agent) {
    var box = h('div', { class: 'card consult', style: 'margin-top:8px' });
    box.appendChild(h('h3', { text: t('consult_title') }));

    if (consult.sent) {
      var done = h('div', { class: 'callout callout-verified', role: 'status', tabindex: '-1', id: 'consultDone' },
        h('h4', { text: t('consult_done_title') }),
        h('p', { text: t('consult_done_body') }));
      box.appendChild(done);
      return box;
    }

    box.appendChild(h('p', { class: 'muted', text: t('consult_body') }));
    var fe = consult.fieldErrors || {};
    var ta = h('textarea', { id: 'c_times', name: 'preferred_times', rows: '3', 'aria-describedby': 'c_times_hint' + (fe.times ? ' c_times_err' : ''), 'aria-invalid': fe.times ? 'true' : null });
    ta.value = consult.times;
    ta.addEventListener('input', function () { consult.times = ta.value; });

    var channels = [['call', 'ch_call'], ['video', 'ch_video'], ['text', 'ch_text']];
    var fs = h('fieldset', { class: 'plain' + (fe.channel ? ' has-error' : ''), id: 'c_channel', 'aria-describedby': fe.channel ? 'c_channel_err' : null },
      h('legend', { text: t('consult_channel') }));
    var cl = h('div', { class: 'choice-grid' });
    channels.forEach(function (c) {
      var input = h('input', { type: 'radio', name: 'channel', value: c[0] });
      input.checked = consult.channel === c[0];
      input.addEventListener('change', function () { consult.channel = c[0]; });
      cl.appendChild(h('label', { class: 'choice' }, input, h('span', { class: 'choice-text', text: t(c[1]) })));
    });
    fs.appendChild(cl);
    if (fe.channel) fs.appendChild(h('p', { class: 'field-error', id: 'c_channel_err', text: t('consult_err_channel') }));

    var status = h('div', { class: 'status', role: 'alert', 'aria-live': 'assertive', id: 'consultStatus' });
    if (consult.error) status.appendChild(h('div', { class: 'callout callout-critical' }, h('p', { text: consult.error })));

    var btn = h('button', { type: 'submit', class: 'btn btn-primary', text: consult.sending ? t('consult_sending') : t('consult_submit') });
    if (consult.sending) btn.disabled = true;

    var form = h('form', { novalidate: true },
      h('div', { class: 'field' + (fe.times ? ' has-error' : '') },
        h('label', { for: 'c_times', text: t('consult_times') }),
        ta,
        h('p', { class: 'hint', id: 'c_times_hint', text: t('consult_times_hint') }),
        fe.times ? h('p', { class: 'field-error', id: 'c_times_err', text: t('consult_err_times') }) : null),
      fs,
      status,
      h('div', { style: 'margin-top:12px' }, btn));

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (consult.sending) return;
      consult.times = ta.value;
      var errs = {};
      if (!consult.times.trim()) errs.times = true;
      if (!consult.channel) errs.channel = true;
      consult.fieldErrors = errs;
      if (errs.times || errs.channel) {
        consult.error = t('consult_fix');
        render();
        var f = errs.times ? $('c_times') : document.querySelector('#c_channel input');
        if (f) f.focus();
        return;
      }
      consult.error = null;
      consult.sending = true;
      render();
      fetch(BASE + '/api/v1/public/reports/' + encodeURIComponent(token) + '/consult-request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ preferred_times: consult.times.trim(), channel: consult.channel })
      }).then(function (r) {
        return r.text().then(function (txt) {
          var data = null;
          try { data = txt ? JSON.parse(txt) : null; } catch (e2) { data = null; }
          return { status: r.status, ok: r.ok, data: data };
        });
      }).then(function (res) {
        consult.sending = false;
        if (res.ok && res.data && res.data.ok) {
          consult.sent = true;
          render();
          var dn = $('consultDone'); if (dn) dn.focus();
          return;
        }
        consult.error = res.status === 429 ? t('err_rate') : ((res.data && res.data.error) || t('err_generic'));
        render();
        var st = $('consultStatus'); if (st) st.scrollIntoView({ block: 'center' });
      }).catch(function () {
        consult.sending = false;
        consult.error = t('err_network');
        render();
      });
    });

    box.appendChild(form);
    return box;
  }

  // ---------- boot ----------
  $('year').textContent = String(new Date().getFullYear());
  applyStatic();
  render();
  load(false);
})();
</script>
</body>
</html>
