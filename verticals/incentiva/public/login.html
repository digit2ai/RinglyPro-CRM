<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Sign in · BuyersLine agent console</title>
<script>(function(){try{var t=localStorage.getItem('incentiva_theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}})();</script>
<meta name="theme-color" content="#0E1719">
<link rel="icon" href="{{BASE}}/favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{BASE}}/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{{BASE}}/apple-touch-icon.png">
<script src="{{BASE}}/theme.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#F4F7F6;--surface:#FFFFFF;--ink:#13302D;--muted:#587072;--rule:#D5DFDC;
  --accent:#0A6A64;--accent-soft:#DCEDEA;--accent-ink:#FFFFFF;
  --crit:#A1262B;--crit-bg:#FAE3E1;--warn:#8A5A00;--warn-bg:#FAEFD6;
  --f-head:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0E1719;--surface:#15211F;--ink:#E1ECE9;--muted:#94A8A6;--rule:#29393A;
    --accent:#5DBDB2;--accent-soft:#163431;--accent-ink:#0E1719;
    --crit:#F09590;--crit-bg:#3A1A1B;--warn:#E8B75C;--warn-bg:#33270F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1719;--surface:#15211F;--ink:#E1ECE9;--muted:#94A8A6;--rule:#29393A;
  --accent:#5DBDB2;--accent-soft:#163431;--accent-ink:#0E1719;
  --crit:#F09590;--crit-bg:#3A1A1B;--warn:#E8B75C;--warn-bg:#33270F;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-text-size-adjust:100%;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.wrap{width:100%;max-width:400px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:20px;font-family:var(--f-head);font-weight:700;font-size:20px;letter-spacing:-.01em}
.brand svg{width:30px;height:30px;flex:none}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:28px 24px}
h1{font-family:var(--f-head);font-weight:700;font-size:26px;line-height:1.15;letter-spacing:-.015em;margin:0 0 6px}
.lede{color:var(--muted);margin:0 0 22px}
label{display:block;font-weight:600;font-size:15px;margin:0 0 16px}
input{display:block;width:100%;margin-top:6px;min-height:46px;padding:10px 12px;font:16px var(--f-body);color:var(--ink);background:var(--ground);border:1px solid var(--rule);border-radius:9px}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
button{width:100%;min-height:48px;margin-top:6px;border:0;border-radius:9px;background:var(--accent);color:var(--accent-ink);font:600 16px var(--f-body);cursor:pointer}
button:hover{filter:brightness(1.06)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button[disabled]{opacity:.6;cursor:progress}
.err{margin:0 0 16px;padding:10px 12px;border-radius:9px;background:var(--crit-bg);color:var(--crit);font-weight:600;font-size:15px}
.err.warn{background:var(--warn-bg);color:var(--warn)}
.fine{color:var(--muted);font-size:14px;margin:18px 2px 0}
[hidden]{display:none!important}
.wm-accent{color:var(--accent)}
.theme-toggle{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none;border:1px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;padding:0}
.theme-toggle:hover{border-color:var(--accent);color:var(--accent)}
.theme-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.theme-toggle svg{width:20px;height:20px}
.theme-toggle .icon-moon{display:none}
:root[data-theme="light"] .theme-toggle .icon-sun{display:none}
:root[data-theme="light"] .theme-toggle .icon-moon{display:block}
.theme-corner{position:fixed;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right))}
</style>
</head>
<body>
<div class="theme-corner"><button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch to light mode" title="Switch to light mode"><svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>
<main class="wrap">
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false"><rect width="64" height="64" rx="14" fill="#0A6A64"/><path d="M20 13 H44 A9 9 0 0 1 53 22 V35 A9 9 0 0 1 44 44 H29 L18 52 L20 44 A9 9 0 0 1 11 35 V22 A9 9 0 0 1 20 13 Z" fill="#F4F7F6"/><path d="M21 32 L32 22.5 L43 32" fill="none" stroke="#0A6A64" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="36.8" r="3.4" fill="#E7AE5C"/></svg>
    <span class="wordmark">Buyers<span class="wm-accent">Line</span></span>
  </div>
  <div class="card">
    <h1>Agent console</h1>
    <p class="lede">Sign in to verify builder incentives and review buyer reports.</p>
    <form id="loginForm" novalidate>
      <div id="loginError" class="err" role="alert" hidden></div>
      <label for="email">Email
        <input id="email" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" required>
      </label>
      <label for="password">Password
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <button id="submitBtn" type="submit">Sign in</button>
    </form>
  </div>
  <p class="fine">For licensed agents and administrators only. Buyers do not need an account.</p>
</main>
<script>window.BASE='{{BASE}}';</script>
<script>
(function(){
  'use strict';
  var raw = typeof window.BASE === 'string' ? window.BASE : '';
  var BASE = raw.indexOf('{{') === -1 ? raw.replace(/\/+$/, '') : '';
  var form = document.getElementById('loginForm');
  var errBox = document.getElementById('loginError');
  var btn = document.getElementById('submitBtn');

  function showError(msg, tone){
    errBox.textContent = msg;
    errBox.className = 'err' + (tone === 'warn' ? ' warn' : '');
    errBox.hidden = false;
  }

  // Already signed in? Go straight to the console.
  fetch(BASE + '/api/v1/auth/me', { credentials: 'same-origin', headers: { Accept: 'application/json' } })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){ if (d && d.user) location.replace(BASE + '/admin'); })
    .catch(function(){});

  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    errBox.hidden = true;
    var email = form.email.value.trim();
    var password = form.password.value;
    if (!email || !password) { showError('Enter your email and password.'); return; }
    btn.disabled = true;
    btn.textContent = 'Signing in...';
    fetch(BASE + '/api/v1/auth/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify({ email: email, password: password })
    }).then(function(res){
      return res.text().then(function(text){
        var data = null;
        try { data = text ? JSON.parse(text) : null; } catch (_) { data = null; }
        if (res.ok && data && data.ok) { location.href = BASE + '/admin'; return; }
        if (res.status === 503) {
          showError((data && data.error) || 'Agent console is not configured', 'warn');
        } else if (res.status === 401) {
          showError((data && data.error) || 'That email and password do not match an agent account.');
        } else if (res.status === 429) {
          showError((data && data.error) || 'Too many attempts. Wait a few minutes and try again.');
        } else {
          showError((data && data.error) || ('Sign-in failed (HTTP ' + res.status + ').'));
        }
        btn.disabled = false;
        btn.textContent = 'Sign in';
      });
    }).catch(function(){
      showError('Could not reach the server. Check your connection and try again.');
      btn.disabled = false;
      btn.textContent = 'Sign in';
    });
  });
})();
</script>
</body>
</html>
