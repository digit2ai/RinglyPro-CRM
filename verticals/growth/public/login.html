<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digit2AI Growth — Acceso</title>
<style>
  :root{--bg:#0b1020;--card:#141b30;--line:#26314f;--ink:#eef2ff;--mut:#93a0c4;--acc:#6d9bff}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);
    display:grid;place-items:center;min-height:100vh}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px;width:min(92vw,380px)}
  h1{font-size:19px;margin:0 0 4px}
  p{color:var(--mut);margin:0 0 20px;font-size:13px}
  label{display:block;font-size:12px;color:var(--mut);margin:14px 0 6px}
  input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#0d142a;color:var(--ink);font-size:14px}
  button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#06122e;font-weight:600;cursor:pointer;font-size:14px}
  .err{color:#ff8b8b;font-size:13px;margin-top:12px;min-height:16px}
</style></head>
<body>
  <form class="card" onsubmit="return login(event)">
    <h1>Digit2AI Growth</h1>
    <p>AI CMO interno para nuestro propio portafolio. Solo acceso de operador.</p>
    <label>Email</label><input id="email" type="email" autocomplete="username" value="mstagg@digit2ai.com">
    <label>Contrasena</label><input id="pw" type="password" autocomplete="current-password">
    <button type="submit">Entrar</button>
    <div class="err" id="err"></div>
  </form>
<script>
async function login(e){e.preventDefault();
  const r=await fetch('/growth/api/v1/login',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({email:email.value,password:pw.value})});
  if(r.ok){location.href='/growth/';}else{err.textContent='Credenciales invalidas';}
  return false;}
</script>
</body></html>
