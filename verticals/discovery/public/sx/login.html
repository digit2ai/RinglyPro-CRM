<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iniciar sesión — Synthex SAI Discovery</title>
<link rel="icon" type="image/svg+xml" href="/discovery/sx/favicon.svg">
<link rel="stylesheet" href="/discovery/discovery.css">
<link rel="stylesheet" href="/discovery/sx/synthex.css">
<link rel="canonical" href="https://synthexsai.com/discovery">
</head><body>
<div class="nav"><div class="wrap">
  <a class="brand" href="/discovery/"><span class="orb"></span>Synthex SAI <small>Discovery</small></a>
  <nav><a href="/discovery/signup">Crear cuenta</a></nav>
</div></div>
<div class="wrap narrow" style="padding-top:60px">
  <h1 style="font-size:28px">Iniciar sesión</h1>
  <div class="card" style="margin-top:18px">
    <form id="f">
      <label for="email">Correo electrónico</label><input id="email" type="email" required autocomplete="email">
      <label for="password">Contraseña</label><input id="password" type="password" required autocomplete="current-password">
      <div class="msg" id="msg"></div>
      <button class="btn primary" type="submit" id="go" style="width:100%;margin-top:18px">Iniciar sesión</button>
    </form>
  </div>
  <p class="faint" style="margin-top:16px">¿No tienes cuenta? <a href="/discovery/signup">Crea una gratis</a>.</p>
</div>
<script>
const $=id=>document.getElementById(id);
$('f').addEventListener('submit',async e=>{
  e.preventDefault(); const b=$('go'); b.disabled=true; b.textContent='Iniciando sesión…';
  const r=await fetch('/discovery/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});
  const j=await r.json();
  if(r.ok){const n=new URLSearchParams(location.search).get('next');location.href=n||'/discovery/';return;}
  $('msg').className='msg err on'; $('msg').textContent=j.error||'No se pudo iniciar sesión.';
  b.disabled=false; b.textContent='Iniciar sesión';
});
</script>
</body></html>
