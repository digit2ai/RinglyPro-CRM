<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline — Lawn Co-Pilot</title>
<link rel="stylesheet" href="/lawncopilot/styles.css">
<meta name="robots" content="noindex, nofollow">
</head>
<body style="display:grid;place-items:center;min-height:100vh;padding:24px;text-align:center">
  <div style="max-width:380px">
    <img src="/lawncopilot/logo.png" alt="Lawn Co-Pilot" width="180" height="68" style="margin:0 auto 24px">
    <h1 style="font-size:1.4rem">No connection</h1>
    <p class="mut">You are offline. Quotes, schedules and balances need a live connection so we
    never show you a stale number.</p>
    <button class="btn btn--primary" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
