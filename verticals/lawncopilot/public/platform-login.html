<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Platform — Lawn Co-Pilot</title>
<link rel="manifest" href="/lawncopilot/app.webmanifest">
<meta name="theme-color" content="#307f44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="/lawncopilot/styles.css">
<link rel="icon" href="/lawncopilot/mark.png" type="image/png">
<style>
body { display:grid; place-items:center; min-height:100vh; background:
  radial-gradient(900px 420px at 50% -10%, var(--green-100), transparent 62%), var(--bg-alt); padding: var(--space-4); }
.box { background:#fff; border:1px solid var(--line); border-radius:var(--radius-lg); padding:var(--space-6);
  max-width:420px; width:100%; box-shadow:var(--shadow); }
.brand { margin-bottom: var(--space-5); }
.brand img { height: 58px; width: auto; }
.msg { padding:12px 14px; border-radius:var(--radius); font-size:.88rem; margin-bottom:var(--space-4); display:none; }
.msg.err { background:#fef2f2; color:#991b1b; display:block; }
.msg.ok { background:var(--green-50); color:var(--green-900); display:block; }
</style>
<meta name="robots" content="noindex, nofollow">
</head>
<body>
<div class="box">
  <div class="brand"><img src="/lawncopilot/logo.png" alt="Lawn Co-Pilot" width="200" height="76"></div>
  <h2 style="font-size:1.4rem">Platform sign in</h2>
  <p class="small mut">Digit2AI only. Every company on the platform.</p>
  <div class="msg" id="msg"></div>

  <form id="form">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">
    </div>
    <button class="btn btn--primary" type="submit" style="width:100%">Sign in</button>
    <p class="small" style="text-align:center;margin-top:var(--space-4)">
      <a href="#" id="forgotLink" style="color:var(--green-700);font-weight:600">Forgot your password?</a>
    </p>
  </form>

  <!-- Forgot-password request, toggled in place -->
  <form id="forgotForm" style="display:none">
    <p class="small mut" style="margin-bottom:var(--space-4)">Enter your email and we'll send a reset link from info@digit2ai.com. It expires in one hour.</p>
    <div class="field">
      <label for="forgotEmail">Email</label>
      <input id="forgotEmail" type="email" autocomplete="email" required>
    </div>
    <button class="btn btn--primary" type="submit" style="width:100%">Send reset link</button>
    <p class="small" style="text-align:center;margin-top:var(--space-4)">
      <a href="#" id="backToLogin" style="color:var(--green-700);font-weight:600">Back to sign in</a>
    </p>
  </form>

</div>

<script>
var msg = document.getElementById('msg');
function show(text, ok) { msg.textContent = text; msg.className = 'msg ' + (ok ? 'ok' : 'err'); }

var loginForm = document.getElementById('form');
var forgotForm = document.getElementById('forgotForm');
document.getElementById('forgotLink').addEventListener('click', function (e) {
  e.preventDefault(); loginForm.style.display = 'none'; forgotForm.style.display = 'block';
  msg.className = 'msg';
});
document.getElementById('backToLogin').addEventListener('click', function (e) {
  e.preventDefault(); forgotForm.style.display = 'none'; loginForm.style.display = 'block';
  msg.className = 'msg';
});

loginForm.addEventListener('submit', function (e) {
  e.preventDefault();
  fetch('/lawncopilot/api/v1/platform/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
    body: JSON.stringify({
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value
    })
  }).then(function (r) { return r.json(); }).then(function (r) {
    if (r.success) window.location.href = '/lawncopilot/platform';
    else show(r.error || 'Could not sign you in.');
  }).catch(function () { show('Network problem. Try again.'); });
});

forgotForm.addEventListener('submit', function (e) {
  e.preventDefault();
  var btn = forgotForm.querySelector('button');
  btn.disabled = true; btn.textContent = 'Sending...';
  fetch('/lawncopilot/api/v1/platform/forgot-password', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: document.getElementById('forgotEmail').value.trim() })
  }).then(function (r) { return r.json(); }).then(function (r) {
    btn.disabled = false; btn.textContent = 'Send reset link';
    show(r.message || 'If that email is on file, a reset link is on its way.', true);
    if (r.dev_reset_link) { var a = document.createElement('a'); a.href = r.dev_reset_link; a.textContent = 'Open reset link'; a.style.display='block'; a.style.marginTop='8px'; msg.appendChild(document.createElement('br')); msg.appendChild(a); }
  }).catch(function () {
    btn.disabled = false; btn.textContent = 'Send reset link';
    show('Network problem. Try again.');
  });
});

if (new URLSearchParams(location.search).get('expired')) show('That sign-in link expired. Request a new one.');
if (new URLSearchParams(location.search).get('reset')) show('Password reset. Sign in with your new password.', true);
</script>
<script src="/lawncopilot/pwa.js" defer></script>
</body>
</html>
