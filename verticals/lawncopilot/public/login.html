<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in — Lawn Co-Pilot</title>
<link rel="stylesheet" href="/lawncopilot/styles.css">
<link rel="icon" href="/lawncopilot/mark.png" type="image/png">
<style>
body { display:grid; place-items:center; min-height:100vh; background:
  radial-gradient(900px 420px at 50% -10%, var(--green-100), transparent 62%), var(--bg-alt); padding: var(--space-4); }
.box { background:#fff; border:1px solid var(--line); border-radius:var(--radius-lg); padding:var(--space-6);
  max-width:420px; width:100%; box-shadow:var(--shadow); }
.brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:1.2rem; margin-bottom:var(--space-5); }
.msg { padding:12px 14px; border-radius:var(--radius); font-size:.88rem; margin-bottom:var(--space-4); display:none; }
.msg.err { background:#fef2f2; color:#991b1b; display:block; }
.msg.ok { background:var(--green-50); color:var(--green-900); display:block; }
</style>
</head>
<body>
<div class="box">
  <div class="brand"><img src="/lawncopilot/logo.png" alt="Lawn Co-Pilot" width="200" height="76"></div>
  <h2 style="font-size:1.4rem">Sign in to your account</h2>
  <p class="small mut">See your schedule, property, service history, and billing.</p>
  <div class="msg" id="msg"></div>

  <form id="form">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">
    </div>
    <button class="btn btn--primary" type="submit" style="width:100%">Sign in</button>
  </form>

  <div style="text-align:center;margin:var(--space-4) 0;color:var(--ink-400);font-size:.85rem">or</div>
  <button class="btn btn--ghost" id="magic" style="width:100%">Email me a sign-in link</button>

  <p class="small center mut" style="margin-top:var(--space-5)">
    No account yet? <a href="/lawncopilot/">Get a quote</a> and one is created for you.
  </p>
</div>

<script>
var msg = document.getElementById('msg');
function show(text, ok) { msg.textContent = text; msg.className = 'msg ' + (ok ? 'ok' : 'err'); }

document.getElementById('form').addEventListener('submit', function (e) {
  e.preventDefault();
  fetch('/lawncopilot/api/v1/auth/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
    body: JSON.stringify({
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value
    })
  }).then(function (r) { return r.json(); }).then(function (r) {
    if (r.success) window.location.href = '/lawncopilot/portal/';
    else show(r.error || 'Could not sign you in.');
  }).catch(function () { show('Network problem. Try again.'); });
});

document.getElementById('magic').addEventListener('click', function () {
  var email = document.getElementById('email').value.trim();
  if (!email) { show('Enter your email first.'); return; }
  fetch('/lawncopilot/api/v1/auth/magic-link', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email })
  }).then(function (r) { return r.json(); }).then(function (r) {
    show(r.message || 'Check your email.', true);
  });
});

if (new URLSearchParams(location.search).get('expired')) show('That sign-in link expired. Request a new one.');
</script>
</body>
</html>
