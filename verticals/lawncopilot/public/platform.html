<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Platform — Lawn Co-Pilot</title>
<link rel="icon" href="/lawncopilot/mark.png" type="image/png">
<link rel="stylesheet" href="/lawncopilot/admin/app.css">
<style>
body { padding-bottom: var(--space-8); }
.appmain { max-width: 1240px; }
.kpi b { font-size: 1.6rem; }
td.slug a { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82rem; }
</style>
<meta name="robots" content="noindex, nofollow">
</head>
<body>
<header class="apphead">
  <img class="apphead__logo" src="/lawncopilot/logo.png" alt="Lawn Co-Pilot" width="112" height="43">
  <h1>Platform</h1>
  <div class="who" id="who"></div>
  <button class="btn btn--ghost btn--sm" id="logout">Sign out</button>
</header>
<main class="appmain" id="app"><div class="empty">Loading...</div></main>

<script>
var API = '/lawncopilot/api/v1/platform';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(c){return '$'+(Number(c||0)/100).toFixed(2);}
function num(v){return Number(v||0).toLocaleString('en-US');}
function date(d){ if(!d) return ''; var x=new Date(d); return isNaN(x)?'':x.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'}); }

function req(m,p,b){return fetch(API+p,{method:m,headers:b?{'Content-Type':'application/json'}:{},credentials:'same-origin',body:b?JSON.stringify(b):undefined})
  .then(function(r){ if(r.status===401){location.href='/lawncopilot/platform/login';throw new Error('unauth');} return r.json(); });}

req('GET','/me').then(function(r){ if(r.success) document.getElementById('who').textContent = r.user.email; });
document.getElementById('logout').addEventListener('click',function(){
  req('POST','/logout').then(function(){ location.href='/lawncopilot/platform/login'; });
});

function render(){
  Promise.all([req('GET','/overview?days=30'), req('GET','/ai-spend?days=30')]).then(function(res){
    var d=res[0], spend=res[1], t=d.totals;
    var html='';

    html+='<div class="kpis">'+
      '<div class="kpi"><b>'+num(t.tenants)+'</b><span>Companies</span></div>'+
      '<div class="kpi"><b>'+num(t.live)+'</b><span>Live</span></div>'+
      '<div class="kpi"><b>'+num(t.trialing)+'</b><span>Trialing</span></div>'+
      '<div class="kpi"><b>'+num(t.new_this_period)+'</b><span>New, 30d</span></div>'+
      '<div class="kpi"><b>'+num(t.customers)+'</b><span>Homeowners</span></div>'+
      '<div class="kpi"><b>'+num(t.jobs)+'</b><span>Jobs, 30d</span></div>'+
      '<div class="kpi"><b>'+money(t.collected_cents)+'</b><span>Collected, 30d</span></div>'+
      '<div class="kpi"><b>'+money(t.ai_cost_cents)+'</b><span>AI spend, 30d</span></div>'+
      '</div>';

    html+='<div class="tile"><h2>Companies</h2><div class="scroll-x"><table><thead><tr>'+
      '<th>Company</th><th>Address</th><th>Status</th><th>Plan</th><th>Setup</th>'+
      '<th class="num">Leads</th><th class="num">Customers</th><th class="num">Jobs</th>'+
      '<th class="num">Collected</th><th class="num">AI</th><th></th></tr></thead><tbody>';
    if(!d.tenants.length) html+='<tr><td colspan="11"><div class="empty">No companies yet.</div></td></tr>';
    d.tenants.forEach(function(x){
      var setup=[];
      if(!x.payments_connected) setup.push('no payments');
      if(!x.phone_connected) setup.push('no phone');
      html+='<tr>'+
        '<td><b>'+esc(x.name)+'</b></td>'+
        '<td class="slug"><a href="/lawncopilot/'+esc(x.slug)+'" target="_blank">/'+esc(x.slug)+'</a></td>'+
        '<td><span class="pill'+(x.status==='active'?'':' pill--warn')+'">'+esc(x.status)+'</span></td>'+
        '<td>'+esc(x.plan||'')+'</td>'+
        '<td class="small mut">'+(setup.length?esc(setup.join(', ')):'complete')+'</td>'+
        '<td class="num">'+num(x.leads)+'</td>'+
        '<td class="num">'+num(x.customers)+'</td>'+
        '<td class="num">'+num(x.jobs)+'</td>'+
        '<td class="num">'+money(x.collected_cents)+'</td>'+
        '<td class="num">'+num(x.ai_actions)+(x.ai_failures?' <span class="pill pill--warn">'+x.ai_failures+' failed</span>':'')+'</td>'+
        '<td><button class="btn btn--ghost btn--sm" data-imp="'+x.id+'" data-name="'+esc(x.name)+'">Support</button></td>'+
        '</tr>';
    });
    html+='</tbody></table></div>'+
      '<p class="tiny mut" style="margin-top:10px">Counts and totals only. Customer names, emails and addresses are not shown here — use Support access, which is logged.</p></div>';

    html+='<div class="tile"><h2>AI spend by employee, 30 days</h2><div class="scroll-x"><table><thead><tr><th>Employee</th><th class="num">Actions</th><th class="num">Cost</th></tr></thead><tbody>';
    if(!spend.by_employee.length) html+='<tr><td colspan="3"><div class="empty">No AI activity yet.</div></td></tr>';
    spend.by_employee.sort(function(a,b){return b.calls-a.calls;}).forEach(function(e){
      html+='<tr><td>'+esc(e.employee)+'</td><td class="num">'+num(e.calls)+'</td><td class="num">'+money(e.cost_cents)+'</td></tr>';
    });
    html+='</tbody></table></div></div>';

    html+='<div class="tile" id="attribution"><h2>Where trials come from</h2><div class="empty">Loading attribution...</div></div>';

    document.getElementById('app').innerHTML=html;
    renderAttribution();

    document.querySelectorAll('[data-imp]').forEach(function(b){
      b.addEventListener('click',function(){
        var reason=prompt('Support access to '+b.dataset.name+' is logged against your account.\n\nWhy do you need it?');
        if(!reason||reason.trim().length<8){ if(reason!==null) alert('A reason of at least 8 characters is required.'); return; }
        req('POST','/tenants/'+b.dataset.imp+'/impersonate',{reason:reason.trim()}).then(function(r){
          if(!r.success){ alert(r.error||'Could not start support access.'); return; }
          window.open(r.admin_url,'_blank');
        });
      });
    });
  });
}

function renderAttribution(){
  req('GET','/attribution?days=90').then(function(a){
    var el=document.getElementById('attribution'); if(!el) return;
    if(!a.success){ el.innerHTML='<h2>Where trials come from</h2><div class="empty">Could not load attribution.</div>'; return; }

    function miniTable(title, rows){
      var h='<div style="flex:1;min-width:220px"><div class="tile__label" style="margin-bottom:8px">'+esc(title)+'</div>';
      if(!rows.length){ return h+'<div class="empty">None yet.</div></div>'; }
      h+='<table><tbody>';
      rows.slice(0,8).forEach(function(r){ h+='<tr><td>'+esc(r.key)+'</td><td class="num">'+num(r.trials)+'</td></tr>'; });
      return h+'</tbody></table></div>';
    }

    var html='<h2>Where trials come from</h2>'+
      '<p class="tiny mut" style="margin:-6px 0 14px">First-touch, last 90 days &middot; '+num(a.total_trials)+' trials</p>'+
      '<div style="display:flex;gap:24px;flex-wrap:wrap">'+
        miniTable('By channel', a.by_channel)+
        miniTable('By campaign', a.by_campaign.filter(function(r){return r.key!=='(none)';}))+
        miniTable('By landing page', a.by_landing.filter(function(r){return r.key!=='(none)';}))+
      '</div>';

    html+='<div style="margin-top:18px"><div class="tile__label" style="margin-bottom:8px">Recent trials</div><div class="scroll-x"><table><thead><tr>'+
      '<th>Company</th><th>Channel</th><th>Campaign</th><th>Landing</th><th>Plan</th><th>Started</th></tr></thead><tbody>';
    if(!a.recent.length) html+='<tr><td colspan="6"><div class="empty">No trials yet.</div></td></tr>';
    a.recent.forEach(function(t){
      html+='<tr><td><b>'+esc(t.company)+'</b></td><td>'+esc(t.channel)+'</td>'+
        '<td class="small mut">'+esc(t.campaign||'—')+'</td>'+
        '<td class="small mut">'+esc(t.landing||'—')+'</td>'+
        '<td>'+esc(t.plan||'')+'</td><td class="small mut">'+date(t.at)+'</td></tr>';
    });
    html+='</tbody></table></div></div>';

    document.getElementById('attribution').innerHTML=html;
  }).catch(function(){});
}

render();
</script>
<script src="/lawncopilot/pwa.js" defer></script>
</body>
</html>
