<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dispatch — Lawn Co-Pilot admin</title>
<link rel="icon" href="/lawncopilot/mark.png" type="image/png">
<link rel="stylesheet" href="/lawncopilot/admin/app.css">
</head>
<body>
<header class="apphead">
  <img class="apphead__logo" src="/lawncopilot/logo.png" alt="Lawn Co-Pilot" width="112" height="43"><h1>Dispatch</h1><div class="who" id="who"></div></header>
<main class="appmain" id="app"><div class="empty">Loading...</div></main>
<div id="tabs"></div>
<script src="/lawncopilot/admin/data.js"></script>
<script>
A.shell('despacho');

var from = new Date().toISOString().slice(0, 10);
var to = new Date(Date.now() + 13 * 86400000).toISOString().slice(0, 10);

function render() {
  A.get('/schedule?from=' + from + '&to=' + to).then(function (d) {
    var app = document.getElementById('app');
    var byDate = {};
    (d.appointments || []).forEach(function (a) {
      (byDate[a.service_date] = byDate[a.service_date] || []).push(a);
    });

    var html = '<div class="toolbar">' +
      '<label class="small" style="font-weight:700">From</label><input type="date" id="from" value="' + from + '">' +
      '<label class="small" style="font-weight:700">To</label><input type="date" id="to" value="' + to + '">' +
      '<button class="btn btn--ghost btn--sm" id="go">Load</button>' +
      '<span class="mut small" style="margin-left:auto">' + A.num((d.appointments || []).length) + ' visits</span></div>';

    var dates = Object.keys(byDate).sort();
    if (!dates.length) html += A.empty('Nothing scheduled in this range.');

    dates.forEach(function (day) {
      var list = byDate[day];
      html += '<div class="tile"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
        '<h2 style="flex:1;margin:0">' + A.esc(A.date(day)) + ' <span class="mut small">(' + list.length + ')</span></h2>' +
        '<button class="btn btn--ghost btn--sm" data-seq="' + day + '">Sequence</button>' +
        '<button class="btn btn--ghost btn--sm" data-hold="' + day + '">Weather hold</button></div>' +
        '<div class="scroll-x" style="margin-top:10px"><table><thead><tr>' +
        '<th>#</th><th>Customer</th><th>Address</th><th>Window</th><th>Crew</th><th>Price</th><th>Status</th><th></th>' +
        '</tr></thead><tbody>';
      list.forEach(function (a) {
        html += '<tr><td>' + (a.route_order || '') + '</td>' +
          '<td>' + A.esc(a.customer_name || '') + '</td>' +
          '<td class="small">' + A.esc(a.address || '') + '</td>' +
          '<td>' + A.esc(a.window_start) + '-' + A.esc(a.window_end) + '</td>' +
          '<td><select data-crew="' + a.id + '"><option value="">Unassigned</option>' +
            (d.crews || []).map(function (c) {
              return '<option value="' + c.id + '"' + (c.id === a.crew_id ? ' selected' : '') + '>' + A.esc(c.name) + '</option>';
            }).join('') + '</select></td>' +
          '<td class="num">' + A.esc(a.price_display || '&mdash;') + '</td>' +
          '<td><span class="pill' + (a.status === 'completed' ? ' pill--muted' : '') + '">' + A.esc(a.status.replace('_', ' ')) + '</span></td>' +
          '<td>' + (a.status !== 'completed'
            ? '<button class="btn btn--ghost btn--sm" data-otw="' + a.id + '">On the way</button> ' +
              '<button class="btn btn--ghost btn--sm" data-done="' + a.id + '">Done</button>' : '') + '</td></tr>';
      });
      html += '</tbody></table></div></div>';
    });

    app.innerHTML = html;

    document.getElementById('go').addEventListener('click', function () {
      from = document.getElementById('from').value;
      to = document.getElementById('to').value;
      render();
    });
    document.querySelectorAll('[data-crew]').forEach(function (s) {
      s.addEventListener('change', function () {
        if (!s.value) return;
        A.post('/schedule/' + s.dataset.crew + '/assign-crew', { crew_id: Number(s.value) }).then(function (r) {
          if (!r.success) alert(r.error || 'Could not assign.');
        });
      });
    });
    document.querySelectorAll('[data-seq]').forEach(function (b) {
      b.addEventListener('click', function () {
        A.post('/schedule/sequence', { service_date: b.dataset.seq }).then(function (r) {
          alert(r.success ? ('Sequenced ' + r.stops + ' stops.') : (r.error || 'Failed.'));
          render();
        });
      });
    });
    document.querySelectorAll('[data-hold]').forEach(function (b) {
      b.addEventListener('click', function () {
        var reason = prompt('Weather hold reason:');
        if (!reason) return;
        A.post('/schedule/weather-hold', { service_date: b.dataset.hold, reason: reason }).then(function (r) {
          alert(r.success ? ('Held ' + r.held + ', notified ' + r.notified + '.') : (r.error || 'Failed.'));
          render();
        });
      });
    });
    document.querySelectorAll('[data-otw]').forEach(function (b) {
      b.addEventListener('click', function () {
        A.post('/schedule/' + b.dataset.otw + '/status', { status: 'en_route' }).then(render);
      });
    });
    document.querySelectorAll('[data-done]').forEach(function (b) {
      b.addEventListener('click', function () {
        var notes = prompt('Crew notes (optional):') || '';
        A.post('/schedule/' + b.dataset.done + '/status', { status: 'completed', technician_notes: notes }).then(function (r) {
          alert(r.success ? ('Complete' + (r.invoice ? '. Invoice ' + r.invoice.number + ' issued.' : '.')) : (r.error || 'Failed.'));
          render();
        });
      });
    });
  });
}
render();
</script>
</body>
</html>
