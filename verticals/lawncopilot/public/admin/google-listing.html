<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Get on Google — Lawn Co-Pilot</title>
<meta name="theme-color" content="#307f44">
<link rel="icon" href="/lawncopilot/mark.png" type="image/png">
<link rel="stylesheet" href="/lawncopilot/styles.css">
<link rel="stylesheet" href="/lawncopilot/admin/app.css">
<style>
  .gl-wrap { max-width: 780px; margin: 0 auto; padding: var(--space-4) var(--space-4) 96px; }
  .gl-head h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .gl-head p { color: var(--text-mut); margin: 0 0 var(--space-5); }
  .note { background: var(--green-50); border: 1px solid var(--green-200); border-radius: var(--radius);
    padding: 14px 16px; font-size: .88rem; color: var(--green-900); margin-bottom: var(--space-5); }
  .note b { display: block; margin-bottom: 3px; }
  .cta-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: var(--space-6); }
  .steps { list-style: none; padding: 0; margin: 0 0 var(--space-6); counter-reset: s; }
  .steps li { position: relative; padding: 0 0 var(--space-4) 44px; }
  .steps li::before { counter-increment: s; content: counter(s); position: absolute; left: 0; top: 0;
    width: 30px; height: 30px; border-radius: 50%; background: var(--green-600); color: #fff;
    display: grid; place-items: center; font-weight: 800; font-size: .85rem; }
  .steps li:not(:last-child)::after { content: ""; position: absolute; left: 15px; top: 32px; bottom: 4px;
    width: 2px; background: var(--line); }
  .steps b { display: block; font-size: .98rem; }
  .steps span { font-size: .86rem; color: var(--text-mut); }
  .steps a.mini { display: inline-block; margin-top: 6px; font-size: .82rem; font-weight: 700; color: var(--green-700); }
  .fields { display: flex; flex-direction: column; gap: 10px; margin-bottom: var(--space-6); }
  .fld { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; background: #fff; }
  .fld__top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .fld__label { font-size: .74rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-400); }
  .fld__copy { font: inherit; font-size: .76rem; font-weight: 700; border: 1px solid var(--line); background: var(--ink-50);
    color: var(--ink-700); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .fld__copy.copied { background: var(--green-100); color: var(--green-900); border-color: var(--green-400); }
  .fld__val { font-size: .95rem; margin: 6px 0 2px; word-break: break-word; }
  .fld__hint { font-size: .78rem; color: var(--text-mut); }
  .fld--key { border-color: var(--green-400); background: var(--green-50); }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chips span { font-size: .82rem; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; }
  .hours { width: 100%; border-collapse: collapse; font-size: .88rem; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .hours td { padding: 8px 14px; border-bottom: 1px solid var(--line); }
  .hours tr:last-child td { border-bottom: 0; }
  .hours td:last-child { text-align: right; color: var(--text-mut); }
  h2.sec { font-size: 1.05rem; margin: var(--space-6) 0 var(--space-3); }
  .autobox { border: 1px dashed var(--line); border-radius: var(--radius); padding: 14px 16px; font-size: .84rem; color: var(--text-mut); }
  .autobox b { color: var(--ink-800); }
</style>
</head>
<body>
<div class="gl-wrap">
  <div id="tabs"></div>

  <div class="gl-head">
    <a href="#" onclick="history.back();return false" style="font-size:.85rem;color:var(--green-700);font-weight:700">&#8249; Back</a>
    <h1>Get your company on Google</h1>
    <p>Your Google listing is your front door. Everything below is filled in from your account — copy it straight into Google.</p>
  </div>

  <div id="content"><div class="empty">Loading...</div></div>
</div>

<script src="/lawncopilot/admin/data.js"></script>
<script>
(function () {
  if (window.A && A.shell) A.shell('inicio');
  var content = document.getElementById('content');

  function copyBtn(text) {
    return '<button class="fld__copy" data-copy="' + A.esc(text) + '">Copy</button>';
  }

  A.get('/google-listing').then(function (r) {
    if (!r.success) { content.innerHTML = A.empty('Could not load your listing details.'); return; }
    var L = r.listing;

    var steps = '<ol class="steps">' + L.steps.map(function (s) {
      return '<li><b>' + A.esc(s.title) + '</b><span>' + A.esc(s.detail) + '</span>' +
        (s.action ? '<a class="mini" href="' + A.esc(s.action) + '" target="_blank" rel="noopener">Open Google &#8599;</a>' : '') +
        '</li>';
    }).join('') + '</ol>';

    var fields = '<div class="fields">' + L.fields.map(function (f) {
      var key = (f.key === 'website' || f.key === 'booking');
      return '<div class="fld' + (key ? ' fld--key' : '') + '">' +
        '<div class="fld__top"><span class="fld__label">' + A.esc(f.label) + '</span>' + copyBtn(f.value) + '</div>' +
        '<div class="fld__val">' + A.esc(f.value) + '</div>' +
        '<div class="fld__hint">' + A.esc(f.hint) + '</div></div>';
    }).join('') + '</div>';

    var areas = '<div class="chips">' + L.service_areas.map(function (a) {
      return '<span>' + A.esc(a) + '</span>';
    }).join('') + '</div>';

    var hours = '<table class="hours"><tbody>' + L.hours.map(function (h) {
      return '<tr><td>' + A.esc(h.day) + '</td><td>' + A.esc(h.hours) + '</td></tr>';
    }).join('') + '</tbody></table>';

    content.innerHTML =
      '<div class="note"><b>Can you do it all for me automatically?</b>' +
        'Not fully — Google requires you to sign in yourself and verify the business (by postcard, phone or video), and never shares passwords with other apps. ' +
        'So we do the next best thing: everything is pre-filled and one-tap copyable, and we deep-link you straight into Google.</div>' +

      '<div class="cta-row">' +
        '<a class="btn btn--primary" href="' + A.esc(L.create_url) + '" target="_blank" rel="noopener">Start my Google listing &#8599;</a>' +
        '<a class="btn btn--ghost" href="' + A.esc(L.manage_url) + '" target="_blank" rel="noopener">I already have one</a>' +
      '</div>' +

      '<h2 class="sec">Follow these steps</h2>' + steps +
      '<h2 class="sec">Copy these into Google</h2>' + fields +
      '<h2 class="sec">Service areas (you have no storefront address)</h2>' + areas +
      '<h2 class="sec">Hours</h2>' + hours +
      '<h2 class="sec">About full automation</h2>' +
      '<div class="autobox"><b>' + A.esc(L.automation.what_we_do) + '</b><br><br>' +
        A.esc(L.automation.future_oauth) + '</div>';

    // Copy handlers
    content.addEventListener('click', function (e) {
      var b = e.target.closest('[data-copy]');
      if (!b) return;
      var txt = b.getAttribute('data-copy');
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject())
        .then(function () { b.textContent = 'Copied'; b.classList.add('copied'); setTimeout(function () { b.textContent = 'Copy'; b.classList.remove('copied'); }, 1600); })
        .catch(function () {
          var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); b.textContent = 'Copied'; b.classList.add('copied'); setTimeout(function () { b.textContent = 'Copy'; b.classList.remove('copied'); }, 1600); } catch (x) {}
          document.body.removeChild(ta);
        });
    });
  }).catch(function () { content.innerHTML = A.empty('Could not load your listing details.'); });
})();
</script>
</body>
</html>
