<!--
  Subscribers console app icon.

  Deliberately NOT the JobUp mark. Both apps can sit on the same home screen,
  and two identical icons is how an operator opens the subscriber dashboard when
  they meant to check the billing register. Same brand geometry, inverted: a
  dark tile with the gradient glyph, plus a roster motif so it reads as "people"
  rather than "the product".

  Full-bleed square, glyph inside the maskable safe zone.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="JobUp Subscribers">
  <defs>
    <linearGradient id="ab" gradientUnits="userSpaceOnUse" x1="-30" y1="-10" x2="470" y2="480">
      <stop offset="0" stop-color="#4c6ef5"/>
      <stop offset="0.5" stop-color="#e64980"/>
      <stop offset="1" stop-color="#ff922b"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#0d1018"/>
  <rect width="512" height="512" fill="url(#ab)" opacity="0.10"/>

  <!-- roster: three subscriber rows, the newest one lit -->
  <g fill="none" stroke="url(#ab)" stroke-width="30" stroke-linecap="round">
    <path d="M150 196 H362" opacity="0.95"/>
    <path d="M150 268 H362" opacity="0.55"/>
    <path d="M150 340 H300" opacity="0.32"/>
  </g>
  <circle cx="128" cy="196" r="17" fill="url(#ab)"/>
  <circle cx="128" cy="268" r="17" fill="url(#ab)" opacity="0.55"/>
  <circle cx="128" cy="340" r="17" fill="url(#ab)" opacity="0.32"/>
</svg>
