<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>JobUp — Set a new password</title>
<link rel="icon" href="{{BASE}}/favicon.svg?v={{V}}">
<style>
  :root{--bg:#07080c;--bg2:#0b0d13;--card:#11141c;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.15);
    --ink:#eef2f8;--mut:#9aa3b4;--faint:#6b7385;--cyan:#22d3ee;--cyan-bd:rgba(34,211,238,.32)}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{min-height:100vh;background:radial-gradient(120% 90% at 10% 2%,rgba(34,211,238,.10),transparent 55%),radial-gradient(120% 90% at 92% 6%,rgba(124,92,255,.12),transparent 55%),var(--bg);
    color:var(--ink);font:15.5px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:24px}
  .box{width:100%;max-width:420px}
  .brand{display:flex;justify-content:center;margin-bottom:20px}
  .brand img{width:56px;height:56px;border-radius:14px;display:block}
  h1{font-weight:800;font-size:23px;text-align:center;margin:0 0 6px;letter-spacing:-.02em}
  .lead{text-align:center;color:var(--mut);font-size:14px;margin:0 0 22px;line-height:1.5}
  label{display:block;font-weight:700;font-size:14px;margin:16px 0 7px}
  input{width:100%;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:14px 15px;color:var(--ink);font:inherit}
  input:focus{outline:2px solid var(--cyan);border-color:transparent}
  .btn{width:100%;margin-top:22px;background:var(--cyan);color:#04222a;border:none;border-radius:999px;padding:14px;font-weight:800;font-size:16px;cursor:pointer}
  .btn:disabled{opacity:.55;cursor:default}
  .msg{margin-top:16px;padding:12px 14px;border-radius:12px;font-size:14px;display:none;line-height:1.5}
  .msg.err{display:block;background:#2a1414;color:#ff9d9d;border:1px solid #52201f}
  .msg.ok{display:block;background:#0e2a24;color:#8fe3cf;border:1px solid #1f5145}
  .msg a{color:var(--cyan);font-weight:700}
  .foot{text-align:center;margin-top:22px;color:var(--mut);font-size:14px}
  .foot a{color:var(--cyan);font-weight:700;text-decoration:none}
</style>
</head>
<body>
  <div class="box">
    <div class="brand"><img src="{{BASE}}/favicon.svg?v={{V}}" alt="JobUp"></div>
    <h1>Set a new password</h1>
    <p class="lead">Create a new password for your JobUp account.</p>
    <div id="msg" class="msg"></div>
    <form id="f">
      <label for="pw">New password</label>
      <input id="pw" type="password" autocomplete="new-password" required placeholder="At least 10 characters" autofocus>
      <label for="pw2">Confirm password</label>
      <input id="pw2" type="password" autocomplete="new-password" required placeholder="Repeat your password">
      <button class="btn" id="go" type="submit">Save password</button>
    </form>
    <div class="foot"><a href="{{BASE}}/app">Back to sign in</a></div>
  </div>
<script>
(function(){
  var BASE='{{BASE}}';
  var API=BASE+'/api/v1/auth/reset';
  var token=''; try{ token=new URLSearchParams(location.search).get('t')||new URLSearchParams(location.search).get('token')||''; }catch(e){}
  var f=document.getElementById('f'), msg=document.getElementById('msg'), go=document.getElementById('go');
  function show(html,ok){ msg.innerHTML=html; msg.className='msg '+(ok?'ok':'err'); }
  if(!token){ show('This reset link is missing its token. Request a new one from the sign-in page.',false); go.disabled=true; }
  f.addEventListener('submit',function(e){
    e.preventDefault();
    var pw=document.getElementById('pw').value, pw2=document.getElementById('pw2').value;
    if(pw.length<10){ show('Password must be at least 10 characters.',false); return; }
    if(pw!==pw2){ show('The two passwords do not match.',false); return; }
    go.disabled=true; go.textContent='Saving…';
    fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',
      body:JSON.stringify({token:token,password:pw})})
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
      .then(function(res){
        if(!res.ok){
          var e=res.j.error||(res.j.errors&&res.j.errors.join(', '))||'Could not update your password.';
          show(e+' The link may have expired or already been used.',false);
          go.disabled=false; go.textContent='Save password'; return;
        }
        show('Password changed. Taking you to your dashboard…',true);
        setTimeout(function(){ location.href=BASE+'/app'; },1500);
      })
      .catch(function(){ show('Connection error. Please try again.',false); go.disabled=false; go.textContent='Save password'; });
  });
})();
</script>
</body>
</html>
