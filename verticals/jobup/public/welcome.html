<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07080c">
<link rel="manifest" href="/jobup/manifest.webmanifest">
<link rel="apple-touch-icon" href="/jobup/apple-touch-icon.png">
<title>Welcome to JobUp</title><style>
:root{--bg:#07080c;--card:#11141c;--card2:#161a24;--line:rgba(255,255,255,.07);
--line2:rgba(255,255,255,.15);--ink:#eef2f8;--mut:#9aa3b4;--faint:#6b7385;
--cyan:#22d3ee;--green:#3ad07f;--red:#f87171;--warn:#e6b45a;
--grad:linear-gradient(120deg,#22d3ee 0%,#6366f1 55%,#8b5cf6 100%);
--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);min-height:100%}
body{color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
letter-spacing:-.011em;-webkit-font-smoothing:antialiased;position:relative;
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:480px;z-index:0;pointer-events:none;
background:radial-gradient(56% 40% at 22% 0%,rgba(34,211,238,.14),transparent 70%),
radial-gradient(50% 38% at 82% 6%,rgba(139,92,246,.14),transparent 72%);filter:blur(26px)}
.wrap{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:44px 20px 60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:790;letter-spacing:-.025em;margin-bottom:30px}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--grad);box-shadow:0 0 12px rgba(34,211,238,.6)}
h1{font-size:clamp(26px,6vw,34px);font-weight:830;letter-spacing:-.035em;margin:0 0 8px;line-height:1.15}
.lede{color:var(--mut);font-size:15.5px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:14px}
.site{background:var(--card2);border:1px solid rgba(34,211,238,.3);border-radius:14px;padding:16px;
margin:16px 0;text-align:center}
.site a{color:var(--cyan);font-family:var(--mono);font-size:16px;word-break:break-all;text-decoration:none;font-weight:600}
.steps{list-style:none;padding:0;margin:14px 0 0}
.steps li{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.steps li:last-child{border-bottom:0}
.steps .ic{width:20px;height:20px;border-radius:50%;flex:0 0 20px;display:flex;align-items:center;
justify-content:center;font-size:12px;font-weight:800;margin-top:1px}
.ic.ok{background:rgba(58,208,127,.16);color:var(--green)}
.ic.no{background:rgba(248,113,113,.16);color:var(--red)}
label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;
text-transform:uppercase;color:var(--faint);margin:18px 0 6px}
input{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:12px;
padding:14px;color:var(--ink);font:inherit;font-size:16px;outline:none}
input:focus{border-color:var(--cyan)}
.btn{border:0;background:var(--grad);color:#06121a;border-radius:999px;padding:15px 24px;
font:inherit;font-size:16px;font-weight:750;cursor:pointer;width:100%;margin-top:22px;
min-height:52px;transition:transform .14s ease}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.45;transform:none;cursor:default}
.note{color:var(--faint);font-size:13px;font-family:var(--mono);line-height:1.65;margin-top:14px}
.err{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.35);color:#ffb4b4;
border-radius:12px;padding:12px 15px;font-size:14px;margin-top:14px;display:none}
.err.show{display:block}
.testbar{background:rgba(230,180,90,.12);border:1px solid rgba(230,180,90,.4);color:#f5d79c;
border-radius:12px;padding:11px 15px;font-size:13.5px;margin-bottom:18px;display:none}
.testbar.show{display:block}
.rules{color:var(--faint);font-size:13px;margin-top:8px}
</style></head><body>
<div class="wrap">
  <div class="brand"><span class="dot"></span>JobUp</div>
  <div class="testbar" id="testbar"></div>
  <h1 id="h">Setting up your ecosystem</h1>
  <div class="lede" id="lede">One moment.</div>

  <div class="card" id="prov">
    <div id="provbody"><div class="note">Checking your account...</div></div>
  </div>

  <div class="card" id="pw" style="display:none">
    <strong>Choose a password</strong>
    <div class="lede" style="margin:6px 0 0;font-size:14.5px">This is how you sign in to your dashboard.</div>
    <label for="p1">Password</label>
    <input id="p1" type="password" autocomplete="new-password" inputmode="text">
    <div class="rules">At least 12 characters.</div>
    <label for="p2">Confirm password</label>
    <input id="p2" type="password" autocomplete="new-password">
    <div class="err" id="e"></div>
    <button class="btn" id="go">Save and open my dashboard</button>
  </div>
</div>
<script>
var API='/jobup',Q=new URLSearchParams(location.search),SID=Q.get('s')||'';
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

fetch(API+'/api/v1/billing/status').then(function(r){return r.json();}).then(function(j){
  if(j.free_activation){ $('testbar').className='testbar show';
    $('testbar').textContent='TEST MODE — payment is switched off on this deployment. No card was charged.'; }
});

fetch(API+'/api/v1/intake/welcome?s='+encodeURIComponent(SID))
 .then(function(r){return r.json();}).then(function(j){
  if(j.error){ $('h').textContent='We could not find that account';
    $('provbody').innerHTML='<div class="note">'+esc(j.error)+'</div>'; return; }

  $('h').textContent='Your ecosystem is live';
  $('lede').textContent=j.name?('Welcome, '+j.name+'.'):'Welcome.';

  var html='';
  if(j.url) html+='<div class="site"><a href="'+esc(j.url)+'" target="_blank" rel="noopener">'+esc(j.url)+'</a></div>';
  html+='<ul class="steps">'+(j.steps||[]).map(function(s){
    return '<li><span class="ic '+(s.ok?'ok':'no')+'">'+(s.ok?'✓':'!')+'</span><div>'+esc(s.label)+'</div></li>';
  }).join('')+'</ul>';
  $('provbody').innerHTML=html;

  if(j.needs_password){ $('pw').style.display=''; $('p1').focus(); }
  else { $('pw').style.display='none';
    $('provbody').innerHTML+='<div class="note">This account already has a password. '+
      '<a href="'+API+'/app" style="color:var(--cyan)">Sign in to your dashboard</a></div>'; }
  window.__EMAIL=j.email;
}).catch(function(){
  $('provbody').innerHTML='<div class="note">Could not reach the server. Refresh to try again.</div>';
});

function err(m){var e=$('e');e.textContent=m;e.className='err show';}
$('go').addEventListener('click',function(){
  var a=$('p1').value,b=$('p2').value;
  if(a!==b) return err('The two passwords do not match.');
  if(a.length<12) return err('Use at least 12 characters.');
  $('go').disabled=true; $('go').textContent='Saving...';
  fetch(API+'/api/v1/auth/set-password',{method:'POST',credentials:'same-origin',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email:window.__EMAIL,password:a})})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
    .then(function(r){
      if(!r.ok){ $('go').disabled=false; $('go').textContent='Save and open my dashboard';
        return err((r.j.errors&&r.j.errors.join(' '))||r.j.error||'Could not save that password.'); }
      location.href=API+'/app';
    }).catch(function(){ $('go').disabled=false;
      $('go').textContent='Save and open my dashboard'; err('Could not reach the server.'); });
});
$('p2').addEventListener('keydown',function(e){if(e.key==='Enter')$('go').click();});
if('serviceWorker' in navigator) navigator.serviceWorker.register('/jobup/sw.js').catch(function(){});
</script></body></html>
