<!--
  JobUp master mark — the single source for every raster icon.

  The mark is a "J" whose stem is topped by an arrowhead: Job + Up, in one
  letterform. It spells the brand and states what the product does, and because
  it is a single connected stroke it survives being shrunk to a 16px favicon,
  which the previous thin-ring design did not.

  FULL-BLEED SQUARE ON PURPOSE. iOS rounds apple-touch-icon itself, so a
  pre-rounded source gets double-rounded; Android maskable icons need the
  corners filled or they show gaps. favicon.svg is the rounded variant, for
  browser tabs that render the SVG as-is.

  MASKABLE SAFE ZONE: an Android mask can crop to the circle inscribed in the
  central 80% (radius 205 from centre). The furthest the glyph reaches, stroke
  width included, is 133 — so nothing is ever clipped. SIT re-derives this from
  the path data rather than trusting the number in this comment.

  Palette is the LANDING brand gradient (#5b7bff -> #e64980 -> #ff922b), not the
  dashboard's cyan/violet UI accent. The icon fronts jobup.dev, so it wears the
  brand, and the nav lockup now uses the same mark instead of a bare gradient
  square.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="JobUp">
  <defs>
    <!-- userSpaceOnUse so the angle matches the CSS 120deg brand gradient. -->
    <linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="-30" y1="-10" x2="470" y2="480">
      <stop offset="0" stop-color="#4c6ef5"/>
      <stop offset="0.5" stop-color="#e64980"/>
      <stop offset="1" stop-color="#ff922b"/>
    </linearGradient>
    <!-- A soft lift so the tile does not read as flat colour at 512px.
         Deliberately a gradient, not a filter: filters rasterise unevenly.
         Kept low and off the blue corner — at 0.22 it bleached the blue end of
         the brand gradient out of the icon entirely. -->
    <radialGradient id="lift" cx="0.42" cy="0.12" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#brand)"/>
  <rect width="512" height="512" fill="url(#lift)"/>

  <g fill="none" stroke="#ffffff" stroke-width="52"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- the up arrowhead -->
    <path d="M209 232 L283 158 L357 232"/>
    <!-- the J: stem down from the arrow, then the hook -->
    <path d="M283 158 V290 A64 64 0 0 1 155 290"/>
  </g>
</svg>
