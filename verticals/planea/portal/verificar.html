<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Planea — Confirma tu correo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#16373A;--card:#0f231e;--line:#24413b;--txt:#eaf1ec;--mut:#9db3ab;--green:#3fc06a;--greenb:#8fd9ac;--teal:#17a6a6}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:linear-gradient(180deg,#16373A 0%,#123033 55%,#0B282B 100%);background-color:#16373A;color:var(--txt);font-family:'DM Sans',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{width:100%;max-width:420px}
  .brand{display:flex;justify-content:center;margin-bottom:18px}
  .brand .mk{width:74px;height:74px;border-radius:20px;border:2px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;background:#0f231e}
  h1{font-family:'Inter',sans-serif;font-weight:800;font-size:26px;text-align:center;margin:0 0 6px;letter-spacing:-.02em}
  .sub{text-align:center;color:var(--mut);font-size:14px;margin:0 0 20px}
  label{display:block;font-weight:700;font-size:14px;margin:16px 0 7px}
  input{width:100%;background:#16302a;border:1px solid var(--line);border-radius:12px;padding:14px 15px;color:var(--txt);font-family:inherit;font-size:15px}
  input:focus{outline:2px solid var(--green);border-color:transparent}
  .btn{width:100%;margin-top:22px;background:linear-gradient(120deg,var(--green),var(--teal));color:#06130f;border:none;border-radius:12px;padding:15px;font-family:'Inter',sans-serif;font-weight:800;font-size:16px;cursor:pointer}
  .btn:disabled{opacity:.6;cursor:default}
  .msg{margin-top:16px;padding:12px 14px;border-radius:12px;font-size:14px;display:none}
  .msg.err{display:block;background:#2a1414;color:#ff9d9d;border:1px solid #52201f}
  .msg.ok{display:block;background:#12271c;color:var(--greenb);border:1px solid #24513a}
  .foot{text-align:center;margin-top:22px;color:var(--mut);font-size:14px}
  .foot a{color:var(--greenb);font-weight:700;text-decoration:none}
  .code{font-family:'Inter',sans-serif;font-size:28px;font-weight:800;letter-spacing:10px;text-align:center;padding:14px 10px}
  .lnk{background:none;border:none;color:var(--greenb);font-weight:700;font-size:14px;cursor:pointer;padding:10px 4px;font-family:inherit}
  .lnk:disabled{color:var(--mut);cursor:default}
  .who{color:var(--txt);font-weight:700;overflow-wrap:anywhere}
  [hidden]{display:none!important}
</style>
</head>
<body>
  <div class="box">
    <div class="brand"><img src="/planea/portal/planea-logo-white.png?v=2" alt="Planea" style="height:44px;width:auto;display:block;margin:0 auto 2px"></div>
    <h1>Confirma tu correo</h1>

    <div id="porCodigo">
      <p class="sub">Te enviamos un código de 6 dígitos a <span class="who" id="who">tu correo</span>. Escríbelo aquí para entrar.</p>
      <div id="msg" class="msg"></div>
      <form id="f">
        <label for="email" id="emailLbl" hidden>Correo electrónico</label>
        <input id="email" type="email" autocomplete="email" placeholder="tu@correo.com" hidden>
        <label for="code">Código</label>
        <input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" placeholder="000000" required>
        <button class="btn" id="go" type="submit">Confirmar</button>
      </form>
      <div class="foot">¿No te llegó? Revisa la carpeta de spam o <button class="lnk" id="again" type="button">pide otro código</button></div>
      <div class="foot"><a href="/planea/signup">Usar otro correo</a></div>
    </div>

    <div id="porEnlace" hidden>
      <p class="sub">Toca el botón para confirmar tu correo y entrar a Planea.</p>
      <div id="msg2" class="msg"></div>
      <button class="btn" id="go2" type="button">Confirmar mi correo</button>
      <div class="foot"><a href="/planea/verificar">Escribir el código</a></div>
    </div>
  </div>
<script>
(function(){
  var API='/planea/api/v1/auth/';
  var DEST='/planea/portal/diagnostico?onboarding=1';
  var q=new URLSearchParams(location.search);
  var token=q.get('t'), email=(q.get('email')||'').trim();
  function $(id){return document.getElementById(id);}
  function show(el,t,ok){ el.textContent=t; el.className='msg '+(ok?'ok':'err'); }
  function post(path,body){
    return fetch(API+path,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){return r.json().catch(function(){return {};}).then(function(j){return {ok:r.ok,status:r.status,j:j};});});
  }
  // El enlace del correo NO confirma solo al abrirse: los filtros de correo abren los
  // enlaces. Confirma el botón, con un POST.
  if(token){
    $('porCodigo').hidden=true; $('porEnlace').hidden=false;
    $('go2').addEventListener('click',function(){
      var b=$('go2'); b.disabled=true; b.textContent='Confirmando…';
      post('verify',{token:token}).then(function(res){
        if(res.ok){ show($('msg2'),'Correo confirmado. Entrando…',true); location.replace(DEST); return; }
        show($('msg2'),res.j.error||'No se pudo confirmar.',false);
        if(res.j.verified){ b.textContent='Iniciar sesión'; b.disabled=false; b.onclick=function(){location.href='/planea/login';}; return; }
        b.disabled=false; b.textContent='Confirmar mi correo';
      }).catch(function(){ show($('msg2'),'Error de conexión. Intenta de nuevo.',false); b.disabled=false; b.textContent='Confirmar mi correo'; });
    });
    return;
  }
  if(email){ $('who').textContent=email; } else { $('who').textContent='tu correo'; $('email').hidden=false; $('emailLbl').hidden=false; $('email').required=true; }
  function correo(){ return email || $('email').value.trim(); }
  var code=$('code'); code.addEventListener('input',function(){ code.value=code.value.replace(/\D/g,'').slice(0,6); });
  var timer=null;
  function espera(s){
    var b=$('again'); clearInterval(timer); b.disabled=true;
    (function tick(){ b.textContent='pide otro código ('+s+' s)'; if(s--<=0){ clearInterval(timer); b.disabled=false; b.textContent='pide otro código'; } })();
    timer=setInterval(function(){ b.textContent='pide otro código ('+s+' s)'; if(s--<=0){ clearInterval(timer); b.disabled=false; b.textContent='pide otro código'; } },1000);
  }
  if(email) espera(60);
  $('f').addEventListener('submit',function(e){
    e.preventDefault();
    var c=code.value; if(c.length!==6){ show($('msg'),'El código tiene 6 dígitos.',false); return; }
    if(!correo()){ show($('msg'),'Escribe tu correo.',false); return; }
    var go=$('go'); go.disabled=true; go.textContent='Confirmando…';
    post('verify',{email:correo(),code:c}).then(function(res){
      if(res.ok){ show($('msg'),'Correo confirmado. Entrando…',true); location.replace(DEST); return; }
      if(res.j.verified){ location.href='/planea/login'; return; }
      show($('msg'),res.j.error||'No se pudo confirmar.',false); go.disabled=false; go.textContent='Confirmar';
      if(res.j.expired) code.value='';
    }).catch(function(){ show($('msg'),'Error de conexión. Intenta de nuevo.',false); go.disabled=false; go.textContent='Confirmar'; });
  });
  $('again').addEventListener('click',function(){
    if(!correo()){ show($('msg'),'Escribe tu correo.',false); return; }
    var b=$('again'); b.disabled=true;
    post('verify/resend',{email:correo()}).then(function(res){
      if(res.ok){ show($('msg'),'Te enviamos un código nuevo. El anterior ya no sirve.',true); code.value=''; espera(res.j.wait||60); return; }
      show($('msg'),res.j.error||'No se pudo enviar.',false);
      if(res.j.wait) espera(res.j.wait); else b.disabled=false;
    }).catch(function(){ show($('msg'),'Error de conexión. Intenta de nuevo.',false); b.disabled=false; });
  });
})();
</script>
</body>
</html>
