<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Planea — Seguros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/planea/portal/planea-app.css?v=59">
<style>
  .sp-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
  .sp-cell{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .sp-lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700}
  .sp-val{font-family:'Inter';font-weight:800;font-size:20px;margin-top:5px;font-variant-numeric:tabular-nums}
  .sp-row{display:flex;flex-direction:column;gap:6px;margin-top:14px}
  .sp-row label{font-size:12.5px;font-weight:700}
  .sp-row select{width:100%;background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-family:inherit;font-size:15px;color:var(--txt);outline:none}
  .sp-row select:focus{border-color:var(--green)}
  .sp-note{font-size:12.5px;color:var(--green);margin-top:12px;font-weight:600;line-height:1.5}
</style>
</head>
<body>
<div class="app"><div class="wrap">

  <div class="phead"><div><h1>Seguros</h1><p class="lede">Entiende qué tienes protegido hoy y qué tan suficiente es.</p></div></div>

  <!-- Resumen de protección §24 — NO la suma de valores asegurados como indicador principal. -->
  <div class="group">
    <div class="group-head"><div><div class="gt">Resumen de protección</div><div class="gs">Lo que tienes protegido hoy</div></div></div>
    <div class="group-body">
      <div class="sp-grid">
        <div class="sp-cell"><div class="sp-lbl">Pólizas activas</div><div class="sp-val" data-pl="seguros_count">0</div></div>
        <div class="sp-cell"><div class="sp-lbl">Prima mensual total</div><div class="sp-val" data-pl="seguros_prima">$0</div></div>
      </div>
      <div class="sp-row"><label>Si no pudieras trabajar mañana, ¿por cuánto tiempo estarían cubiertos tú y los tuyos?</label>
        <select id="sp-suf"><option value="">Selecciona…</option><option value="menos3">Menos de 3 meses</option><option value="3a12">Entre 3 meses y 1 año</option><option value="mas1">Más de 1 año</option><option value="nose">No sé</option></select></div>
      <div class="sp-note" id="sp-note"></div>
    </div>
  </div>

  <!-- §24 bloque 2 «Tu protección»: qué tienes cubierto y qué falta por registrar. -->
  <div class="group">
    <div class="group-head"><div><div class="gt">Tu protección</div><div class="gs">Coberturas registradas — informativo, no asume que necesites contratar</div></div></div>
    <div class="group-body"><div data-secresumen="seguros"></div></div>
  </div>

  <div class="group">
    <div class="group-head"><div><div class="gt">Tus pólizas</div><div class="gs">Agrega cada seguro que tengas</div></div></div>
    <div class="group-body"><div id="mod-edit" data-cat="seguros"></div></div>
  </div>

</div></div>
<script src="/planea/portal/planea-motor.js?v=1" defer></script>
<script src="/planea/portal/planea-nav.js?v=70" defer></script>
<script src="/planea/portal/planea-data.js?v=67" defer></script>
<script src="/planea/portal/planea-sb.js?v=70" defer></script>
<script src="/planea/portal/planea-realdata.js?v=1" defer></script>
<script src="/planea/portal/planea-module-edit.js?v=66" defer></script>
<script>
  // Suficiencia §24 (Q9) = fuente de dato real del 50% del pilar de Seguros. Al cambiar,
  // recalcula el Puntaje Planea con el motor de 8 pilares y guarda.
  (function () {
    var SB = window.PlaneaSB, M = window.PlaneaMotor, scoreData = null;
    var $ = function (id) { return document.getElementById(id); };
    function sub(P, k) { return Math.round((P[k] && P[k].puntaje) || 0); }
    function recompute() {
      var v = $('sp-suf').value; if (!v || !M || !SB) return;
      // Re-lee fresco para no pisar el DATO REAL que el editor pudo guardar (§3), y aplica
      // el dato real de los ítems al recalcular — un solo motor, un solo número.
      SB.meGet().then(function (d) {
        var sd = d && d.score_data;
        if (!sd || !sd.answers || !sd.answers.edad) return;
        if (sd.answers.seguros_suficiencia === v) { scoreData = sd; return; }
        var ans = Object.assign({}, sd.answers, { seguros_suficiencia: v });
        if (window.PlaneaRealData) ans = PlaneaRealData.applyRealData(ans, (d && d.items) || []);
        var res = M.compute(ans), P = res.pilares;
        var hist = Array.isArray(sd.history) ? sd.history.slice() : [];
        hist.push({ score: res.score, at: new Date().toISOString(), source: 'seguros' });
        scoreData = Object.assign({}, sd, {
          score: res.score, rango: res.rango.name, answers: ans, history: hist, prioridad: res.prioridad,
          pilares: { ahorro: sub(P, 'ahorro'), flujo: sub(P, 'flujo'), deuda: sub(P, 'deuda'), retiro: sub(P, 'retiro'), seguros: sub(P, 'seguros'), inversion: sub(P, 'inversion'), impuestos: sub(P, 'impuestos'), patrimonio: sub(P, 'patrimonio') },
          pillars: { emergency_fund: sub(P, 'ahorro'), cash_flow: sub(P, 'flujo'), debt_health: sub(P, 'deuda'), stability: sub(P, 'patrimonio') }
        });
        $('sp-note').textContent = 'Tu Puntaje Planea quedó en ' + res.score + '. Actualizaste tu protección.';
        SB.mePut({ score_data: scoreData }).catch(function () {});
      }).catch(function () {});
    }
    function boot() {
      if (!SB || !SB.meGet) return;
      SB.meGet().then(function (d) {
        d = d || {}; scoreData = d.score_data || null;
        var a = (scoreData && scoreData.answers) || {};
        if ($('sp-suf')) $('sp-suf').value = a.seguros_suficiencia || '';
      }).catch(function () {});
      if ($('sp-suf')) $('sp-suf').addEventListener('change', recompute);
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  })();
</script>
<script src="/planea/portal/planea-secresumen.js?v=1" defer></script>
<script src="/planea/portal/maya-chat.js?v=62" defer></script>
</body>
</html>
