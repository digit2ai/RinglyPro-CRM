<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>AutoDev — Historial</title>
<link rel="icon" href="/speakup/favicon.svg">
<link rel="manifest" href="/speakup/manifest.webmanifest">
<link rel="apple-touch-icon" href="/speakup/apple-touch-icon.png">
<link rel="stylesheet" href="/speakup/theme.css?v=11">
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  main{max-width:760px;margin:0 auto;padding:12px 14px calc(16px + env(safe-area-inset-bottom))}
  .search{width:100%;min-height:46px;border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;
    background:var(--surface-solid);color:var(--panel-text)}
  .search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
  .list{margin-top:12px}
  .meet{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line-strong);background:transparent;color:inherit;
    font:inherit;padding:12px 4px;min-height:52px;cursor:pointer;text-decoration:none}
  .meet:first-child{border-top:0}
  .meet:hover{background:var(--raised)}
  .meet .t{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .more{width:100%;margin-top:10px}
  @media(max-width:820px){ .top .lnk{min-height:44px;min-width:44px;justify-content:center} .top .tab{min-height:44px;padding:0 11px} }
</style>
</head>
<body>
<header class="top">
  <img src="/speakup/favicon.svg" alt="">
  <img class="wordmark" src="/speakup/wordmark.svg?v=1" alt="Digit2AI">
  <span class="product">AutoDev</span>
  <nav class="tabs">
    <a class="tab" href="/speakup/meetings" id="tabMeet">Reuniones</a>
    <a class="tab" href="/speakup/claude-code" id="tabCC">Builder</a>
  </nav>
  <div class="hdrmenu" id="hdrMenu">
    <span class="where" id="ctx"></span>
    <a class="lnk" href="/speakup/history" id="navHistory">Historial</a>
    <a class="lnk" href="/speakup/meetings?new=1" id="navNew">Nueva reunión</a>
    <a class="lnk" href="/speakup/settings" id="navSettings">Ajustes</a>
    <button class="lnk" id="langBtn">EN</button>
    <button class="lnk" id="outBtn">Salir</button>
  </div>
  <button class="burger" id="burger" aria-label="Menú" aria-expanded="false" aria-controls="hdrMenu"><span></span><span></span><span></span></button>
</header>

<main>
  <section class="card">
    <h2 id="hTitle">Historial</h2>
    <input class="search" id="q" type="search" autocomplete="off" placeholder="Buscar por título o por lo que se dijo…">
    <div class="list" id="list"><div class="tiny" id="state">Cargando…</div></div>
    <button class="btn more" id="moreBtn" hidden>Cargar más</button>
  </section>
</main>

<script src="/speakup/history.js?v=2"></script>
<script src="/speakup/header-menu.js?v=3"></script>
<script src="/speakup/install.js?v=1" defer></script>
</body>
</html>
