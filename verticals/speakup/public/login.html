<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AutoDev — Iniciar sesión</title>
<link rel="icon" href="/speakup/favicon.svg">
<link rel="manifest" href="/speakup/manifest.webmanifest">
<link rel="apple-touch-icon" href="/speakup/apple-touch-icon.png">
<meta name="theme-color" content="#1f2937">
<!-- The SAME stylesheet both screens use, now carrying the RinglyPro CRM palette that
     aiagent.ringlypro.com signs in with. This page used to declare its own colours
     inline and never load theme.css at all, so it drifted a whole theme behind the app
     and the first screen anyone saw looked like a different product. The page-local
     block below exists because theme.css has no form rules — it reads the SHARED
     TOKENS and declares no colour of its own, which is what keeps that from recurring. -->
<link rel="stylesheet" href="/speakup/theme.css?v=7">
<style>
  body{display:flex;align-items:center;justify-content:center;padding:24px;
    padding-top:calc(24px + env(safe-area-inset-top));padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  .card{width:100%;max-width:400px;padding:30px 26px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:5px}
  .brand img.mark{width:26px;height:26px;border-radius:6px;flex:0 0 auto}
  .brand img.wordmark{height:15px;width:auto;color:var(--text);flex:0 0 auto}
  /* theme.css hides `.product` below 560px — right in the app, where the tabs already
     say which screen you are on, and wrong here, where there are no tabs and the card
     would read only DIGIT2AI. `.brand .product` is (0,2,0) and beats the bare
     `.product` (0,1,0) inside that media query, so it needs no !important. */
  .brand .product{display:inline-block;font-family:var(--serif);font-size:16px;font-weight:600;
    color:var(--text);padding-left:9px;border-left:1px solid var(--line-strong)}
  .tag{color:var(--muted);font-size:13.5px;margin:0 0 24px}
  label{display:block;font-size:13px;color:var(--muted);margin:16px 0 6px}
  input{width:100%;min-height:44px;padding:11px 13px;border-radius:10px;
    border:1px solid var(--line-strong);background:var(--surface-solid);color:var(--text);
    font:inherit;font-size:16px;outline:none}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
  form .btn.primary{width:100%;margin-top:22px;font-size:15px}
  .err{margin-top:14px;color:var(--err);font-size:14px;min-height:18px}
  .lang{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;display:flex;gap:6px}
  .foot{margin-top:20px;text-align:center;line-height:1.55}
</style>
</head>
<body>
<div class="lang">
  <button id="es" class="btn small primary" onclick="setLang('es')">ES</button>
  <button id="en" class="btn small" onclick="setLang('en')">EN</button>
</div>
<div class="card">
  <div class="brand">
    <img class="mark" src="/speakup/favicon.svg" alt="">
    <img class="wordmark" src="/speakup/wordmark.svg?v=1" alt="Digit2AI">
    <span class="product">AutoDev</span>
  </div>
  <p class="tag" data-es="Habla, revisa el plan, apruébalo · herramienta interna del equipo" data-en="Speak, review the plan, approve it · internal team tool">Habla, revisa el plan, apruébalo · herramienta interna del equipo</p>
  <form id="f">
    <label data-es="Correo" data-en="Email">Correo</label>
    <input id="email" type="email" autocomplete="username" required>
    <label data-es="Contraseña" data-en="Password">Contraseña</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button id="btn" class="btn primary" type="submit" data-es="Iniciar sesión" data-en="Sign in">Iniciar sesión</button>
    <div class="err" id="err"></div>
  </form>
  <p class="foot tiny" data-es="Acceso solo por invitación. Contacta al administrador para tu cuenta." data-en="Invite-only access. Contact the administrator for an account.">Acceso solo por invitación. Contacta al administrador para tu cuenta.</p>
</div>
<script>
  let lang = localStorage.getItem('speakup_lang') || 'es';
  function setLang(l){
    lang = l; localStorage.setItem('speakup_lang', l);
    document.documentElement.lang = l;
    document.getElementById('es').classList.toggle('primary', l==='es');
    document.getElementById('en').classList.toggle('primary', l==='en');
    document.querySelectorAll('[data-es]').forEach(el => { el.textContent = el.getAttribute('data-'+l); });
  }
  setLang(lang);
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn'), err = document.getElementById('err');
    err.textContent = ''; btn.disabled = true;
    try {
      const r = await fetch('/speakup/api/v1/auth/login', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
      });
      const d = await r.json();
      if (!r.ok) { err.textContent = d.error || 'Error'; btn.disabled = false; return; }
      location.href = '/speakup/';
    } catch (e) { err.textContent = e.message; btn.disabled = false; }
  });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/speakup/sw.js').catch(()=>{});
</script>
</body>
</html>
