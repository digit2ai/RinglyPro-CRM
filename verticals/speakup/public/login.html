<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SpeakUp — Iniciar sesión</title>
<link rel="icon" href="/speakup/favicon.svg">
<link rel="manifest" href="/speakup/manifest.webmanifest">
<link rel="apple-touch-icon" href="/speakup/apple-touch-icon.png">
<meta name="theme-color" content="#5a3fe0">
<style>
  :root{--bg:#0a0e18;--card:#131b2b;--line:#243049;--txt:#e9eef7;--mut:#8a98b0;--acc:#7b6bff;--acc2:#5a3fe0}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#1a1440 0%,var(--bg) 55%);color:var(--txt);
    display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:400px;background:linear-gradient(180deg,var(--card),#0e1522);
    border:1px solid var(--line);border-radius:20px;padding:34px 28px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .brand img{width:44px;height:44px}
  .brand h1{font-size:24px;margin:0;letter-spacing:-.5px}
  .tag{color:var(--mut);font-size:13px;margin:0 0 26px}
  label{display:block;font-size:13px;color:var(--mut);margin:16px 0 6px}
  input{width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--line);background:#0c1320;
    color:var(--txt);font-size:15px;outline:none}
  input:focus{border-color:var(--acc)}
  button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:11px;cursor:pointer;
    background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;font-size:16px;font-weight:600}
  button:disabled{opacity:.6;cursor:default}
  .err{margin-top:16px;color:#ff8f8f;font-size:14px;min-height:18px}
  .lang{position:fixed;top:16px;right:16px;display:flex;gap:6px}
  .lang button{width:auto;margin:0;padding:6px 12px;background:#1b2536;font-size:13px;font-weight:500}
  .lang button.on{background:var(--acc2)}
  .foot{margin-top:22px;color:var(--mut);font-size:12px;text-align:center;line-height:1.5}
</style>
</head>
<body>
<div class="lang">
  <button id="es" class="on" onclick="setLang('es')">ES</button>
  <button id="en" onclick="setLang('en')">EN</button>
</div>
<div class="card">
  <div class="brand"><img src="/speakup/favicon.svg" alt=""><h1>SpeakUp</h1></div>
  <p class="tag" data-es="Voz a texto + IA · herramienta interna del equipo" data-en="Voice-to-text + AI · internal team tool">Voz a texto + IA · herramienta interna del equipo</p>
  <form id="f">
    <label data-es="Correo" data-en="Email">Correo</label>
    <input id="email" type="email" autocomplete="username" required>
    <label data-es="Contraseña" data-en="Password">Contraseña</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button id="btn" type="submit" data-es="Iniciar sesión" data-en="Sign in">Iniciar sesión</button>
    <div class="err" id="err"></div>
  </form>
  <p class="foot" data-es="Acceso solo por invitación. Contacta al administrador para tu cuenta." data-en="Invite-only access. Contact the administrator for an account.">Acceso solo por invitación. Contacta al administrador para tu cuenta.</p>
</div>
<script>
  let lang = localStorage.getItem('speakup_lang') || 'es';
  function setLang(l){
    lang = l; localStorage.setItem('speakup_lang', l);
    document.documentElement.lang = l;
    document.getElementById('es').classList.toggle('on', l==='es');
    document.getElementById('en').classList.toggle('on', l==='en');
    document.querySelectorAll('[data-es]').forEach(el => { el.textContent = el.getAttribute('data-'+l); });
  }
  setLang(lang);
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn'), err = document.getElementById('err');
    err.textContent = ''; btn.disabled = true;
    try {
      const r = await fetch('/speakup/api/v1/auth/login', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
      });
      const d = await r.json();
      if (!r.ok) { err.textContent = d.error || 'Error'; btn.disabled = false; return; }
      location.href = '/speakup/';
    } catch (e) { err.textContent = e.message; btn.disabled = false; }
  });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/speakup/sw.js').catch(()=>{});
</script>
</body>
</html>
