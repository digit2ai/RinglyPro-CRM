<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>AutoDev — Digit2AI</title>
<link rel="icon" href="/speakup/favicon.svg">
<link rel="manifest" href="/speakup/manifest.webmanifest">
<link rel="apple-touch-icon" href="/speakup/apple-touch-icon.png">
<link rel="stylesheet" href="/speakup/theme.css?v=7">
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  /* One window: the work on top, the instruction box at the bottom. */
  body{display:flex;flex-direction:column;overflow:hidden}
  main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:11px 14px 0}
  #out{flex:1 1 auto;min-height:0}
  #out .say{white-space:pre-wrap;word-break:break-word}
  /* While a job or an answer is running there is nothing to send, so the send button gives its
     place to a moving bar: the screen says plainly that something is happening, and comes back
     the moment the box is usable again. */
  /* The plan at a glance: numbered titles, nothing else. */
  #plan .pflow{margin:10px 0 4px;padding-left:26px}
  #plan .pflow li{margin:0 0 7px;font-size:15px;line-height:1.45}
  #plan details.more{margin-top:6px}
  #plan details.more>summary{cursor:pointer;font-size:13px;color:var(--muted);padding:6px 0;min-height:32px}
  .workw{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
  .workw:empty{display:none}
  .workw+.prog{margin-left:10px}
  .prog{margin-left:auto;width:120px;height:8px;border-radius:999px;background:var(--raised);border:1px solid var(--line-strong);overflow:hidden}
  .prog span{display:block;width:40%;height:100%;background:var(--accent-solid);border-radius:999px;animation:slide 1.15s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
  @media (prefers-reduced-motion: reduce){ .prog span{animation:none;width:100%;opacity:.55} }
  /* No empty page: with nothing in progress the step bar and the work pane are not drawn.
     console.js adds .idle only when there is no job; any job, event or plan removes it. */
  body.idle #bar, body.idle #out{display:none}
  footer{flex:0 0 auto;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);background:var(--paper)}
  #cmd{height:11vh;min-height:58px;max-height:30vh}
  /* The plan the owner reads before typing "approved" — paper, not terminal. */
  #plan{flex:0 0 auto;max-height:52vh;overflow:auto;margin-bottom:9px;display:none}
  #plan .planhd{display:flex;align-items:center;gap:9px;margin-bottom:7px;flex-wrap:wrap}
  #plan .planhd h2{margin:0}
  #plan .notice{margin:0 0 9px}
  #plan pre{margin:0;font-family:var(--mono);font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  #plan .rev{background:var(--raised);border-left:3px solid var(--accent);padding:7px 10px;margin:7px 0;border-radius:0 8px 8px 0;font-size:13.5px}
  @media(max-width:560px){ main{padding-left:12px;padding-right:12px} footer{padding-left:12px;padding-right:12px} }
</style>
</head>
<body>
<header class="top">
  <img src="/speakup/favicon.svg" alt="">
  <img class="wordmark" src="/speakup/wordmark.svg?v=1" alt="Digit2AI">
  <span class="product">AutoDev</span>
  <nav class="tabs">
    <a class="tab" href="/speakup/meetings" id="tabMeet">Reuniones</a>
    <a class="tab on" href="/speakup/" id="tabFac">Fábrica</a>
  </nav>
  <div class="hdrmenu" id="hdrMenu">
    <span class="where" id="ctx"></span>
    <a class="lnk" href="/speakup/history" id="navHistory">Historial</a>
    <a class="lnk" href="/speakup/meetings?new=1" id="navNew">Nueva reunión</a>
    <a class="lnk" href="/speakup/settings" id="navSettings">Ajustes</a>
    <button class="lnk" id="langBtn">EN</button>
    <button class="lnk" id="outBtn">Salir</button>
  </div>
  <button class="burger" id="burger" aria-label="Menú" aria-expanded="false" aria-controls="hdrMenu"><span></span><span></span><span></span></button>
</header>

<main>
  <div class="bar" id="bar"></div>
  <section class="card" id="plan" aria-live="polite"></section>
  <div id="out" class="ink"></div>
</main>

<footer>
  <div class="box">
    <div id="shots" class="shots"></div>
    <textarea id="cmd" spellcheck="false" placeholder="Escribe, pega una captura o dicta la instrucción…"></textarea>
    <div class="boxrow">
      <button class="icon" id="mic" aria-label="Dictar" title="Dictar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
      </button>
      <span class="stat" id="stat"></span>
      <span class="workw" id="workw" aria-hidden="true"></span>
      <div class="prog" id="prog" role="status" aria-live="polite" hidden><span></span></div>
      <button class="icon send" id="send" aria-label="Enviar" title="Enviar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
      </button>
    </div>
  </div>
</footer>

<script src="/speakup/console.js?v=15"></script>
<script src="/speakup/header-menu.js?v=2"></script>
</body>
</html>
