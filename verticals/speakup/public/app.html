<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>SpeakUp</title>
<link rel="icon" href="/speakup/favicon.svg">
<link rel="manifest" href="/speakup/manifest.webmanifest">
<link rel="apple-touch-icon" href="/speakup/apple-touch-icon.png">
<meta name="theme-color" content="#5a3fe0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{--bg:#0a0e18;--bg2:#0e1522;--card:#131b2b;--line:#243049;--txt:#e9eef7;--mut:#8a98b0;
    --acc:#7b6bff;--acc2:#5a3fe0;--ok:#3fc06a;--warn:#f2b34b;--err:#ff8f8f}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);
    padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  a{color:var(--acc)}
  header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(10,14,24,.94);backdrop-filter:blur(10px);z-index:20}
  header img{width:28px;height:28px}
  header h1{font-size:18px;margin:0;letter-spacing:-.4px;flex:1}
  .hbtn{background:#1b2536;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:8px 11px;font-size:13px;cursor:pointer}
  .hbtn.on{background:var(--acc2);border-color:var(--acc2)}
  .app{max-width:680px;margin:0 auto;padding:16px}
  h2{font-size:13px;margin:0 0 12px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
  /* RECORD HERO */
  .hero{text-align:center;padding:26px 18px}
  .orbwrap{display:flex;flex-direction:column;align-items:center;gap:14px}
  .orb{width:132px;height:132px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bda4ff,#6a4bff 45%,#2a1f6b 100%);
    box-shadow:0 0 0 0 rgba(123,107,255,.5);cursor:pointer;border:0;position:relative;transition:transform .12s}
  .orb:active{transform:scale(.95)}
  .orb.rec{animation:pulse 1.2s ease-in-out infinite}
  .orb::before{content:"";position:absolute;inset:0;margin:auto;width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.92);
    transition:all .2s}
  .orb.rec::before{width:30px;height:30px;border-radius:6px;background:#ff5a6a}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(123,107,255,.5)}70%{box-shadow:0 0 0 30px rgba(123,107,255,0)}100%{box-shadow:0 0 0 0 rgba(123,107,255,0)}}
  .timer{font-variant-numeric:tabular-nums;font-size:30px;font-weight:700;letter-spacing:1px}
  .hint{color:var(--mut);font-size:14px;line-height:1.5}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .btn{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;border:0;border-radius:12px;
    padding:13px 15px;font-size:15px;font-weight:600;cursor:pointer;min-height:46px}
  .btn.sec{background:#1b2536;border:1px solid var(--line);color:var(--txt);font-weight:500}
  .btn.danger{background:#2a1620;border:1px solid #5a2a3a;color:#ff9fb0;font-weight:500}
  .btn.block{width:100%}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.sm{padding:10px 12px;font-size:14px;min-height:42px}
  input,select,textarea{background:#0c1320;border:1px solid var(--line);color:var(--txt);border-radius:11px;
    padding:12px 13px;font-size:16px;font-family:inherit;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
  .muted{color:var(--mut);font-size:13px}
  .note{font-size:12px;color:var(--mut);margin-top:12px;line-height:1.5}
  /* LIBRARY */
  .reclist{display:flex;flex-direction:column;gap:8px}
  .recitem{background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:14px;cursor:pointer}
  .recitem:active{border-color:var(--acc)}
  .recitem.active{border-color:var(--acc);background:#161f33}
  .recitem .t{font-weight:600;font-size:15px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .recitem .m{font-size:12px;color:var(--mut);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .badge{font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--line)}
  .badge.processing{color:var(--warn);border-color:#4a3a1a}
  .badge.error{color:var(--err);border-color:#5a2a3a}
  .badge.sim{color:var(--warn);border-color:#4a3a1a}
  /* DELIVERABLES */
  .tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .tab{background:#1b2536;border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:10px 13px;font-size:14px;cursor:pointer}
  .tab.on{background:var(--acc2);border-color:var(--acc2);color:#fff}
  .result{background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:16px;margin-top:12px;line-height:1.6;overflow-x:auto}
  .result h4{margin:0 0 8px;font-size:14px;color:var(--acc)}
  .result ul{margin:6px 0;padding-left:20px}
  .mdbody{margin-top:10px}
  .mdbody h3{font-size:18px;margin:14px 0 6px}
  .mdbody h4{font-size:16px;margin:12px 0 6px;color:var(--txt)}
  .mdbody h5,.mdbody h6{font-size:14px;margin:10px 0 5px;color:var(--acc)}
  .mdbody p{margin:8px 0}
  .mdbody ul,.mdbody ol{margin:6px 0;padding-left:22px}
  .mdbody li{margin:3px 0}
  .mdbody code{background:#0c1320;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:13px}
  .transcript{white-space:pre-wrap;line-height:1.6;font-size:15px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px}
  details.sec-collapse>summary{cursor:pointer;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;font-weight:700;list-style:none;padding:2px 0}
  details.sec-collapse>summary::-webkit-details-marker{display:none}
  details.sec-collapse>summary::before{content:"▸ ";color:var(--acc)}
  details.sec-collapse[open]>summary::before{content:"▾ "}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#1b2536;border:1px solid var(--line);padding:12px 20px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
  .toast.show{opacity:1}
  .empty{color:var(--mut);text-align:center;padding:22px 12px;font-size:14px}
  @media print{header,.hero,.tabs,.row,.actions,.sec-collapse>summary,.importbox,.libcard{display:none!important}
    .card{border:0;background:#fff;color:#000}.transcript,.result{border:0;background:#fff;color:#000}body{background:#fff;color:#000}}
</style>
</head>
<body>
<header>
  <img src="/speakup/favicon.svg" alt="">
  <h1>SpeakUp</h1>
  <button class="hbtn" id="langEs" onclick="setLang('es')">ES</button>
  <button class="hbtn" id="langEn" onclick="setLang('en')">EN</button>
  <button class="hbtn" onclick="logout()" data-i="logout">Salir</button>
</header>

<div class="app">

  <!-- 1) RECORD — the hero, always at the top -->
  <section class="card hero">
    <div class="orbwrap">
      <button class="orb" id="orb" aria-label="Grabar"></button>
      <div class="timer" id="timer">00:00</div>
      <div class="hint" id="recstatus" data-i="tapToRec">Pulsa para grabar tu voz</div>
    </div>
    <button class="btn sec sm block" id="meetingBtn" style="margin-top:16px" onclick="startMeeting()" data-i="recMeeting">Grabar reunión (audio del sistema)</button>
    <p class="note" data-i="noBot">Capturamos el audio de tu propio dispositivo. Ningún bot se une a tu llamada.</p>
  </section>

  <!-- 2) CURRENT RECORDING — results + deliverables (transcript at the bottom) -->
  <div id="mainEmpty" class="empty" data-i="pickOne">Graba o elige una grabación para trabajar con ella.</div>
  <section id="detail" style="display:none"></section>

  <!-- 3) LIBRARY -->
  <section class="card libcard">
    <h2 data-i="library">Biblioteca</h2>
    <div class="reclist" id="reclist"><div class="empty" data-i="loading">Cargando…</div></div>
  </section>

  <!-- 4) IMPORT — secondary, collapsed at the bottom -->
  <details class="card importbox">
    <summary style="cursor:pointer;list-style:none"><h2 style="display:inline" data-i="importT">Importar</h2></summary>
    <div style="margin-top:14px">
      <label class="muted" data-i="uploadFile">Subir archivo de audio/video</label>
      <input type="file" id="file" accept="audio/*,video/*" style="margin:8px 0 12px">
      <button class="btn sm block" onclick="uploadFile()" data-i="upload">Subir y transcribir</button>
      <label class="muted" style="display:block;margin-top:16px" data-i="pasteUrl">O pega un enlace (YouTube, etc.)</label>
      <input type="url" id="url" placeholder="https://..." style="margin:8px 0 10px">
      <button class="btn sec sm block" onclick="importUrl()" data-i="import">Importar enlace</button>
    </div>
  </details>

</div>

<div class="toast" id="toast"></div>

<script>
// ─── i18n ─────────────────────────────────────────────────────────────────────
const I18N = {
  es:{logout:'Salir',tapToRec:'Pulsa para grabar tu voz',recording:'Grabando… pulsa para detener',
    recMeeting:'Grabar reunión (audio del sistema)',noBot:'Capturamos el audio de tu propio dispositivo. Ningún bot se une a tu llamada.',
    importT:'Importar',uploadFile:'Subir archivo de audio/video',upload:'Subir y transcribir',pasteUrl:'O pega un enlace (YouTube, etc.)',
    import:'Importar enlace',library:'Biblioteca',loading:'Cargando…',pickOne:'Graba o elige una grabación para trabajar con ella.',
    empty:'Sin grabaciones todavía.',transcript:'Transcripción',translate:'Traducir',rewrite:'Reescribir',export:'Exportar',
    delete:'Eliminar',summarize:'Resumir',bullets:'Puntos clave',actions:'Acciones',toLang:'Idioma destino',translateBtn:'Traducir',
    tone:'Tono',custom:'Instrucción personalizada',rewriteBtn:'Reescribir',professional:'Profesional',concise:'Conciso',friendly:'Cercano',
    email:'Correo',grammar:'Corregir gramática',bulletize:'A viñetas',processing:'Procesando…',noTranscript:'Sin transcripción.',
    saved:'Guardado',deleted:'Eliminado',confirmDel:'¿Eliminar esta grabación?',micUnsupported:'Tu navegador no soporta grabación en vivo. Usa "Importar" abajo.',
    simulated:'simulada',copy:'Copiar',copied:'Copiado',pdf:'PDF',uploading:'Subiendo…',generate:'Generar',
    whatToDo:'¿Qué quieres hacer con esta grabación?',minutes:'Acta de reunión',details:'Detalle completo',nextSteps:'Próximos pasos',
    presentation:'Presentación',projectPlan:'Plan de proyecto',download:'Descargar',generating:'Generando…',
    customField:'O escribe tu propia instrucción (lo que quieras hacer con esta nota)',customPh:'Ej: redacta un correo para el cliente con los acuerdos',
    customLabel:'Personalizado',writeInstr:'Escribe una instrucción'},
  en:{logout:'Sign out',tapToRec:'Tap to record your voice',recording:'Recording… tap to stop',
    recMeeting:'Record meeting (system audio)',noBot:'We capture your own device audio. No bot joins your call.',
    importT:'Import',uploadFile:'Upload audio/video file',upload:'Upload & transcribe',pasteUrl:'Or paste a link (YouTube, etc.)',
    import:'Import link',library:'Library',loading:'Loading…',pickOne:'Record or pick a recording to work with it.',
    empty:'No recordings yet.',transcript:'Transcript',translate:'Translate',rewrite:'Rewrite',export:'Export',
    delete:'Delete',summarize:'Summarize',bullets:'Key points',actions:'Action items',toLang:'Target language',translateBtn:'Translate',
    tone:'Tone',custom:'Custom instruction',rewriteBtn:'Rewrite',professional:'Professional',concise:'Concise',friendly:'Friendly',
    email:'Email',grammar:'Fix grammar',bulletize:'To bullets',processing:'Processing…',noTranscript:'No transcript.',
    saved:'Saved',deleted:'Deleted',confirmDel:'Delete this recording?',micUnsupported:'Your browser does not support live recording. Use "Import" below.',
    simulated:'simulated',copy:'Copy',copied:'Copied',pdf:'PDF',uploading:'Uploading…',generate:'Generate',
    whatToDo:'What do you want to do with this recording?',minutes:'Meeting minutes',details:'Full details',nextSteps:'Next steps',
    presentation:'Presentation',projectPlan:'Project plan',download:'Download',generating:'Generating…',
    customField:'Or write your own instruction (whatever you want to do with this note)',customPh:'e.g. draft an email to the client with the agreements',
    customLabel:'Custom',writeInstr:'Write an instruction'}
};
let lang = localStorage.getItem('speakup_lang') || 'es';
function t(k){ return (I18N[lang] && I18N[lang][k]) || k; }
function setLang(l){
  lang = l; localStorage.setItem('speakup_lang', l); document.documentElement.lang = l;
  document.getElementById('langEs').classList.toggle('on', l==='es');
  document.getElementById('langEn').classList.toggle('on', l==='en');
  document.querySelectorAll('[data-i]').forEach(el => { el.textContent = t(el.getAttribute('data-i')); });
  if (current) renderDetail(current);
}

const LANGS = ['Español','English','Português','Français','Deutsch','Italiano','中文 (Chinese)','日本語 (Japanese)',
  '한국어 (Korean)','العربية (Arabic)','हिन्दी (Hindi)','Русский (Russian)','Nederlands','Polski','Türkçe','Svenska','Norsk',
  'Dansk','Suomi','Ελληνικά (Greek)','עברית (Hebrew)','ไทย (Thai)','Tiếng Việt','Bahasa Indonesia','Filipino','Українська',
  'Čeština','Magyar','Română','Català','Tagalog'];

// ─── helpers ──────────────────────────────────────────────────────────────────
async function api(path, opts){
  const r = await fetch('/speakup/api/v1'+path, Object.assign({headers:{'Content-Type':'application/json'}}, opts||{}));
  if (r.status === 401){ location.href='/speakup/login'; throw new Error('401'); }
  const d = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(d.error || ('HTTP '+r.status));
  return d;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
let toastTimer;
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),1900); }
async function logout(){ await fetch('/speakup/api/v1/auth/logout',{method:'POST'}); location.href='/speakup/login'; }

// ─── live mic recording (Web Speech API — on-device, no key) ────────────────────
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog=null, recording=false, transcriptBuf='', startTs=0, timerInt=null;
function fmt(s){ const m=Math.floor(s/60), ss=s%60; return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0'); }
function tick(){ document.getElementById('timer').textContent = fmt(Math.floor((Date.now()-startTs)/1000)); }

document.getElementById('orb').addEventListener('click', () => {
  if (!SR){ toast(t('micUnsupported')); return; }
  recording ? stopMic() : startMic();
});
function startMic(){
  transcriptBuf=''; recog = new SR();
  recog.lang = lang==='en' ? 'en-US' : 'es-ES';
  recog.continuous = true; recog.interimResults = true;
  let finals='';
  recog.onresult = (e) => {
    let interim='';
    for (let i=e.resultIndex;i<e.results.length;i++){
      const txt=e.results[i][0].transcript;
      if (e.results[i].isFinal) finals+=txt+' '; else interim+=txt;
    }
    transcriptBuf = finals;
    document.getElementById('recstatus').textContent = (finals+interim).slice(-90) || t('recording');
  };
  recog.onerror = ()=>{};
  recog.onend = ()=>{ if (recording){ try{recog.start();}catch(e){} } };
  recog.start();
  recording=true; startTs=Date.now(); timerInt=setInterval(tick,1000);
  document.getElementById('orb').classList.add('rec');
  document.getElementById('recstatus').textContent = t('recording');
}
async function stopMic(){
  recording=false; clearInterval(timerInt);
  document.getElementById('orb').classList.remove('rec');
  try{ recog.stop(); }catch(e){}
  const dur = Math.floor((Date.now()-startTs)/1000);
  const text = transcriptBuf.trim();
  document.getElementById('timer').textContent='00:00';
  document.getElementById('recstatus').textContent = t('tapToRec');
  if (!text){ toast(t('noTranscript')); return; }
  const title = text.split(/[.!?\n]/)[0].slice(0,60) || 'Grabación';
  const d = await api('/recordings',{method:'POST',body:JSON.stringify({title,source:'mic',text,lang:recog.lang.slice(0,2),duration_sec:dur})});
  toast(t('saved')); await loadLibrary(); openRec(d.recording.id);
}

// ─── meeting capture (getDisplayMedia audio → MediaRecorder → upload) ────────────
let mediaRec=null, chunks=[];
async function startMeeting(){
  if (mediaRec){ mediaRec.stop(); return; }
  try{
    const stream = await navigator.mediaDevices.getDisplayMedia({ video:true, audio:true });
    if (!stream.getAudioTracks().length){ toast('Activa "Compartir audio de la pestaña".'); stream.getTracks().forEach(x=>x.stop()); return; }
    chunks=[]; mediaRec = new MediaRecorder(stream);
    mediaRec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    mediaRec.onstop = async () => {
      stream.getTracks().forEach(x=>x.stop());
      document.getElementById('meetingBtn').textContent = t('recMeeting');
      const blob = new Blob(chunks, { type:'audio/webm' });
      const fd = new FormData(); fd.append('file', blob, 'reunion.webm'); fd.append('title','Reunión '+new Date().toLocaleString());
      toast(t('uploading'));
      const r = await fetch('/speakup/api/v1/recordings/upload',{method:'POST',body:fd});
      const d = await r.json(); await loadLibrary();
      if (d.recording) pollAndOpen(d.recording.id);
      mediaRec=null;
    };
    mediaRec.start();
    document.getElementById('meetingBtn').textContent = '■ '+t('recording');
  }catch(e){ toast(e.message); mediaRec=null; }
}

// ─── upload / import ────────────────────────────────────────────────────────────
async function uploadFile(){
  const f = document.getElementById('file').files[0];
  if (!f){ toast(t('uploadFile')); return; }
  const fd = new FormData(); fd.append('file', f); fd.append('title', f.name);
  toast(t('uploading'));
  const r = await fetch('/speakup/api/v1/recordings/upload',{method:'POST',body:fd});
  const d = await r.json();
  if (!r.ok){ toast(d.error||'Error'); return; }
  document.getElementById('file').value='';
  await loadLibrary(); pollAndOpen(d.recording.id);
}
async function importUrl(){
  const url = document.getElementById('url').value.trim();
  if (!url) return;
  const d = await api('/recordings/import',{method:'POST',body:JSON.stringify({url})});
  document.getElementById('url').value='';
  await loadLibrary(); openRec(d.recording.id);
}
async function pollAndOpen(id){
  for (let i=0;i<40;i++){
    const s = await api('/recordings/'+id+'/status').catch(()=>null);
    if (!s) break;
    if (s.status==='done' || s.status==='error'){ await loadLibrary(); openRec(id); return; }
    await new Promise(r=>setTimeout(r,1500));
  }
  await loadLibrary(); openRec(id);
}

// ─── library ────────────────────────────────────────────────────────────────────
let current=null;
async function loadLibrary(){
  const el = document.getElementById('reclist');
  try{
    const d = await api('/recordings');
    if (!d.recordings.length){ el.innerHTML = '<div class="empty">'+t('empty')+'</div>'; return; }
    el.innerHTML = d.recordings.map(r=>{
      let badge='';
      if (r.status==='processing') badge='<span class="badge processing">'+t('processing')+'</span>';
      else if (r.status==='error') badge='<span class="badge error">error</span>';
      else if (r.is_simulated) badge='<span class="badge sim">'+t('simulated')+'</span>';
      const date = new Date(r.created_at).toLocaleDateString();
      return '<div class="recitem'+(current&&current.recording.id===r.id?' active':'')+'" onclick="openRec('+r.id+')">'+
        '<div class="t">'+esc(r.title)+'</div>'+
        '<div class="m"><span>'+date+'</span><span>·</span><span>'+esc(r.source)+'</span>'+badge+'</div></div>';
    }).join('');
  }catch(e){ el.innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
}

// ─── detail: results + deliverables (transcript at the bottom) ──────────────────
async function openRec(id){
  document.getElementById('mainEmpty').style.display='none';
  const detail = document.getElementById('detail'); detail.style.display='block';
  detail.innerHTML = '<div class="card"><span class="spin"></span> '+t('loading')+'</div>';
  try{
    const d = await api('/recordings/'+id);
    current = d; renderDetail(d); loadLibrary();
    detail.scrollIntoView({behavior:'smooth',block:'start'});
  }catch(e){ detail.innerHTML='<div class="card">'+esc(e.message)+'</div>'; }
}

function renderDetail(d){
  const r = d.recording, tr = d.transcript;
  const text = tr ? tr.text : '';
  const sim = tr && tr.is_simulated;
  const langOpts = LANGS.map(l=>'<option>'+l+'</option>').join('');
  const el = document.getElementById('detail');
  el.innerHTML =
    // header + actions
    '<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start;gap:10px">'+
      '<div style="min-width:0"><div style="font-size:19px;font-weight:700;overflow:hidden;text-overflow:ellipsis">'+esc(r.title)+'</div>'+
      '<div class="muted">'+new Date(r.created_at).toLocaleString()+' · '+esc(r.source)+'</div></div></div>'+
      '<div class="row actions" style="margin-top:12px">'+
        '<a class="btn sec sm" href="/speakup/api/v1/recordings/'+r.id+'/export?format=txt" download>TXT</a>'+
        '<a class="btn sec sm" href="/speakup/api/v1/recordings/'+r.id+'/export?format=md" download>MD</a>'+
        '<button class="btn sec sm" onclick="window.print()">'+t('pdf')+'</button>'+
        '<button class="btn danger sm" onclick="delRec('+r.id+')">'+t('delete')+'</button>'+
      '</div>'+
      (r.status==='processing' ? '<div class="muted" style="margin-top:10px"><span class="spin"></span> '+t('processing')+'</div>' : '')+
      (r.status==='error' ? '<div class="muted" style="margin-top:10px;color:var(--err)">'+esc(r.error||'error')+'</div>' : '')+
    '</div>'+

    (text ?
    // deliverables (results) — the focus, right under record
    '<div class="card">'+
      '<div class="tabs">'+
        '<div class="tab on" onclick="showTab(this,\'gen\')">'+t('generate')+'</div>'+
        '<div class="tab" onclick="showTab(this,\'trn\')">'+t('translate')+'</div>'+
        '<div class="tab" onclick="showTab(this,\'rew\')">'+t('rewrite')+'</div>'+
      '</div>'+
      '<div id="pane-gen">'+
        '<div class="muted" style="margin-bottom:12px">'+t('whatToDo')+'</div>'+
        '<div class="grid">'+
          '<button class="btn sm" onclick="doGenerate('+r.id+',\'minutes\')">'+t('minutes')+'</button>'+
          '<button class="btn sm" onclick="doGenerate('+r.id+',\'details\')">'+t('details')+'</button>'+
          '<button class="btn sm" onclick="doGenerate('+r.id+',\'next_steps\')">'+t('nextSteps')+'</button>'+
          '<button class="btn sm" onclick="doGenerate('+r.id+',\'presentation\')">'+t('presentation')+'</button>'+
        '</div>'+
        '<button class="btn sm block" style="margin-top:8px" onclick="doGenerate('+r.id+',\'project_plan\')">'+t('projectPlan')+'</button>'+
        '<label class="muted" style="display:block;margin-top:16px">'+t('customField')+'</label>'+
        '<textarea id="genCustom" rows="2" placeholder="'+t('customPh')+'" style="margin:8px 0 10px"></textarea>'+
        '<button class="btn sm block" onclick="doGenerateCustom('+r.id+')">'+t('generate')+'</button>'+
        '<div id="genResult">'+renderDocuments(d.documents)+'</div>'+
      '</div>'+
      '<div id="pane-trn" style="display:none">'+
        '<label class="muted">'+t('toLang')+'</label>'+
        '<select id="tlang" style="margin:8px 0 10px">'+langOpts+'</select>'+
        '<button class="btn sm block" onclick="doTranslate('+r.id+')">'+t('translateBtn')+'</button>'+
        '<div id="trnResult">'+renderTranslations(d.translations)+'</div>'+
      '</div>'+
      '<div id="pane-rew" style="display:none">'+
        '<select id="rtone">'+
          '<option value="professional">'+t('professional')+'</option>'+
          '<option value="concise">'+t('concise')+'</option>'+
          '<option value="friendly">'+t('friendly')+'</option>'+
          '<option value="email">'+t('email')+'</option>'+
          '<option value="grammar">'+t('grammar')+'</option>'+
          '<option value="bullets">'+t('bulletize')+'</option>'+
        '</select>'+
        '<input id="rcustom" placeholder="'+t('custom')+'" style="margin:8px 0 10px">'+
        '<button class="btn sm block" onclick="doRewrite('+r.id+')">'+t('rewriteBtn')+'</button>'+
        '<div id="rewResult">'+renderEdits(d.edits)+'</div>'+
      '</div>'+
    '</div>'+
    // transcript — moved to the bottom, collapsed
    '<div class="card"><details class="sec-collapse">'+
      '<summary>'+t('transcript')+(sim?' · '+t('simulated'):'')+'</summary>'+
      '<div style="margin-top:12px"><button class="btn sec sm" onclick="copyText(\'tr'+r.id+'\')">'+t('copy')+'</button></div>'+
      '<div class="transcript" id="tr'+r.id+'" style="margin-top:10px">'+esc(text)+'</div>'+
    '</details></div>'
    : '<div class="card"><div class="muted">'+t('noTranscript')+'</div></div>');
}
function showTab(tab,which){
  tab.parentNode.querySelectorAll('.tab').forEach(x=>x.classList.remove('on')); tab.classList.add('on');
  ['gen','trn','rew'].forEach(p=>{ const el=document.getElementById('pane-'+p); if(el) el.style.display = p===which?'block':'none'; });
}
// minimal markdown -> HTML
function mdToHtml(md){
  const lines = String(md||'').split('\n'); let html='', inUl=false, inOl=false;
  const closeLists=()=>{ if(inUl){html+='</ul>';inUl=false;} if(inOl){html+='</ol>';inOl=false;} };
  const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>');
  for(let raw of lines){
    const l=raw.replace(/\s+$/,''); let m;
    if((m=l.match(/^(#{1,4})\s+(.+)$/))){ closeLists(); const n=m[1].length; html+='<h'+(n+2)+'>'+inline(m[2])+'</h'+(n+2)+'>'; }
    else if((m=l.match(/^\s*[-*]\s+(.+)$/))){ if(!inUl){closeLists();html+='<ul>';inUl=true;} html+='<li>'+inline(m[1])+'</li>'; }
    else if((m=l.match(/^\s*\d+\.\s+(.+)$/))){ if(!inOl){closeLists();html+='<ol>';inOl=true;} html+='<li>'+inline(m[1])+'</li>'; }
    else if(l.trim()===''){ closeLists(); }
    else { closeLists(); html+='<p>'+inline(l)+'</p>'; }
  }
  closeLists(); return html;
}
function docLabel(x){ const map={minutes:'minutes',details:'details',next_steps:'nextSteps',presentation:'presentation',project_plan:'projectPlan'};
  if(x.kind==='custom') return esc(x.title || x.prompt || t('customLabel'));
  return t(map[x.kind]||x.kind); }
window.__docs = {};
function renderDocuments(list){
  if(!list||!list.length) return '';
  return list.map(x=>{ window.__docs[x.id]=x;
    return '<div class="result"><div class="row" style="justify-content:space-between;align-items:center">'+
      '<h4 style="margin:0">'+docLabel(x)+'</h4>'+
      '<div class="row"><button class="btn sec sm" onclick="copyText(\'doc'+x.id+'\')">'+t('copy')+'</button>'+
      '<button class="btn sec sm" onclick="downloadDoc('+x.id+')">'+t('download')+'</button></div></div>'+
      '<div id="doc'+x.id+'" class="mdbody">'+mdToHtml(x.content)+'</div></div>';
  }).join('');
}
function downloadDoc(id){ const d=window.__docs[id]; if(!d) return;
  const blob=new Blob([d.content],{type:'text/markdown'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=(d.title||'speakup').replace(/[^a-z0-9]+/gi,'-').slice(0,50)+'.md';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
function renderTranslations(list){ if(!list||!list.length) return '';
  return list.slice(0,3).map(x=>'<div class="result"><h4>'+esc(x.target_lang)+'</h4>'+esc(x.text)+'</div>').join(''); }
function renderEdits(list){ if(!list||!list.length) return '';
  return list.slice(0,4).map(x=>'<div class="result"><h4>'+esc(x.kind)+'</h4>'+esc(x.output_text)+'</div>').join(''); }
function copyText(id){ const el=document.getElementById(id); navigator.clipboard.writeText(el.innerText).then(()=>toast(t('copied'))); }

async function doGenerate(id,type,instruction){
  const box=document.getElementById('genResult'); const prev=box.innerHTML;
  box.innerHTML='<div class="result"><span class="spin"></span> '+t('generating')+'</div>'+prev;
  try{ await api('/recordings/'+id+'/generate',{method:'POST',body:JSON.stringify({type,lang,instruction:instruction||undefined})});
    const full=await api('/recordings/'+id); current=full; box.innerHTML=renderDocuments(full.documents);
    if(instruction){ const f=document.getElementById('genCustom'); if(f) f.value=''; }
  }catch(e){ box.innerHTML='<div class="result">'+esc(e.message)+'</div>'+prev; }
}
function doGenerateCustom(id){
  const f=document.getElementById('genCustom'); const instr=(f?f.value:'').trim();
  if(!instr){ toast(t('writeInstr')); return; }
  doGenerate(id,'custom',instr);
}
async function doTranslate(id){
  const target=document.getElementById('tlang').value;
  const box=document.getElementById('trnResult'); box.innerHTML='<div class="result"><span class="spin"></span> '+t('processing')+'</div>';
  try{ const d=await api('/translate',{method:'POST',body:JSON.stringify({recording_id:id,target_lang:target})}); box.innerHTML=renderTranslations([d.translation]); }
  catch(e){ box.innerHTML='<div class="result">'+esc(e.message)+'</div>'; }
}
async function doRewrite(id){
  const tone=document.getElementById('rtone').value, custom=document.getElementById('rcustom').value.trim();
  const box=document.getElementById('rewResult'); box.innerHTML='<div class="result"><span class="spin"></span> '+t('processing')+'</div>';
  try{ const d=await api('/rewrite',{method:'POST',body:JSON.stringify({recording_id:id,tone,custom_prompt:custom})}); box.innerHTML=renderEdits([d.edit]); }
  catch(e){ box.innerHTML='<div class="result">'+esc(e.message)+'</div>'; }
}
async function delRec(id){
  if (!confirm(t('confirmDel'))) return;
  await api('/recordings/'+id,{method:'DELETE'});
  current=null; document.getElementById('detail').style.display='none';
  document.getElementById('mainEmpty').style.display='block'; toast(t('deleted')); loadLibrary();
}

// ─── boot ────────────────────────────────────────────────────────────────────────
(function(){
  setLang(lang);
  if (!SR){ document.getElementById('recstatus').textContent = t('micUnsupported'); }
  loadLibrary();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/speakup/sw.js').catch(()=>{});
})();
</script>
