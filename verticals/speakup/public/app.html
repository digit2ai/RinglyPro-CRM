<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>SpeakUp — AI Factory</title>
<link rel="icon" href="/speakup/favicon.svg">
<link rel="manifest" href="/speakup/manifest.webmanifest">
<link rel="apple-touch-icon" href="/speakup/apple-touch-icon.png">
<link rel="stylesheet" href="/speakup/theme.css?v=1">
<meta name="theme-color" content="#faf9f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  /* One window: the work on top, the instruction box at the bottom. */
  body{display:flex;flex-direction:column;overflow:hidden}
  main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:11px 14px 0}
  #out{flex:1 1 auto;min-height:0}
  footer{flex:0 0 auto;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);background:var(--paper)}
  #cmd{height:11vh;min-height:58px;max-height:30vh}
  /* The plan the owner reads before typing "approved" — paper, not terminal. */
  #plan{flex:0 0 auto;max-height:44vh;overflow:auto;margin-bottom:9px;display:none}
  #plan .planhd{display:flex;align-items:center;gap:9px;margin-bottom:7px;flex-wrap:wrap}
  #plan .planhd h2{margin:0}
  #plan pre{margin:0;font-family:var(--mono);font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  #plan .rev{background:var(--raised);border-left:3px solid var(--accent);padding:7px 10px;margin:7px 0;border-radius:0 8px 8px 0;font-size:13.5px}
  @media(max-width:560px){ main{padding-left:12px;padding-right:12px} footer{padding-left:12px;padding-right:12px} }
</style>
</head>
<body>
<header class="top">
  <img src="/speakup/favicon.svg" alt="">
  <span class="brand">SpeakUp</span>
  <nav class="tabs">
    <a class="tab" href="/speakup/meetings" id="tabMeet">Reuniones</a>
    <a class="tab on" href="/speakup/" id="tabFac">Fábrica</a>
  </nav>
  <span class="where" id="ctx">digit2ai/RinglyPro-CRM</span>
  <button class="lnk" id="langBtn">EN</button>
  <button class="lnk" id="outBtn">Salir</button>
</header>

<main>
  <div class="bar" id="bar"></div>
  <section class="card" id="plan" aria-live="polite"></section>
  <div id="out" class="ink"></div>
</main>

<footer>
  <div class="box">
    <div id="shots" class="shots"></div>
    <textarea id="cmd" spellcheck="false" placeholder="Escribe, pega una captura o dicta la instrucción…"></textarea>
    <div class="boxrow">
      <button class="icon" id="mic" aria-label="Dictar" title="Dictar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
      </button>
      <span class="stat" id="stat"></span>
      <button class="icon send" id="send" aria-label="Enviar" title="Enviar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
      </button>
    </div>
  </div>
</footer>

<script src="/speakup/console.js?v=5"></script>
</body>
</html>
