<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>AutoDev — Reuniones</title>
<link rel="icon" href="/speakup/favicon.svg">
<link rel="manifest" href="/speakup/manifest.webmanifest">
<link rel="apple-touch-icon" href="/speakup/apple-touch-icon.png">
<link rel="stylesheet" href="/speakup/theme.css?v=5">
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  /* Only what is specific to this screen. Everything else is theme.css. */
  main{max-width:720px;margin:0 auto;padding:12px 14px calc(16px + env(safe-area-inset-bottom))}
  section.card{margin-bottom:12px}
  .rechd{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .clock{font-family:var(--mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.5px}
  .dot{width:11px;height:11px;border-radius:50%;background:var(--line-strong);flex:0 0 11px}
  .dot.live{background:#c8412a;animation:beat 1.3s ease-in-out infinite}
  .dot.hold{background:var(--warn)}
  .ctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .ctl .btn{flex:1 1 auto;min-width:120px}
  .live{white-space:pre-wrap;word-break:break-word;background:var(--raised);border:1px solid var(--line);
    border-radius:10px;padding:11px 12px;font-size:15px;line-height:1.6;max-height:44vh;overflow:auto}
  .live.empty{color:var(--faint)}
  textarea.edit{width:100%;min-height:150px;max-height:50vh;border:1px solid var(--line-strong);border-radius:10px;
    padding:11px 12px;font:inherit;font-size:16px;line-height:1.55;background:var(--surface);color:var(--text);resize:vertical}
  textarea.edit:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
  .grp{margin-top:14px}
  .grp > h3{display:flex;align-items:baseline;gap:8px;margin:0 0 6px}
  .grp .count{font-size:12.5px;color:var(--faint);font-family:var(--sans);font-weight:400}
  .row{display:flex;align-items:flex-start;gap:11px;padding:10px 2px;border-top:1px solid var(--line);min-height:44px}
  .row:first-of-type{border-top:0}
  .row input[type=checkbox]{width:24px;height:24px;flex:0 0 24px;margin:8px 0 0;accent-color:var(--accent)}
  .row .body{flex:1 1 auto;min-width:0}
  .row .body .txt{font-size:14.5px;line-height:1.5;word-break:break-word}
  .row .body .tiny{margin-top:3px;word-break:break-word}
  .row.on{background:var(--accent-wash);border-radius:8px}
  .kind{display:inline-block;font-size:11px;letter-spacing:.3px;text-transform:uppercase;color:var(--faint);
    border:1px solid var(--line-strong);border-radius:999px;padding:1px 7px;margin-right:6px;vertical-align:1px}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .acts .btn{flex:1 1 auto;min-width:150px}
  .meets{display:flex;flex-direction:column;gap:0}
  .meet{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;
    color:inherit;font:inherit;padding:11px 2px;min-height:44px;cursor:pointer}
  .meet:first-child{border-top:0}
  .meet:hover{background:var(--raised)}
  .meet.on{background:var(--accent-wash)}
  .meet .t{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .askrow{display:flex;gap:9px;align-items:center;padding:3px 9px 9px}
  #ask{height:56px;max-height:30vh}
  #askOut{margin-top:10px;white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.55}
  .sp{display:inline-block;width:13px;height:13px;border:2px solid var(--line-strong);border-top-color:var(--accent);
    border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  #ov{position:fixed;inset:0;background:rgba(31,30,29,.55);z-index:60;display:none;align-items:center;justify-content:center;padding:24px}
  #ov.on{display:flex}
  #ov .card{max-width:330px;width:100%;text-align:center}
  .prog{height:8px;background:var(--raised);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:13px 0 7px}
  #ovFill{height:100%;width:0;background:var(--accent);transition:width .25s}
  /* On a phone or tablet every control in the header is a finger target too. theme.css
     sizes .lnk and .tab for a mouse; this raises them only where the input is a thumb,
     so the two tabs of the app still look identical on a desktop. */
  @media(max-width:820px){
    .top .lnk{min-height:44px;min-width:44px;justify-content:center}
    .top .tab{min-height:44px;padding:0 11px}
  }
  @media(max-width:560px){
    main{padding-left:12px;padding-right:12px}
    .ctl .btn{min-width:0;flex:1 1 46%}
    .clock{font-size:23px}
  }
</style>
</head>
<body>
<header class="top">
  <img src="/speakup/favicon.svg" alt="">
  <img class="wordmark" src="/speakup/wordmark.svg?v=1" alt="Digit2AI">
  <span class="product">AutoDev</span>
  <nav class="tabs">
    <a class="tab on" href="/speakup/meetings" id="tabMeet">Reuniones</a>
    <a class="tab" href="/speakup/" id="tabFac">Fábrica</a>
  </nav>
  <div class="hdrmenu" id="hdrMenu">
    <span class="where" id="ctx"></span>
    <button class="lnk" id="langBtn">EN</button>
    <button class="lnk" id="outBtn">Salir</button>
  </div>
  <button class="burger" id="burger" aria-label="Menú" aria-expanded="false" aria-controls="hdrMenu"><span></span><span></span><span></span></button>
</header>

<main>
  <!-- a) the record control -->
  <section class="card" id="recCard">
    <div class="rechd">
      <span class="dot" id="dot"></span>
      <span class="clock" id="clock">00:00</span>
      <span class="stat" id="stat"></span>
    </div>
    <div class="ctl">
      <button class="btn primary" id="startBtn">Grabar reunión</button>
      <button class="btn" id="pauseBtn" hidden>Pausar</button>
      <button class="btn" id="stopBtn" hidden>Detener</button>
    </div>
    <p class="tiny" id="privacy" style="margin:10px 0 0">Se transcribe en tu dispositivo. El audio no sale de tu equipo.</p>
    <div class="notice" id="unsupported" hidden></div>
  </section>

  <!-- b) the transcript: live while recording, editable once stopped -->
  <section class="card" id="trCard" hidden>
    <h2 id="trTitle">Transcripción</h2>
    <div class="live empty" id="live"></div>
    <textarea class="edit" id="trEdit" hidden spellcheck="false"></textarea>
    <div class="acts" id="trActs" hidden>
      <button class="btn" id="saveTrBtn">Guardar transcripción</button>
      <button class="btn primary" id="readBtn">Leer la reunión</button>
    </div>
  </section>

  <!-- c) + d) the checklist -->
  <section class="card" id="intelCard" hidden>
    <h2 id="intelTitle">Lo que se dijo</h2>
    <p class="tiny" id="intelHint"></p>
    <div id="intelBody"></div>
    <!-- e) + f) -->
    <div class="acts">
      <button class="btn primary" id="promptBtn">Construir el prompt</button>
      <button class="btn" id="sendBtn" hidden>Enviar a la Fábrica</button>
    </div>
    <div class="notice" id="promptNote" hidden></div>
    <div class="ink" id="promptOut" hidden style="margin-top:10px;max-height:46vh"></div>
  </section>

  <!-- g) past meetings -->
  <section class="card" id="listCard">
    <h2 id="listTitle">Reuniones</h2>
    <div class="meets" id="meets"><div class="tiny" id="listState">Cargando…</div></div>
  </section>

  <!-- h) the ask box -->
  <section id="askCard">
    <div class="box">
      <textarea id="ask" spellcheck="false" placeholder="Pregunta: acta, resumen, qué tengo que hacer…"></textarea>
      <div class="askrow">
        <span class="stat" id="askStat"></span>
        <button class="icon send" id="askSend" aria-label="Preguntar" title="Preguntar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
        </button>
      </div>
    </div>
    <div id="askOut"></div>
    <p class="tiny" id="askNote" style="margin:8px 0 0">Solo lectura: aquí no se ejecuta nada ni se toca código.</p>
  </section>
</main>

<!-- model download / file transcription progress -->
<div id="ov" role="dialog" aria-modal="true">
  <div class="card">
    <div id="ovMsg" style="font-weight:600"></div>
    <div class="prog"><div id="ovFill"></div></div>
    <div class="tiny" id="ovPct"></div>
    <div class="tiny" id="ovNote" style="margin-top:6px">Se transcribe en tu dispositivo. El audio no sale de tu equipo.</div>
  </div>
</div>

<script src="/speakup/record-engine.js?v=1"></script>
<script src="/speakup/meetings.js?v=1"></script>
<script src="/speakup/header-menu.js?v=1"></script>
</body>
</html>
