<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>AutoDev — Reuniones</title>
<link rel="icon" href="/speakup/favicon.svg">
<link rel="manifest" href="/speakup/manifest.webmanifest">
<link rel="apple-touch-icon" href="/speakup/apple-touch-icon.png">
<link rel="stylesheet" href="/speakup/theme.css?v=10">
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  /* One window, like the Factory: the meeting and its conversation on top, the input pinned
     to the bottom. On a phone the conversation is the whole screen. */
  body{display:flex;flex-direction:column;overflow:hidden}
  main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:10px 14px 0;max-width:860px;width:100%;margin:0 auto}
  footer{flex:0 0 auto;padding:8px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper)}
  footer .inner{max-width:860px;margin:0 auto}
  section.card{margin-bottom:10px;flex:0 0 auto}
  .rechd{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .clock{font-family:var(--mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
  .dot{width:11px;height:11px;border-radius:50%;background:var(--line-strong);flex:0 0 11px}
  .dot.live{background:#dc2626;animation:beat 1.3s ease-in-out infinite}
  .dot.hold{background:var(--warn)}
  .ctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .ctl .btn{flex:1 1 auto;min-width:120px}
  /* the meeting on screen */
  .mhd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .mhd .ttl{flex:1 1 auto;min-width:0}
  .mhd h2{margin:0;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .live{white-space:pre-wrap;word-break:break-word;background:var(--raised);border:1px solid var(--line-strong);
    border-radius:10px;padding:10px 12px;font-size:14.5px;line-height:1.6;max-height:34vh;overflow:auto;margin-top:10px}
  .live.empty{color:var(--faint)}
  textarea.edit{width:100%;min-height:130px;max-height:40vh;margin-top:10px;border:1px solid var(--line-strong);border-radius:10px;
    padding:10px 12px;font:inherit;font-size:16px;line-height:1.55;background:var(--surface-solid);color:var(--text);resize:vertical}
  textarea.edit:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  /* the conversation */
  #thread{flex:1 1 auto;min-height:0;overflow:auto;padding:4px 0 10px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:92%;border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .msg.user{align-self:flex-end;background:var(--accent-solid);color:#fff}
  .msg.assistant{align-self:flex-start;background:var(--surface);color:var(--panel-text);border:1px solid var(--line);
    --text:var(--panel-text);--muted:var(--panel-muted);--faint:var(--panel-faint)}
  .msg.transfer{border-color:#86efac;background:#dcfce7;color:#14532d}
  .msg img.att{display:block;max-width:220px;max-height:180px;border-radius:8px;margin-bottom:6px}
  .msg .tag{display:inline-block;font-size:11.5px;letter-spacing:.2px;border:1px solid var(--line-strong);border-radius:999px;
    padding:1px 8px;margin-bottom:6px;color:var(--panel-muted);white-space:normal}
  .msg .tag.off{border-color:#fcd34d;background:#fef3c7;color:#78350f}
  .mact{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;white-space:normal}
  .mact .btn{min-height:36px;font-size:13px;padding:0 11px}
  .mact a.btn{text-decoration:none}
  .empty-note{color:var(--muted);font-size:14px;text-align:center;margin:auto;padding:24px 10px;max-width:420px}
  /* starter chips: optional, above the input; the input accepts anything */
  #chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 8px;scrollbar-width:none}
  #chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);
    color:var(--panel-text);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
  .chip:hover{background:var(--surface-solid)}
  .chip:disabled{opacity:.45;cursor:default}
  #msg{height:9vh;min-height:52px;max-height:28vh}
  #ov{position:fixed;inset:0;background:rgba(17,24,39,.6);z-index:60;display:none;align-items:center;justify-content:center;padding:24px}
  #ov.on{display:flex}
  #ov .card{max-width:330px;width:100%;text-align:center}
  .prog{height:8px;background:var(--raised);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:13px 0 7px}
  #ovFill{height:100%;width:0;background:var(--accent);transition:width .25s}
  @media(max-width:820px){
    .top .lnk{min-height:44px;min-width:44px;justify-content:center}
    .top .tab{min-height:44px;padding:0 11px}
    .chip{min-height:44px;font-size:14px}
    .mact .btn{min-height:44px}
    .mhd .btn{min-height:44px;min-width:44px}
  }
  @media(max-width:560px){
    main,footer{padding-left:12px;padding-right:12px}
    .ctl .btn{min-width:0;flex:1 1 46%}
    .msg{max-width:100%}
  }
</style>
</head>
<body>
<header class="top">
  <img src="/speakup/favicon.svg" alt="">
  <img class="wordmark" src="/speakup/wordmark.svg?v=1" alt="Digit2AI">
  <span class="product">AutoDev</span>
  <nav class="tabs">
    <a class="tab on" href="/speakup/meetings" id="tabMeet">Reuniones</a>
    <a class="tab" href="/speakup/" id="tabFac">Fábrica</a>
    <a class="tab" href="/speakup/claude-code" id="tabCC">Claude Code</a>
  </nav>
  <div class="hdrmenu" id="hdrMenu">
    <span class="where" id="ctx"></span>
    <a class="lnk" href="/speakup/history" id="navHistory">Historial</a>
    <a class="lnk" href="/speakup/meetings?new=1" id="navNew">Nueva reunión</a>
    <a class="lnk" href="/speakup/settings" id="navSettings">Ajustes</a>
    <button class="lnk" id="langBtn">EN</button>
    <button class="lnk" id="outBtn">Salir</button>
  </div>
  <button class="burger" id="burger" aria-label="Menú" aria-expanded="false" aria-controls="hdrMenu"><span></span><span></span><span></span></button>
</header>

<main>
  <!-- a new meeting: the record control. Shown when no meeting is open, or while recording. -->
  <section class="card" id="recCard" hidden>
    <div class="rechd">
      <span class="dot" id="dot"></span>
      <span class="clock" id="clock">00:00</span>
      <span class="stat" id="stat"></span>
    </div>
    <div class="ctl">
      <button class="btn primary" id="startBtn">Grabar reunión</button>
      <button class="btn" id="pauseBtn" hidden>Pausar</button>
      <button class="btn" id="stopBtn" hidden>Detener</button>
    </div>
    <p class="tiny" id="privacy" style="margin:10px 0 0">Se transcribe en tu dispositivo. El audio no sale de tu equipo.</p>
    <div class="notice" id="unsupported" hidden></div>
    <div class="live empty" id="live" hidden></div>
  </section>

  <!-- the meeting on screen: its header, and the transcript on demand -->
  <section class="card" id="meetCard" hidden>
    <div class="mhd">
      <div class="ttl"><h2 id="mTitle"></h2><div class="tiny" id="mDate"></div></div>
      <button class="btn small" id="clearBtn" hidden>Limpiar</button>
      <button class="btn small" id="trToggle">Transcripción</button>
      <button class="btn small" id="closeBtn">Cerrar</button>
    </div>
    <div id="trPanel" hidden>
      <textarea class="edit" id="trEdit" spellcheck="false"></textarea>
      <div class="acts"><button class="btn small" id="saveTrBtn">Guardar transcripción</button><span class="stat" id="trStat"></span></div>
    </div>
  </section>

  <!-- the conversation about it -->
  <div id="thread" aria-live="polite"></div>
</main>

<footer>
  <div class="inner">
    <div id="chips"></div>
    <div class="box">
      <div id="shots" class="shots"></div>
      <textarea id="msg" spellcheck="false" placeholder="Pregunta lo que quieras sobre la reunión…"></textarea>
      <div class="boxrow">
        <button class="icon" id="mic" aria-label="Dictar" title="Dictar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
        </button>
        <span class="stat" id="msgStat"></span>
        <button class="icon send" id="send" aria-label="Enviar" title="Enviar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
        </button>
      </div>
    </div>
  </div>
</footer>

<!-- model download / file transcription progress -->
<div id="ov" role="dialog" aria-modal="true">
  <div class="card">
    <div id="ovMsg" style="font-weight:600"></div>
    <div class="prog"><div id="ovFill"></div></div>
    <div class="tiny" id="ovPct"></div>
    <div class="tiny" id="ovNote" style="margin-top:6px">Se transcribe en tu dispositivo. El audio no sale de tu equipo.</div>
  </div>
</div>

<script src="/speakup/transcript-clean.js?v=1"></script>
<script src="/speakup/record-engine.js?v=2"></script>
<script src="/speakup/meetings.js?v=6"></script>
<script src="/speakup/header-menu.js?v=2"></script>
<script src="/speakup/install.js?v=1" defer></script>
</body>
</html>
