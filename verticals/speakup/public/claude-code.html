<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Claude Code — AutoDev</title>
<link rel="icon" href="/speakup/favicon.svg">
<link rel="manifest" href="/speakup/manifest.webmanifest">
<link rel="apple-touch-icon" href="/speakup/apple-touch-icon.png">
<link rel="stylesheet" href="/speakup/theme.css?v=10">
<link rel="stylesheet" href="/speakup/claude-code.css?v=4">
<meta name="theme-color" content="#1f2937">
</head>
<body>
<header class="top">
  <img src="/speakup/favicon.svg" alt="">
  <img class="wordmark" src="/speakup/wordmark.svg?v=1" alt="Digit2AI">
  <span class="product">AutoDev</span>
  <nav class="tabs">
    <a class="tab" href="/speakup/meetings" id="tabMeet">Reuniones</a>
    <a class="tab on" href="/speakup/claude-code" id="tabCC">Builder</a>
  </nav>
  <div class="hdrmenu" id="hdrMenu">
    <a class="lnk" href="/speakup/history" id="navHistory">Historial</a>
    <a class="lnk" href="/speakup/meetings?new=1" id="navNew">Nueva reunión</a>
    <a class="lnk" href="/speakup/settings" id="navSettings">Ajustes</a>
    <button class="lnk" id="langBtn">EN</button>
    <button class="lnk" id="outBtn">Salir</button>
  </div>
  <button class="burger" id="burger" aria-label="Menú" aria-expanded="false" aria-controls="hdrMenu"><span></span><span></span><span></span></button>
</header>

<main>
  <p class="notice" id="ccNotice" hidden></p>

  <!-- ONE QUIET LINE, the way the desktop app shows its folder in the corner. The repository
       picker is behind it and only appears when you ask for it: a dropdown, a branch box, a Sync
       button and a badge above every conversation was four controls for a choice made once. -->
  <div class="bar1">
    <button class="repoBtn" id="repoBtn" type="button" title="Repositorio"><span id="repoTxt"></span></button>
    <a class="btn small" id="prLink" target="_blank" rel="noopener" hidden>Pull request</a>
    <button class="btn small primary" id="mergeBtn" type="button" hidden>Merge</button>
    <button class="btn small" id="newBtn2" type="button" hidden>Nueva</button>
  </div>
  <div class="setup" id="setup" hidden>
    <select id="repo" class="sel" aria-label="Repositorio"></select>
    <input id="branch" class="inp branch" type="text" value="main" aria-label="Rama base">
    <button class="btn small" id="syncBtn" type="button">Sync</button>
    <span class="chip" id="pushChip" hidden></span>
  </div>

  <div id="thread" aria-live="polite"></div>
</main>

<footer>
  <div class="inner">
    <div class="box">
      <textarea id="cmsg" spellcheck="false" placeholder="Dile qué construir, o pregunta algo sobre el código…"></textarea>
      <div class="boxrow">
        <button class="icon" id="mic" aria-label="Dictar" title="Dictar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
        </button>
        <span class="stat" id="micStat"></span>
        <span class="workw" id="workw" aria-hidden="true"></span>
        <button class="icon send" id="send" aria-label="Enviar" title="Enviar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
        </button>
      </div>
    </div>
  </div>
</footer>

<script src="/speakup/claude-code.js?v=6"></script>
<script src="/speakup/header-menu.js?v=2"></script>
<script src="/speakup/install.js?v=1" defer></script>
</body>
</html>
