<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#14213d">
<title>NeoHaul · Operación</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#14213d;--txt:#1f2937;--mut:#5b6472;--line:#dfe3ea;--acc:#c2410c;--acc-d:#9a3412;--ok:#047857;--warn:#b45309;--bad:#b91c1c;--soft:#fff4ec}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc-d)}
button,input,select,textarea{font:inherit}
input,select,textarea{font-size:16px;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--txt)}
textarea{min-height:70px}
label{display:block;font-size:13px;color:var(--mut);margin:0 0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;text-decoration:none;font-weight:600}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{background:var(--acc-d)}
.btn.wa{background:#0f7b4f;border-color:#0f7b4f;color:#fff}
.btn.small{min-height:34px;padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
header.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
header.top .brand{font-weight:800;letter-spacing:.3px}
header.top .brand small{font-weight:500;opacity:.75;margin-left:6px}
header.top .sp{flex:1}
.burger{display:none;background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;width:44px;height:44px;cursor:pointer;font-size:20px}
.layout{display:flex;min-height:calc(100vh - 60px)}
nav.side{width:220px;flex:0 0 220px;background:#fff;border-right:1px solid var(--line);padding:10px 8px}
nav.side a{display:block;padding:10px 12px;border-radius:8px;color:var(--txt);text-decoration:none;font-weight:600;min-height:44px}
nav.side a.on{background:var(--soft);color:var(--acc-d)}
nav.side .grp{font-size:11px;text-transform:uppercase;color:var(--mut);letter-spacing:.6px;margin:12px 12px 4px}
main{flex:1;min-width:0;padding:18px;max-width:1200px}
h1{font-size:22px;margin:0 0 4px;color:var(--ink)}
h2{font-size:17px;margin:18px 0 8px;color:var(--ink)}
.sub{color:var(--mut);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.kpi .v{font-size:22px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--mut)}
.kpi .n{font-size:12px;color:var(--mut);margin-top:2px}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));align-items:end}
.form .wide{grid-column:1/-1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl{overflow-x:auto}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;background:#eef1f5;color:var(--mut)}
.pill.ok{background:#e6f6ef;color:var(--ok)}.pill.warn{background:#fdf3e2;color:var(--warn)}.pill.bad{background:#fdeaea;color:var(--bad)}.pill.acc{background:var(--soft);color:var(--acc-d)}
.note{background:#fffbea;border:1px solid #f1e3a6;border-radius:8px;padding:8px 10px;font-size:13px;color:#5c4a0d;margin:8px 0}
.err{color:var(--bad);font-size:14px;margin-top:6px}
.okmsg{color:var(--ok);font-size:14px;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.modal .box{background:#fff;border-radius:12px;max-width:760px;width:100%;padding:18px}
.login{max-width:380px;margin:10vh auto;padding:0 16px}
.ticket-img{max-width:100%;max-height:340px;border-radius:8px;border:1px solid var(--line)}
.muted{color:var(--mut)}
.right{text-align:right}
[hidden]{display:none!important}
@media (max-width:820px){
  .burger{display:inline-flex;align-items:center;justify-content:center}
  nav.side{position:fixed;top:60px;left:0;bottom:0;z-index:30;transform:translateX(-105%);transition:transform .2s;box-shadow:0 10px 30px rgba(0,0,0,.2);overflow:auto}
  nav.side.open{transform:none}
  main{padding:14px}
  table.cards thead{display:none}
  table.cards tr{display:block;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:6px 8px;background:#fff}
  table.cards td{display:flex;justify-content:space-between;gap:10px;border:0;padding:4px 0;text-align:right}
  table.cards td::before{content:attr(data-l);color:var(--mut);font-size:12px;text-align:left}
  table.cards td.n{white-space:normal}
}
@media print{header.top,nav.side,.noprint{display:none!important}main{padding:0}.card{border:0}}
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js?v=1" defer></script>
</body>
</html>
