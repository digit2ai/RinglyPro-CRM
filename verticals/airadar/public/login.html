<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Radar — Sign in</title>
<link rel="icon" href="/airadar/favicon.svg">
<link rel="manifest" href="/airadar/manifest.webmanifest">
<link rel="apple-touch-icon" href="/airadar/apple-touch-icon.png">
<meta name="theme-color" content="#00c2a8">
<style>
  :root{--bg:#070b14;--card:#101825;--line:#1e2b3f;--txt:#e8f1fa;--mut:#8496ad;--acc:#4df0d0;--acc2:#00a3c4}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1100px 600px at 50% -10%,#05303a 0%,var(--bg) 58%);color:var(--txt);
    display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:400px;background:linear-gradient(180deg,var(--card),#0a1120);
    border:1px solid var(--line);border-radius:20px;padding:34px 28px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .brand img{width:46px;height:46px}
  .brand h1{font-size:24px;margin:0;letter-spacing:-.5px}
  .tag{color:var(--mut);font-size:13px;margin:0 0 26px;line-height:1.5}
  label{display:block;font-size:13px;color:var(--mut);margin:16px 0 6px}
  input{width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--line);background:#0a111e;
    color:var(--txt);font-size:15px;outline:none}
  input:focus{border-color:var(--acc)}
  button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:11px;cursor:pointer;
    background:linear-gradient(90deg,var(--acc),var(--acc2));color:#03231f;font-size:16px;font-weight:700}
  button:disabled{opacity:.6;cursor:default}
  .err{margin-top:16px;color:#ff9c9c;font-size:14px;min-height:18px}
  .foot{margin-top:22px;color:var(--mut);font-size:12px;text-align:center;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><img src="/airadar/favicon.svg" alt=""><h1>AI Radar</h1></div>
  <p class="tag">Every AI product you spot, captured from the share sheet and kept in one searchable log.</p>
  <form id="f">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button id="btn" type="submit">Sign in</button>
    <div class="err" id="err"></div>
  </form>
  <p class="foot">Private tool. Invite only.</p>
</div>
<script>
  function nextUrl(){
    var p = new URLSearchParams(location.search).get('next');
    if (p && p.indexOf('/airadar') === 0) return p;
    return '/airadar/';
  }
  document.getElementById('f').addEventListener('submit', async function(e){
    e.preventDefault();
    var btn = document.getElementById('btn'), err = document.getElementById('err');
    err.textContent = ''; btn.disabled = true;
    try {
      var r = await fetch('/airadar/api/v1/auth/login', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
      });
      var d = await r.json();
      if (!r.ok) { err.textContent = d.error || 'Error'; btn.disabled = false; return; }
      location.href = nextUrl();
    } catch (ex) { err.textContent = ex.message; btn.disabled = false; }
  });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/airadar/sw.js').catch(function(){});
</script>
</body>
</html>
