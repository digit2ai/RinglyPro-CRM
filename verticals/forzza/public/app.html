<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#012a72">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Forzza · Capital</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#0b1630;--txt:#1f2937;--mut:#4b5563;--line:#e2e6ee;--acc:#012a72;--acc-d:#011d52;--navy:#012a72;--lime:#012a72;--lime-d:#012a72;--lime-t:#012a72;--rep:#012a72;--ok:#047857;--warn:#b45309;--bad:#b91c1c;--soft:#e8eef9;--soft-lime:#e8eef9}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc-d)}
button,input,select,textarea{font:inherit}
input,select,textarea{font-size:16px;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--txt)}
textarea{min-height:70px}
label{display:block;font-size:13px;color:var(--mut);margin:0 0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;text-decoration:none;font-weight:600}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{background:var(--acc-d)}
.btn.wa{background:#0f7b4f;border-color:#0f7b4f;color:#fff}
.btn.small{min-height:34px;padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
header.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;border-bottom:0;display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
header.top .brand{font-weight:600;letter-spacing:.2px;display:flex;align-items:center;gap:10px;color:#fff}
header.top .brand img{height:30px;width:auto;display:block}

.sicar-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#fff;background:transparent;border:1px solid rgba(255,255,255,.55);border-radius:99px;padding:3px 10px}
header.top .brand small{font-weight:500;opacity:.85;padding-left:10px;border-left:1px solid rgba(255,255,255,.4)}
header.top .sp{flex:1}
.burger{display:none;background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;width:44px;height:44px;cursor:pointer;font-size:20px}
.layout{display:flex;min-height:calc(100vh - 60px)}
nav.side{width:220px;flex:0 0 220px;background:#fff;border-right:1px solid var(--line);padding:10px 8px}
nav.side a{display:block;padding:10px 12px;border-radius:8px;color:var(--txt);text-decoration:none;font-weight:400;min-height:44px}
nav.side a.on{background:var(--soft);color:var(--navy);font-weight:600;box-shadow:inset 3px 0 0 var(--navy)}
nav.side .grp{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;background:none;border:0;border-radius:8px;cursor:pointer;font:inherit;font-size:12px;text-transform:uppercase;color:var(--navy);font-weight:800;letter-spacing:.6px;margin:8px 0 2px;padding:6px 12px;text-align:left}
nav.side .grp:hover{background:var(--soft)}nav.side .grp .chev{font-size:18px;line-height:1;transition:transform .15s}nav.side .grp[aria-expanded="false"] .chev{transform:rotate(-90deg)}
main{flex:1;min-width:0;padding:18px;max-width:1200px}
h1{font-size:22px;margin:0 0 4px;color:var(--ink)}
h2{font-size:17px;margin:18px 0 8px;color:var(--ink)}
.sub{color:var(--mut);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.kpi .v{font-size:22px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--mut)}
.kpi .n{font-size:12px;color:var(--mut);margin-top:2px}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));align-items:end}
.form .wide{grid-column:1/-1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:#fff;background:var(--rep);font-weight:600;letter-spacing:.3px}
tbody tr:nth-child(even) td{background:#f6f7f9}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl{overflow-x:auto}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;background:#eef1f5;color:var(--mut)}
.pill.ok{background:#e6f6ef;color:var(--ok)}.pill.warn{background:#fdf3e2;color:var(--warn)}.pill.bad{background:#fdeaea;color:var(--bad)}.pill.acc{background:var(--soft);color:var(--acc-d)}
.note{background:#fffbea;border:1px solid #f1e3a6;border-radius:8px;padding:8px 10px;font-size:13px;color:#5c4a0d;margin:8px 0}
.err{color:var(--bad);font-size:14px;margin-top:6px}
.okmsg{color:var(--ok);font-size:14px;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.modal .box{background:#fff;border-radius:12px;max-width:760px;width:100%;padding:18px}
.login{max-width:400px;margin:8vh auto;padding:0 16px}
.login .logo{display:block;width:240px;max-width:80%;margin:0 auto 18px}
.ticket-img{max-width:100%;max-height:340px;border-radius:8px;border:1px solid var(--line)}
.muted{color:var(--mut)}
header.top .muted{color:#dbe4f5!important}
.drop{display:flex;align-items:center;justify-content:center;text-align:center;min-height:110px;border:2px dashed var(--line);border-radius:12px;padding:14px;cursor:pointer;color:var(--mut);background:#fafbfc}
.drop.over{border-color:var(--acc);background:var(--soft);color:var(--acc-d)}
.drop input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
.carga{border-top:1px solid var(--line);padding:10px 0}.carga:first-of-type{border-top:0}.hdr-up{margin-right:10px;background:#fff;color:var(--acc-d)}
@media (max-width:520px){.hdr-up{display:none}}
.drop.ok{border-color:var(--ok);color:var(--ok);background:#f2fbf6}
.right{text-align:right}
[hidden]{display:none!important}
.burger .bd{display:none}
@media (min-width:821px){
  .burger{display:inline-flex;align-items:center;justify-content:center;font-size:18px}
  .burger .bi{display:none}.burger .bd{display:inline}
  body.side-off nav.side{display:none}
}
body.vista-llena main{max-width:none;display:flex;flex-direction:column}
.sw-bar{margin-bottom:8px}
.sw-frame{flex:1;width:100%;min-height:calc(100vh - 150px);border:1px solid var(--line);border-radius:10px;background:#fff}
.nf-item{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;background:#fff}
.nf-item.nf-critico{border-left-color:var(--bad)}.nf-item.nf-atencion{border-left-color:var(--warn)}.nf-item.nf-oportunidad{border-left-color:var(--acc)}
.nf-item p{margin:6px 0;font-size:14px}
.nf-k{display:inline-block;min-width:118px;margin-right:6px;font-size:12px;font-weight:700;text-transform:uppercase;color:var(--navy);letter-spacing:.3px}
.nf-imp{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
@media (max-width:820px){.nf-k{display:block}.sw-frame{min-height:calc(100vh - 190px)}}

@media (max-width:820px){
  .burger{display:inline-flex;align-items:center;justify-content:center}
  nav.side{position:fixed;top:60px;left:0;bottom:0;z-index:30;transform:translateX(-105%);transition:transform .2s;box-shadow:0 10px 30px rgba(0,0,0,.2);overflow:auto}
  nav.side.open{transform:none}
  main{padding:14px}
  table.cards thead{display:none}
  table.cards tr{display:block;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:6px 8px;background:#fff}
  table.cards td{display:flex;justify-content:space-between;gap:10px;border:0;padding:4px 0;text-align:right}
  table.cards td::before{content:attr(data-l);color:var(--mut);font-size:12px;text-align:left}
  table.cards td.n{white-space:normal}
}
.tip{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--acc,#012a72);background:#fff;color:var(--acc,#012a72);font:700 12px/1 Georgia,serif;font-style:italic;cursor:help;vertical-align:2px;padding:0;margin-left:4px;position:relative}
.tip::after{content:'';position:absolute;inset:-12px}
.tip:hover,.tip:focus-visible{background:var(--acc,#012a72);color:#fff;outline:none}
.tipbox{position:fixed;z-index:200;display:none;max-width:min(340px,calc(100vw - 16px));background:#0b1630;color:#eef2f9;border-radius:10px;padding:12px 14px;font-size:13px;font-weight:400;line-height:1.5;box-shadow:0 12px 30px rgba(0,0,0,.28);text-transform:none;letter-spacing:0}
.tipbox b{display:block;font-size:14px;margin-bottom:4px;color:#fff}
.tipbox p{margin:0 0 6px}.tipbox p:last-child{margin:0}
.tipbox .tip-do{color:#ffd77a}
@media print{header.top,nav.side,.noprint,.tipbox,.d2orb-root{display:none!important}main{padding:0;max-width:none}.card{border:1px solid #ddd;break-inside:avoid}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.fz-out .d2orb-root{display:none!important}
</style>
<style>
.chart{width:100%;height:auto;display:block}
.chart .grid line{stroke:var(--line)}
.chart text{font-size:11px;fill:var(--mut)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
.kpi.bad .v{color:var(--bad)}.kpi.ok .v{color:var(--ok)}
.al{border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px;border:1px solid}
.al.alto{background:#fdeaea;border-color:#f3c2c2;color:#7f1d1d}.al.medio{background:#fdf3e2;border-color:#f0d7a6;color:#6b3f06}.al.info{background:#eef4fb;border-color:#cfe0f3;color:#1e3a5f}
.amt-in{color:var(--ok)}.amt-out{color:var(--bad)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs .btn.on{background:var(--soft);border-color:var(--acc);color:var(--acc-d)}
.empty{padding:18px;text-align:center;color:var(--mut)}
.grid>.card{margin-bottom:0}.grid{margin-bottom:14px}
@media (max-width:520px){.sicar-badge,header.top>.muted{display:none}.grid{grid-template-columns:1fr 1fr;gap:8px}.kpi .v{font-size:17px}.grid>.card{padding:10px}}
</style>
<style>
.hero{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:center}
.hero-g{display:flex;flex-direction:column;align-items:center}.gauge{width:100%;max-width:280px}
.nivel{color:#fff;font-weight:700;border-radius:99px;padding:4px 16px;margin-top:-4px}
.part{margin-bottom:10px}.part-h{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:3px}
.hb-t{height:10px;background:#eef1f6;border-radius:99px;overflow:hidden}.hb-t i{display:block;height:100%;border-radius:99px}
.hb{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb-v{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.thermo{position:relative;height:10px;background:#eef1f6;border-radius:99px;margin:6px 0 4px}.thermo i{display:block;height:100%;border-radius:99px}.thermo b{position:absolute;top:-3px;width:2px;height:16px;background:#64748b}
.rings{display:flex;gap:10px}.ring{text-align:center}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.hc{border-radius:6px;padding:5px 4px;font-size:11px;line-height:1.2;text-align:center;min-height:42px;display:flex;flex-direction:column;justify-content:center}.hc span{font-size:10px}
.conc{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:start}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;background:#eef1f6}.stack i{display:block;height:100%}
@media (max-width:820px){.hero,.conc{grid-template-columns:1fr}.rings{width:100%;justify-content:space-around}.grid.two{grid-template-columns:1fr}.hb{grid-template-columns:minmax(80px,40%) 1fr auto}}
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js?v=27" defer></script>
</body>
</html>
