<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CaseGuard — Sign in</title>
<link rel="icon" href="/caseguard/favicon.svg">
<meta name="theme-color" content="#0f2a4a">
<style>
  :root{--bg:#0a1220;--card:#111c30;--line:#233248;--txt:#e9eef7;--mut:#8598b2;--acc:#2f7ad1;--acc2:#0f2a4a;--ok:#3fc06a;--err:#ff8f8f}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#13294a,#0a1220);color:var(--txt)}
  .box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .brand{display:flex;align-items:center;gap:11px;margin-bottom:6px}
  .brand svg{width:34px;height:34px}
  .brand b{font-size:20px;letter-spacing:-.3px}
  .sub{color:var(--mut);font-size:13px;margin:0 0 22px;line-height:1.5}
  label{display:block;font-size:12px;color:var(--mut);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.5px}
  input{width:100%;background:#0b1526;border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:13px;font-size:16px}
  input:focus{outline:none;border-color:var(--acc)}
  button{width:100%;margin-top:20px;background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6}
  .msg{margin-top:14px;font-size:13px;min-height:18px}
  .msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
  .foot{margin-top:18px;font-size:11px;color:var(--mut);text-align:center;line-height:1.5}
</style>
</head>
<body>
  <div class="box">
    <div class="brand">
      <svg viewBox="0 0 48 48" fill="none"><path d="M24 3l17 6v11c0 11-7.3 20.3-17 25C14.3 40.3 7 31 7 20V9l17-6z" fill="#12395f" stroke="#2f7ad1" stroke-width="2"/><path d="M16 24l6 6 11-12" stroke="#3fc06a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <b>CaseGuard</b>
    </div>
    <p class="sub">Administrative Review &amp; Regulatory Escalation. Private, login-only case manager.</p>
    <form id="f">
      <label>Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label>Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button id="btn" type="submit">Sign in</button>
      <div class="msg" id="msg"></div>
    </form>
    <div class="foot">Digit2AI · Confidential case workspace</div>
  </div>
<script>
const f=document.getElementById('f'),msg=document.getElementById('msg'),btn=document.getElementById('btn');
f.addEventListener('submit',async e=>{
  e.preventDefault();btn.disabled=true;msg.className='msg';msg.textContent='Signing in...';
  try{
    const r=await fetch('/caseguard/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});
    const d=await r.json();
    if(r.ok&&d.success){msg.className='msg ok';msg.textContent='Welcome. Loading...';location.href='/caseguard/';}
    else{msg.className='msg err';msg.textContent=d.error||'Invalid credentials';btn.disabled=false;}
  }catch(err){msg.className='msg err';msg.textContent='Network error';btn.disabled=false;}
});
</script>
</body>
</html>
