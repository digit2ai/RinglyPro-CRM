<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="{{BASE}}/manifest.webmanifest">
<link rel="icon" href="{{BASE}}/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{BASE}}/apple-touch-icon.png">
<script>
(function(){try{var t=localStorage.getItem("marapet_theme");if(t==="dark"){
document.documentElement.setAttribute("data-theme","dark");
var m=document.querySelector("meta[name=\"theme-color\"]");if(m)m.setAttribute("content","#14171a");}}catch(e){}}());
</script>
<link rel="stylesheet" href="{{BASE}}/theme.css?v={{VERSION}}">
<title>Offline — MaraPet</title>
<meta name="robots" content="noindex">
</head>
<body>
<main class="mp-wrap" style="max-width:520px;padding-top:64px;text-align:center">
  <img src="{{BASE}}/icon-192.png" alt="" width="56" height="56" style="border-radius:14px">
  <h1 style="font-size:28px;margin-top:18px" data-en="You are offline" data-es="Estás sin conexión">You are offline</h1>
  <p class="mp-mut" data-en="Your dog's readings are safe on the server. Nothing was lost. This page will reload itself when the connection comes back." data-es="Las lecturas de tu perro están a salvo en el servidor. No se perdió nada. Esta página se recargará sola cuando vuelva la conexión.">Your dog's readings are safe on the server. Nothing was lost.</p>
  <button class="mp-btn mp-btn--primary" onclick="location.reload()" data-en="Try again" data-es="Intentar de nuevo">Try again</button>
</main>
<script src="{{BASE}}/js/landing.js?v={{VERSION}}" defer></script>
<script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
