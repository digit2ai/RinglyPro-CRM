<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bank Opportunity Tracker</title>
<style>
  :root { --bg:#0b1220; --card:#121a2b; --line:#22304a; --txt:#e9eef7; --mut:#8a98b0; --accent:#2f6fed; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:radial-gradient(1200px 600px at 50% -10%, #16233c, var(--bg)); color:var(--txt);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; padding:24px; }
  .card { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line);
          border-radius:16px; padding:30px; box-shadow:0 24px 60px rgba(0,0,0,.5); }
  h1 { font-size:19px; margin:0 0 4px; }
  p.sub { color:var(--mut); font-size:13px; margin:0 0 22px; }
  label { display:block; font-size:12px; color:var(--mut); margin:14px 0 6px; }
  input { width:100%; padding:12px; font-size:16px; border-radius:10px; border:1px solid var(--line);
          background:#0e1626; color:var(--txt); }
  button { width:100%; margin-top:20px; padding:13px; font-size:15px; font-weight:600; border:0;
           border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .err { margin-top:14px; font-size:13px; color:#ff8a8a; min-height:18px; }
</style>
</head>
<body>
  <form class="card" id="f">
    <h1>Bank Opportunity Tracker</h1>
    <p class="sub">Private. Owner access only.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button id="go" type="submit">Sign in</button>
    <div class="err" id="err"></div>
  </form>
<script>
document.getElementById('f').addEventListener('submit', async function (e) {
  e.preventDefault();
  var btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = '';
  try {
    var r = await fetch('/citi-tracker/api/v1/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
      body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
    });
    var j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Sign in failed');
    location.href = '/citi-tracker/';
  } catch (ex) { err.textContent = ex.message; btn.disabled = false; }
});
</script>
</body>
</html>
